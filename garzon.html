<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Garzón - Control de Entregas</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; background-color: #f4f6f8; color: #333; }
    .card { background: white; padding: 16px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 16px; }
    .btn { background: #28a745; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; }
    .btn:hover { background: #218838; }
    .btn-danger { background: #dc3545; width: auto; font-size: 0.85rem; }
    .btn-secondary { background: #007bff; margin-top: 10px; }
    input { padding: 10px; width: 100%; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    #qr-container { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    #qrcode { margin: 15px 0; }
    .pedido-card { border-left: 5px solid #28a745; background: #fff; padding: 12px; margin-bottom: 12px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  </style>
</head>
<body>

  <!-- DESCARGA DE QR PARA COCINA -->
  <div class="card" id="seccion-qr">
    <h3>📌 QR de Inicio de Turno</h3>
    <p>Descarga e imprime este código para pegarlo en cocina/barra. Los garzones lo escanearán para iniciar su turno.</p>
    <div id="qr-container">
      <div id="qrcode"></div>
      <button class="btn btn-secondary" onclick="descargarQR()">📥 Descargar QR para Imprimir</button>
    </div>
  </div>

  <!-- CONTROL DE TURNO DE GARZÓN -->
  <div class="card">
    <div id="pantalla-login" style="display:none;">
      <h3>🔑 Iniciar Turno</h3>
      <p>Ingresa tu RUT (solo una vez por turno):</p>
      <input type="text" id="rutInput" placeholder="Ej: 12345678-9">
      <button class="btn" onclick="iniciarTurno()">Iniciar Turno</button>
    </div>

    <div id="pantalla-garzon" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span>🟢 Turno Activo: <strong id="rutGarzonActivo"></strong></span>
        <button class="btn btn-danger" onclick="cerrarTurno()">Cerrar Turno</button>
      </div>
      <hr>
      <h3>📦 Pedidos Pendientes</h3>
      <div id="lista-pedidos">Cargando pedidos...</div>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://appmenu-tavr.onrender.com";

    // Parámetros de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const localActual = urlParams.get('local') || 'demo';

    // 1. Generación de QR de Acceso
    const qrDiv = document.getElementById("qrcode");
    new QRCode(qrDiv, {
      text: window.location.href,
      width: 160,
      height: 160
    });

    function descargarQR() {
      const img = qrDiv.querySelector("img");
      if (img && img.src) {
        const enlace = document.createElement("a");
        enlace.href = img.src;
        enlace.download = `QR_Turno_${localActual}.png`;
        enlace.click();
      } else {
        alert("El QR se está generando, reintenta en un segundo.");
      }
    }

    // 2. Control de Sesión del Turno
    document.addEventListener("DOMContentLoaded", () => {
      const rutGuardado = localStorage.getItem("rutGarzon");
      if (rutGuardado) {
        mostrarPantallaGarzon(rutGuardado);
      } else {
        document.getElementById("pantalla-login").style.display = "block";
      }
    });

    function iniciarTurno() {
      const rut = document.getElementById("rutInput").value.trim();
      if (!rut) return alert("Por favor ingresa tu RUT");

      localStorage.setItem("rutGarzon", rut);
      mostrarPantallaGarzon(rut);
    }

    function cerrarTurno() {
      if (confirm("¿Cerrar el turno de garzón activo?")) {
        localStorage.removeItem("rutGarzon");
        location.reload();
      }
    }

    function mostrarPantallaGarzon(rut) {
      document.getElementById("pantalla-login").style.display = "none";
      document.getElementById("pantalla-garzon").style.display = "block";
      document.getElementById("rutGarzonActivo").innerText = rut;
      cargarPedidos();
    }

    // 3. Consultar y Entregar Pedidos
    async function cargarPedidos() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/pedidos/garzon?local=${localActual}`);
        const pedidos = await res.json();
        
        const contenedor = document.getElementById("lista-pedidos");
        if (!pedidos || pedidos.length === 0) {
          contenedor.innerHTML = "<p>No hay pedidos pendientes por entregar 🎉</p>";
          return;
        }

        contenedor.innerHTML = pedidos.map(p => `
          <div class="pedido-card">
            <h4>Mesa: ${p.mesa} <small>(${p.hora})</small></h4>
            <ul>
              ${p.items.map(i => `<li>${i.nombre} x${i.cantidad || 1}</li>`).join('')}
            </ul>
            <p><strong>Total: $${p.total}</strong></p>
            <button class="btn" onclick="entregarPedido(${p.id})">✅ Entregar a Mesa</button>
          </div>
        `).join('');
      } catch (err) {
        console.error("Error al cargar pedidos:", err);
      }
    }

    async function entregarPedido(idPedido) {
      const rutGarzon = localStorage.getItem("rutGarzon");

      if (!rutGarzon) {
        alert("Tu sesión de turno expiró. Ingresa tu RUT nuevamente.");
        return location.reload();
      }

      try {
        const res = await fetch(`${BACKEND_URL}/api/pedidos/entregar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            local: localActual,
            id: idPedido,
            rutGarzon: rutGarzon
          })
        });

        if (res.ok) {
          cargarPedidos();
        } else {
          const data = await res.json();
          alert("Error: " + data.error);
        }
      } catch (err) {
        alert("Error al registrar la entrega.");
      }
    }

    // Refresco automático cada 8 segundos
    setInterval(() => {
      if (localStorage.getItem("rutGarzon")) cargarPedidos();
    }, 8000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Garzón - Identificador e Historial</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 15px; max-width: 500px; margin: 0 auto; }
    h1 { color: #2196F3; text-align: center; font-size: 20px; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 8px; border-left: 5px solid #2196F3; margin-bottom: 12px; }
    .mesa { font-size: 18px; font-weight: bold; background: #ffe600; color: #000; padding: 2px 8px; border-radius: 4px; display: inline-block; }
    .btn-entregar { background: #4CAF50; color: #fff; border: none; padding: 12px; width: 100%; font-weight: bold; font-size: 14px; border-radius: 4px; margin-top: 10px; cursor: pointer; }
    input { width: 100%; padding: 10px; margin-top: 8px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; }
    ul { padding-left: 20px; margin: 10px 0; }
    
    .stats-box { background: #2a2a2a; border: 1px solid #444; padding: 12px; border-radius: 6px; margin-bottom: 15px; text-align: center; }
  </style>
</head>
<body>

  <h1>🤵 Panel Garzón</h1>
  <p style="text-align:center; color:#aaa; font-size:12px;" id="lbl-local">Cargando...</p>

  <div class="card" id="seccion-login">
    <label style="font-weight:bold;">RUT / ID del Garzón:</label>
    <input type="text" id="rut-garzon" placeholder="Ej: 12345678-9">
    <button class="btn-entregar" style="background:#2196F3; margin-top:10px;" onclick="ingresarGarzon()">Ingresar al Turno</button>
  </div>

  <div id="seccion-panel" style="display:none;">
    <div class="stats-box">
      <span style="font-size:12px; color:#aaa;">Garzón Activo: <strong id="lbl-rut-activo" style="color:#ffe600;">--</strong></span><br>
      <span style="font-size:14px;">Entregas Realizadas Hoy: <strong id="lbl-total-entregas" style="color:#4CAF50;">0</strong></span>
    </div>

    <h3 style="font-size:16px; margin-bottom:10px;">📋 Pedidos Pendientes por Entregar:</h3>
    <div id="lista-pedidos"></div>
  </div>

  <script>
    const API_URL = "https://appmenu-tavr.onrender.com/api";
    const urlParams = new URLSearchParams(window.location.search);
    const localId = urlParams.get('local') || 'default';

    document.getElementById('lbl-local').innerText = "Local: " + localId.toUpperCase();

    let rutActual = localStorage.getItem(`garzon_rut_${localId}`) || '';

    if (rutActual) {
      document.getElementById('rut-garzon').value = rutActual;
      ingresarGarzon();
    }

    function ingresarGarzon() {
      const inputRut = document.getElementById('rut-garzon').value.trim();
      if (!inputRut) return alert("Por favor ingresa tu RUT o ID de Garzón.");

      rutActual = inputRut;
      localStorage.setItem(`garzon_rut_${localId}`, rutActual);

      document.getElementById('seccion-login').style.display = 'none';
      document.getElementById('seccion-panel').style.display = 'block';
      document.getElementById('lbl-rut-activo').innerText = rutActual;

      cargarPedidos();
      cargarHistorialGarzon();
      setInterval(cargarPedidos, 4000);
    }

    async function cargarPedidos() {
      try {
        const res = await fetch(`${API_URL}/pedidos/garzon?local=${localId}`);
        const pedidos = await res.json();
        const cont = document.getElementById('lista-pedidos');
        cont.innerHTML = "";

        if (pedidos.length === 0) {
          cont.innerHTML = "<p style='text-align:center; color:#777; margin-top:20px;'>No hay pedidos pendientes por entregar.</p>";
          return;
        }

        pedidos.forEach(p => {
          const div = document.createElement('div');
          div.className = 'card';

          const conteo = {};
          p.items.forEach(i => conteo[i.nombre] = (conteo[i.nombre] || 0) + 1);
          const itemsTxt = Object.keys(conteo).map(k => `<li><strong>${conteo[k]}x</strong> ${k}</li>`).join('');

          div.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="mesa">Mesa ${p.mesa}</span>
              <small style="color:#aaa;">Hora: ${p.hora}</small>
            </div>
            <ul>${itemsTxt}</ul>
            <div style="text-align:right; font-weight:bold; color:#ffe600; margin-bottom:8px;">Total: $${p.total.toLocaleString('es-CL')}</div>
            <button class="btn-entregar" onclick="entregarPedido(${p.id})">✅ Marcar Entregado en Mesa</button>
          `;
          cont.appendChild(div);
        });
      } catch (err) {
        console.error("Error al obtener pedidos.");
      }
    }

    async function entregarPedido(id) {
      try {
        const res = await fetch(`${API_URL}/pedidos/entregar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ local: localId, id, rutGarzon: rutActual })
        });

        if (res.ok) {
          cargarPedidos();
          cargarHistorialGarzon();
        } else {
          const data = await res.json();
          alert(data.error || "Error al entregar pedido.");
        }
      } catch (err) { alert("Error de conexión al entregar pedido."); }
    }

    async function cargarHistorialGarzon() {
      try {
        const res = await fetch(`${API_URL}/garzon/historial?local=${localId}&rutGarzon=${rutActual}`);
        const historial = await res.json();
        document.getElementById('lbl-total-entregas').innerText = historial.length;
      } catch (err) { console.error("Error al consultar historial."); }
    }
  </script>
</body>
</html>

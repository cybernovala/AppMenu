<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Garzones / Meseros</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111116;
      color: #fff;
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { color: #2196F3; text-align: center; font-size: 22px; }
    .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 20px; }
    .pedido-card {
      background: #1e1e24;
      border-left: 5px solid #2196F3;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .header-pedido { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 10px; }
    .mesa-badge { background: #ffe600; color: #000; padding: 2px 8px; border-radius: 4px; }
    .items-list { list-style: none; padding: 0; margin: 10px 0; }
    .items-list li { font-size: 14px; padding: 4px 0; border-bottom: 1px dashed #333; }
    .btn-deliver {
      width: 100%;
      background: #4CAF50;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>🍽️ Control de Pedidos en Mesa</h1>
  <div class="sub" id="local-title">Cargando restaurante...</div>

  <div id="contenedor-pedidos">
    <p style="text-align:center; color:#aaa;">Cargando pedidos pendientes...</p>
  </div>

  <script>
    const API_URL = "https://appmenu-tavr.onrender.com/api";
    const urlParams = new URLSearchParams(window.location.search);
    const localId = urlParams.get('local') || 'default';

    document.getElementById('local-title').innerText = "LOCAL: " + localId.toUpperCase();

    async function cargarPedidosGarzon() {
      try {
        const res = await fetch(`${API_URL}/pedidos/garzon?local=${localId}`);
        const pedidos = await res.json();
        renderizarPedidos(pedidos);
      } catch (err) {
        console.error("Error conectando al servidor");
      }
    }

    function renderizarPedidos(pedidos) {
      const cont = document.getElementById('contenedor-pedidos');
      cont.innerHTML = "";

      if (pedidos.length === 0) {
        cont.innerHTML = `<p style="text-align:center; color:#888; margin-top:30px;">✅ Todos los pedidos han sido entregados en mesa.</p>`;
        return;
      }

      pedidos.forEach(p => {
        const card = document.createElement('div');
        card.className = "pedido-card";

        const conteo = {};
        p.items.forEach(i => conteo[i.nombre] = (conteo[i.nombre] || 0) + 1);
        const listaItems = Object.keys(conteo).map(k => `<li><strong>${conteo[k]}x</strong> ${k}</li>`).join('');

        card.innerHTML = `
          <div class="header-pedido">
            <span class="mesa-badge">Mesa ${p.mesa}</span>
            <span style="font-size:14px; color:#aaa;">${p.hora} hs</span>
          </div>
          <ul class="items-list">${listaItems}</ul>
          <button class="btn-deliver" onclick="marcarEntregado(${p.id})">✅ Entregado en Mesa</button>
        `;

        cont.appendChild(card);
      });
    }

    async function marcarEntregado(id) {
      try {
        const res = await fetch(`${API_URL}/pedidos/entregar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ local: localId, id })
        });

        if (res.ok) {
          cargarPedidosGarzon();
        } else {
          alert("Error al actualizar pedido.");
        }
      } catch (err) {
        alert("Error de conexión.");
      }
    }

    setInterval(cargarPedidosGarzon, 4000);
    cargarPedidosGarzon();
  </script>
</body>
</html>

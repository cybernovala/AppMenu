<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperAdmin - Control de Licencias y Restaurantes</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: rgba(18, 18, 22, 0.95);
      --neon-orange: #ff5500;
      --neon-yellow: #ffea00;
      --neon-red: #ff3333;
      --neon-green: #00e676;
      --neon-blue: #00d2ff;
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
    }

    .container { max-width: 950px; margin: 0 auto; }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 85, 0, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    h1, h2 {
      font-size: 20px;
      color: var(--neon-yellow);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 15px;
    }

    input, select, textarea {
      padding: 12px;
      background: #121218;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
      flex: 1;
      min-width: 180px;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      font-family: monospace;
      line-height: 1.4;
    }

    .btn {
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      border: none;
      color: #000;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s ease;
    }

    .btn:hover { opacity: 0.9; }

    .btn-secondary { background: #222; color: #fff; border: 1px solid #444; }
    .btn-secondary:hover { background: #333; }

    .btn-danger { background: var(--neon-red); color: #fff; }
    .btn-success { background: var(--neon-green); color: #000; }
    .btn-download { background: var(--neon-blue); color: #000; }

    .local-card {
      background: #121218;
      border: 1px solid #2a2a36;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .local-info b { font-size: 16px; color: var(--neon-blue); }
    .local-info span { font-size: 13px; color: var(--text-muted); display: block; margin-top: 4px; }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-active { background: rgba(0, 230, 118, 0.2); color: var(--neon-green); border: 1px solid var(--neon-green); }
    .badge-disabled { background: rgba(255, 51, 51, 0.2); color: var(--neon-red); border: 1px solid var(--neon-red); }
  </style>
</head>
<body>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1>🛡️ Panel SuperAdmin - Gestión de Locales</h1>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-download" onclick="descargarAppMenuDemo()">📥 Descargar appmenudemo.html</button>
        <button class="btn btn-secondary" onclick="cargarLocales()">🔄 Recargar Lista</button>
      </div>
    </div>

    <!-- CREAR NUEVO LOCAL DIRECTO (DEMO SIN REGISTRARSE) -->
    <div class="card">
      <h2>⚡ Crear Local Demo (Sin Registro)</h2>
      <div class="form-group">
        <input type="text" id="nuevo-nombre-local" placeholder="Nombre del Local (Ej: Resto Bar Mongo)">
        <button class="btn" onclick="crearNuevoLocal()">Crear Local</button>
      </div>
    </div>

    <!-- DAR DE ALTA UN LOCAL (CON NOMBRE, RUT, CORREO Y CLAVE) -->
    <div class="card">
      <h2>📝 Dar de Alta Restaurante (Cliente Oficial)</h2>
      <div class="form-group">
        <input type="text" id="alta-nombre" placeholder="Nombre del Local" oninput="generarMensajeCliente()">
        <input type="text" id="alta-rut" placeholder="RUT Empresa/Cliente" oninput="generarMensajeCliente()">
        <input type="email" id="alta-correo" placeholder="Correo Electrónico" oninput="generarMensajeCliente()">
        <input type="password" id="alta-password" placeholder="Contraseña Admin" oninput="generarMensajeCliente()">
        <button class="btn btn-success" onclick="darDeAltaLocal()">Dar de Alta</button>
      </div>

      <!-- CUADRO DE TEXTO DINÁMICO DE CREDENCIALES -->
      <div style="margin-top: 15px;">
        <label style="font-size: 12px; color: var(--neon-yellow); font-weight: bold; display: block; margin-bottom: 5px;">
          💬 Mensaje de Bienvenida y Acceso para el Cliente:
        </label>
        <textarea id="alta-mensaje-cliente" readonly placeholder="Completa los campos arriba para generar automáticamente las credenciales..."></textarea>
        <button class="btn btn-secondary" style="margin-top: 8px; width: 100%;" onclick="copiarMensajeCliente()">
          📋 Copiar Mensaje para Enviar al Cliente
        </button>
      </div>
    </div>

    <!-- LISTADO DE LOCALES -->
    <div class="card">
      <h2>🏪 Restaurantes Registrados</h2>
      <div id="contenedor-locales">
        <p style="color: var(--text-muted);">Cargando restaurantes desde el servidor...</p>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://appmenu-tavr.onrender.com';

    document.addEventListener("DOMContentLoaded", () => {
      cargarLocales();
    });

    function generarMensajeCliente() {
      const nombre = document.getElementById('alta-nombre').value.trim();
      const rut = document.getElementById('alta-rut').value.trim();
      const correo = document.getElementById('alta-correo').value.trim();
      const password = document.getElementById('alta-password').value.trim();

      const slug = nombre ? nombre.toLowerCase().replace(/[^a-z0-9]/g, '_').replace(/_+/g, '_') : 'tu_local';
      const linkAcceso = `https://cybernovala.github.io/AppMenu/admin.html?local=${slug}`;

      const mensaje = `🎉 ¡Hola! Te damos la bienvenida a tu sistema AppMenu Digital.

📌 Datos de Acceso para tu Local:
• Local / Restaurante: ${nombre || 'Nombre del Restaurante'}
• RUT Registrado: ${rut || 'N/A'}
• Correo de Contacto: ${correo || 'N/A'}
• Contraseña de Admin: ${password || '****'}

🌐 Enlace Directo a tu Panel de Control:
${linkAcceso}

💬 Soporte y Consultas: WhatsApp +56966648585 | appmenunova@gmail.com`;

      document.getElementById('alta-mensaje-cliente').value = mensaje;
    }

    function copiarMensajeCliente() {
      const txtArea = document.getElementById('alta-mensaje-cliente');
      if (!txtArea.value) return alert("Primero completa los campos para generar el mensaje.");
      
      txtArea.select();
      navigator.clipboard.writeText(txtArea.value).then(() => {
        alert("✅ ¡Mensaje copiado al portapapeles exitosamente!");
      }).catch(() => {
        alert("Error al copiar. Selecciónalo manualmente.");
      });
    }

    async function cargarLocales() {
      const cont = document.getElementById('contenedor-locales');
      cont.innerHTML = '<p style="color: var(--text-muted);">Cargando restaurantes...</p>';

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales?_t=${Date.now()}`);
        if (!res.ok) throw new Error("Error al obtener lista");

        const locales = await res.json();

        if (!Array.isArray(locales) || locales.length === 0) {
          cont.innerHTML = '<p style="color: var(--text-muted);">No hay restaurantes registrados aún.</p>';
          return;
        }

        cont.innerHTML = locales.map(l => {
          const idNum = l._id || '--';
          const estaActivo = l.activo !== false;
          const fechaCrea = l.fechaCreacion ? new Date(l.fechaCreacion).toLocaleDateString('es-CL') : 'Sin fecha';
          const esAlta = l.altaRegistrada ? 'OFICIAL' : 'DEMO';

          return `
            <div class="local-card">
              <div class="local-info">
                <b>${l.nombre}</b> (${esAlta})
                <span>Slug URL: <i>${l.localId}</i></span>
                <span>📅 Fecha Creación: <b>${fechaCrea}</b></span>
                ${l.rut ? `<span>RUT: ${l.rut} | Correo: ${l.correo}</span>` : ''}
                <span style="margin-top: 6px;">
                  Estado: <span class="badge ${estaActivo ? 'badge-active' : 'badge-disabled'}">${estaActivo ? 'ACTIVO' : 'BLOQUEADO'}</span>
                </span>
              </div>
              <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="btn btn-download" onclick="descargarAccesoHTML('${l.localId}', '${l.nombre}')">📥 Descargar Acceso HTML</button>
                <button class="btn ${estaActivo ? 'btn-danger' : 'btn-success'}" onclick="cambiarEstadoLicencia('${l.localId}', ${!estaActivo})">
                  ${estaActivo ? '🚫 Bloquear' : '✅ Desbloquear'}
                </button>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        cont.innerHTML = '<p style="color: var(--neon-red);">⚠️ No se pudo conectar con el servidor backend.</p>';
      }
    }

    async function crearNuevoLocal() {
      const nombre = document.getElementById('nuevo-nombre-local').value.trim();
      if (!nombre) return alert("Por favor ingresa el nombre del local.");

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre })
        });

        const data = await res.json();
        if (res.ok) {
          alert(`✅ Restaurante "${data.nombre}" creado exitosamente.`);
          document.getElementById('nuevo-nombre-local').value = '';
          cargarLocales();
        } else {
          alert(`⚠️ Error: ${data.error || 'No se pudo crear el restaurante'}`);
        }
      } catch (err) {
        alert("❌ Error de red al comunicarse con el servidor.");
      }
    }

    async function darDeAltaLocal() {
      const nombre = document.getElementById('alta-nombre').value.trim();
      const rut = document.getElementById('alta-rut').value.trim();
      const correo = document.getElementById('alta-correo').value.trim();
      const password = document.getElementById('alta-password').value.trim();

      if (!nombre || !rut || !correo || !password) {
        return alert("Todos los campos para dar de alta son obligatorios.");
      }

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/alta`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, rut, correo, password })
        });

        const data = await res.json();
        if (res.ok) {
          alert(`✅ Restaurante "${nombre}" se ha dado de alta con éxito.`);
          document.getElementById('alta-nombre').value = '';
          document.getElementById('alta-rut').value = '';
          document.getElementById('alta-correo').value = '';
          document.getElementById('alta-password').value = '';
          document.getElementById('alta-mensaje-cliente').value = '';
          cargarLocales();
        } else {
          alert(`⚠️ Error: ${data.error}`);
        }
      } catch (err) {
        alert("❌ Error de comunicación con el servidor.");
      }
    }

    async function cambiarEstadoLicencia(localId, nuevoEstado) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/${encodeURIComponent(localId)}/licencia`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ activo: nuevoEstado })
        });

        if (res.ok) {
          cargarLocales();
        } else {
          alert("⚠️ No se pudo actualizar la licencia.");
        }
      } catch (err) {
        alert("❌ Error al procesar cambio de licencia.");
      }
    }

    function descargarAccesoHTML(localId, nombreLocal) {
      const urlPanelGithub = `https://cybernovala.github.io/AppMenu/admin.html?local=${encodeURIComponent(localId)}`;
      
      const contenidoHTML = `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Admin - ${nombreLocal}</title>
  <style>
    body { background-color: #08080a; color: #ffffff; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
    .card { background: rgba(18, 18, 22, 0.95); border: 1px solid rgba(255, 85, 0, 0.4); border-radius: 12px; padding: 30px; max-width: 450px; box-shadow: 0 0 20px rgba(255, 85, 0, 0.2); }
    h2 { color: #ffea00; margin-bottom: 10px; text-transform: uppercase; }
    p { color: #a0a0b0; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
    .btn { background: linear-gradient(135deg, #ff5500, #ffea00); color: #000; padding: 14px 28px; font-weight: bold; border-radius: 8px; text-decoration: none; display: inline-block; font-size: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔑 Acceso Administración</h2>
    <p>Haz clic en el botón para ingresar directamente al panel del restaurante <b>${nombreLocal}</b>.</p>
    <a href="${urlPanelGithub}" class="btn">🚀 Abrir Panel de Administración</a>
  </div>
</body>
</html>`;

      const blob = new Blob([contenidoHTML], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `Acceso_${localId}.html`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>

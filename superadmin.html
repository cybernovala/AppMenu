<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperAdmin - Panel Central</title>
  <style>
    :root {
      --bg-dark: #08070d;
      --card-bg: rgba(18, 16, 28, 0.85);
      --neon-orange: #ff5500;
      --neon-pink: #ff007f;
      --neon-yellow: #ffee00;
      --neon-green: #00ff66;
      --neon-blue: #00d2ff;
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 900px; margin: 0 auto; }

    .header-bar {
      background: rgba(18, 18, 24, 0.95);
      border: 1px solid rgba(255, 0, 127, 0.3);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .title {
      font-size: 22px;
      color: var(--neon-yellow);
      font-weight: 800;
      text-transform: uppercase;
    }

    .btn {
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      border: none;
      color: #000;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
    }

    .btn-blue { background: linear-gradient(135deg, var(--neon-blue), #0077ff); color: #fff; }
    .btn-danger { background: #ff3344; color: #fff; padding: 6px 12px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 85, 0, 0.25);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card h3 {
      font-size: 18px;
      color: var(--neon-orange);
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      background: #181822;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
    }

    textarea { resize: vertical; min-height: 80px; }

    .aviso-item {
      background: #14141c;
      border: 1px solid #282838;
      border-radius: 8px;
      padding: 15px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .aviso-info { display: flex; flex-direction: column; gap: 4px; }
    .aviso-dest { font-size: 12px; color: var(--neon-blue); font-weight: bold; }
    .aviso-asunto { font-size: 15px; font-weight: bold; color: var(--neon-yellow); }
    .aviso-texto { font-size: 14px; color: #ddd; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- HEADER GENERAL CON BOTÓN ACCESO DEMO -->
    <div class="header-bar">
      <div class="title">⚡ SuperAdmin - Panel Central</div>
      <a href="https://cybernovala.github.io/AppMenu/demo.html" target="_blank" class="btn btn-blue">
        🌐 Acceder a AppMenu Demo
      </a>
    </div>

    <!-- RECUADRO PARA ENVÍO DE MENSAJES -->
    <div class="card">
      <h3>📢 Enviar Aviso o Mensaje al Panel Admin</h3>
      <div class="form-group">
        <div>
          <label style="font-size: 12px; color: var(--text-muted);">Destinatario (Local ID o "todos")</label>
          <input type="text" id="msg-destinatario" value="todos" placeholder="Ej: todos o prueba3">
        </div>
        <div>
          <label style="font-size: 12px; color: var(--text-muted);">Asunto / Título</label>
          <input type="text" id="msg-asunto" value="Aviso del Sistema" placeholder="Ej: Mantenimiento Programado">
        </div>
        <div>
          <label style="font-size: 12px; color: var(--text-muted);">Contenido del Mensaje</label>
          <textarea id="msg-texto" placeholder="Escribe el mensaje que aparecerá en el banner superior de admin.html..."></textarea>
        </div>
        <button class="btn" onclick="publicarAviso()">🚀 Publicar Mensaje</button>
      </div>
    </div>

    <!-- LISTADO DE MENSAJES PUBLICADOS -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3>📋 Mensajes Activos</h3>
        <button class="btn btn-blue" style="padding: 6px 12px; font-size: 12px;" onclick="cargarAvisos()">🔄 Recargar</button>
      </div>
      <div id="lista-avisos">
        <p style="color: var(--text-muted); text-align: center;">Cargando avisos...</p>
      </div>
    </div>

  </div>

  <script>
    const BACKEND_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://appmenu-tavr.onrender.com';

    document.addEventListener("DOMContentLoaded", () => {
      cargarAvisos();
    });

    async function cargarAvisos() {
      const cont = document.getElementById('lista-avisos');
      try {
        const res = await fetch(`${BACKEND_URL}/api/avisos?_t=${Date.now()}`);
        if (!res.ok) throw new Error("Error al obtener mensajes");

        const avisos = await res.json();
        if (avisos.length === 0) {
          cont.innerHTML = '<p style="color: var(--text-muted); text-align: center;">No hay mensajes activos actualmente.</p>';
          return;
        }

        cont.innerHTML = avisos.map(a => `
          <div class="aviso-item">
            <div class="aviso-info">
              <span class="aviso-dest">🎯 Destinatario: ${a.destinatario || 'todos'}</span>
              <span class="aviso-asunto">${a.asunto || 'Aviso del Sistema'}</span>
              <span class="aviso-texto">${a.texto}</span>
            </div>
            <button class="btn-danger" onclick="eliminarAviso('${a._id}')">🗑️ Eliminar</button>
          </div>
        `).join('');
      } catch (e) {
        cont.innerHTML = '<p style="color: #ff3344; text-align: center;">Error de conexión con el servidor.</p>';
      }
    }

    async function publicarAviso() {
      const destinatario = document.getElementById('msg-destinatario').value.trim();
      const asunto = document.getElementById('msg-asunto').value.trim();
      const texto = document.getElementById('msg-texto').value.trim();

      if (!texto) return alert("Por favor ingresa el texto del mensaje.");

      try {
        const res = await fetch(`${BACKEND_URL}/api/avisos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ destinatario, asunto, texto })
        });

        if (res.ok) {
          alert("✅ Mensaje publicado con éxito.");
          document.getElementById('msg-texto').value = '';
          cargarAvisos();
        } else {
          alert("❌ Error al publicar el mensaje.");
        }
      } catch (e) {
        alert("❌ Error de red con el servidor backend.");
      }
    }

    async function eliminarAviso(id) {
      if (!confirm("¿Deseas eliminar este mensaje? Ya no aparecerá en el panel de los clientes.")) return;
      try {
        const res = await fetch(`${BACKEND_URL}/api/avisos/${id}`, { method: 'DELETE' });
        if (res.ok) {
          cargarAvisos();
        } else {
          alert("❌ Error al eliminar el mensaje.");
        }
      } catch (e) {
        alert("❌ Error de red.");
      }
    }
  </script>
</body>
</html>

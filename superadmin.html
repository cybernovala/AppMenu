<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Superadmin - Gestión de Locales y Licencias</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    .nav-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nav-item a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 8px;
      display: block;
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-item.active a, .nav-item a:hover {
      background-color: var(--accent);
      color: #fff;
    }

    /* Main Container */
    .main-content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 1.8rem;
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-success { background-color: var(--success); }
    .btn-success:hover { background-color: #16a34a; }

    .btn-danger { background-color: var(--danger); }
    .btn-danger:hover { background-color: #dc2626; }

    .btn-warning { background-color: var(--warning); color: #000; }
    .btn-warning:hover { background-color: #d97706; }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background-color: var(--bg-secondary);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .stat-card h3 {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 1.8rem;
      font-weight: bold;
    }

    /* Table Container */
    .card {
      background-color: var(--bg-secondary);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 20px;
    }

    .card-title {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      display: inline-block;
    }

    .badge-active {
      background-color: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid #22c55e;
    }

    .badge-inactive {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .modal {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      padding: 25px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 25px;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      ⚡ SuperAdmin
    </div>
    <ul class="nav-menu">
      <li class="nav-item active"><a href="#">Locales y Licencias</a></li>
      <li class="nav-item"><a href="#">Configuración</a></li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="header">
      <h1>Gestión de Locales y Licencias</h1>
      <button class="btn" onclick="openModal()">+ Nuevo Local</button>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Locales</h3>
        <div class="value" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <h3>Locales Activos</h3>
        <div class="value" id="stat-active" style="color: var(--success);">0</div>
      </div>
      <div class="stat-card">
        <h3>Locales Inactivos</h3>
        <div class="value" id="stat-inactive" style="color: var(--danger);">0</div>
      </div>
    </div>

    <!-- Table -->
    <div class="card">
      <h2 class="card-title">Locales Registrados</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>ID Local</th>
              <th>Nombre del Local</th>
              <th>Fecha Creación</th>
              <th>Expiración Licencia</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="locales-tbody">
            <!-- Renderizado dinámico -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Crear Local -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Crear Nuevo Local</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="form-nuevo-local" onsubmit="guardarLocal(event)">
        <div class="form-group">
          <label for="local-id">ID Único del Local</label>
          <input type="text" id="local-id" class="form-control" placeholder="Ej: local_centro_01" required>
        </div>
        <div class="form-group">
          <label for="local-nombre">Nombre del Local</label>
          <input type="text" id="local-nombre" class="form-control" placeholder="Ej: Sucursal Centro" required>
        </div>
        <div class="form-group">
          <label for="fecha-creacion">Fecha de Creación</label>
          <input type="date" id="fecha-creacion" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="fecha-expiracion">Fecha Expiración Licencia</label>
          <input type="date" id="fecha-expiracion" class="form-control" required>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-success">Guardar y Crear</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Inicializar estado desde LocalStorage
    let locales = JSON.parse(localStorage.getItem('superadmin_locales')) || [];

    // Cargar la fecha de hoy por defecto al abrir el formulario
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('fecha-creacion').valueAsDate = new Date();
      renderTable();
    });

    function openModal() {
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      document.getElementById('form-nuevo-local').reset();
      document.getElementById('fecha-creacion').valueAsDate = new Date();
    }

    function guardarLocal(e) {
      e.preventDefault();

      const id = document.getElementById('local-id').value.trim();
      const nombre = document.getElementById('local-nombre').value.trim();
      const fechaCreacion = document.getElementById('fecha-creacion').value;
      const fechaExpiracion = document.getElementById('fecha-expiracion').value;

      // Verificar si existe
      if (locales.some(l => l.id === id)) {
        alert('El ID de local ya existe. Por favor usa uno diferente.');
        return;
      }

      const nuevoLocal = {
        id,
        nombre,
        fechaCreacion,
        fechaExpiracion,
        activo: true
      };

      locales.push(nuevoLocal);
      persistirYRenderizar();
      closeModal();
    }

    function toggleEstado(id) {
      locales = locales.map(local => {
        if (local.id === id) {
          return { ...local, activo: !local.activo };
        }
        return local;
      });
      persistirYRenderizar();
    }

    function eliminarLocal(id) {
      if (confirm('¿Estás seguro de eliminar este local?')) {
        locales = locales.filter(l => l.id !== id);
        persistirYRenderizar();
      }
    }

    function persistirYRenderizar() {
      localStorage.setItem('superadmin_locales', JSON.stringify(locales));
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('locales-tbody');
      tbody.innerHTML = '';

      let activosCount = 0;

      locales.forEach(local => {
        if (local.activo) activosCount++;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${local.id}</strong></td>
          <td>${local.nombre}</td>
          <td>${local.fechaCreacion}</td>
          <td>${local.fechaExpiracion}</td>
          <td>
            <span class="badge ${local.activo ? 'badge-active' : 'badge-inactive'}">
              ${local.activo ? 'Habilitado' : 'Desactivado'}
            </span>
          </td>
          <td class="actions">
            <button class="btn btn-sm ${local.activo ? 'btn-warning' : 'btn-success'}" onclick="toggleEstado('${local.id}')">
              ${local.activo ? 'Desactivar' : 'Habilitar'}
            </button>
            <button class="btn btn-sm" onclick="descargarHTML('${local.id}')">
              📥 Descargar HTML
            </button>
            <button class="btn btn-sm btn-danger" onclick="eliminarLocal('${local.id}')">
              🗑️
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Actualizar estadísticas
      document.getElementById('stat-total').innerText = locales.length;
      document.getElementById('stat-active').innerText = activosCount;
      document.getElementById('stat-inactive').innerText = locales.length - activosCount;
    }

    // Función para generar y descargar el archivo HTML del Local que leerá el Admin
    function descargarHTML(id) {
      const local = locales.find(l => l.id === id);
      if (!local) return;

      const htmlContent = `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Licencia Local - ${local.nombre}</title>
</head>
<body>
  <script>
    // Configuración de Licencia del Local generada por el SuperAdmin
    window.LICENCIA_LOCAL = ${JSON.stringify(local, null, 2)};
    
    // Auto-guardado en LocalStorage para validación en la App Admin
    localStorage.setItem('licencia_local_activa', JSON.stringify(window.LICENCIA_LOCAL));

    // Validar estado de la licencia
    function validarLicencia() {
      const hoy = new Date().toISOString().split('T')[0];
      const licencia = window.LICENCIA_LOCAL;

      if (!licencia.activo) {
        alert('ERROR: Esta licencia ha sido DESACTIVADA por el SuperAdmin.');
        return false;
      }

      if (hoy > licencia.fechaExpiracion) {
        alert('ERROR: La licencia ha expirado el ' + licencia.fechaExpiracion);
        return false;
      }

      console.log('Licencia válida creada el: ' + licencia.fechaCreacion);
      return true;
    }

    validarLicencia();
  <\/script>
</body>
</html>`;

      const blob = new Blob([htmlContent], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `licencia_${local.id}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>

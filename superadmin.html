<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superadmin - Control de Licencias</title>
  <style>
    :root {
      --bg-dark: #090a10;
      --card-bg: #12131c;
      --neon-pink: #ff007f;
      --neon-orange: #ff5500;
      --neon-green: #00ff66;
      --neon-yellow: #ffee00;
      --neon-blue: #00d2ff;
      --text-main: #ffffff;
      --text-muted: #888899;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid #222;
    }

    h1 {
      font-size: 24px;
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .btn {
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-pink));
      border: none;
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-secondary { background: #222; color: #fff; border: 1px solid #444; }
    .btn-danger { background: #ff2244; }
    .btn-success { background: var(--neon-green); color: #000; }
    .btn-blue { background: var(--neon-blue); color: #000; }

    .global-announcement-card {
      background: var(--card-bg);
      border: 1px solid var(--neon-blue);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 25px;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.15);
    }

    .global-announcement-card h3 {
      font-size: 16px;
      color: var(--neon-blue);
      margin-bottom: 10px;
    }

    .announcement-box {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .announcement-box input {
      flex: 1;
      padding: 10px 12px;
      background: #181926;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-size: 13px;
      min-width: 250px;
    }

    .grid-locales {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .card-local {
      background: var(--card-bg);
      border: 1px solid #222;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .card-local.bloqueado {
      border-color: #ff2244;
      background: rgba(255, 34, 68, 0.05);
    }

    .local-name {
      font-size: 18px;
      color: var(--neon-yellow);
      font-weight: bold;
      margin-bottom: 8px;
    }

    .local-info {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .actions-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .input-mensaje-especifico {
      padding: 8px 10px;
      background: #181926;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-size: 12px;
      width: 100%;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🛡️ Panel Superadmin - Licencias</h1>
      <button class="btn btn-secondary" onclick="cargarLocales()">🔄 Actualizar Lista</button>
    </header>

    <!-- RECUADRO SUPERIOR: ANUNCIO GLOBAL -->
    <div class="global-announcement-card">
      <h3>📢 Enviar Mensaje Banner a TODOS los Locales Activos</h3>
      <p style="color: var(--text-muted); font-size: 12px; margin-bottom: 10px;">
        Escribe un mensaje para mostrar en la parte superior de todos los paneles. Deja en blanco para borrar el mensaje actual.
      </p>
      <div class="announcement-box">
        <input type="text" id="input-anuncio-global" placeholder="Ej: ¡Aviso importante! Saludos a todos los clientes o actualización de precios...">
        <button class="btn btn-blue" onclick="enviarAnuncioGlobal()">🚀 Enviar a Todos</button>
      </div>
    </div>

    <div class="grid-locales" id="contenedor-locales">
      <p style="color: var(--text-muted);">Cargando lista de locales...</p>
    </div>
  </div>

  <script>
    const BACKEND_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://appmenu-tavr.onrender.com';

    document.addEventListener("DOMContentLoaded", () => {
      cargarLocales();
    });

    async function cargarLocales() {
      const contenedor = document.getElementById('contenedor-locales');
      contenedor.innerHTML = '<p style="color: var(--text-muted);">Consultando locales en la base de datos...</p>';

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales`);
        if (!res.ok) throw new Error("Error en servidor");

        const locales = await res.json();

        if (!Array.isArray(locales) || locales.length === 0) {
          contenedor.innerHTML = '<p style="color: var(--text-muted);">No hay locales registrados.</p>';
          return;
        }

        contenedor.innerHTML = locales.map(loc => {
          const estaActivo = loc.activo !== false;
          const estadoClase = estaActivo ? '' : 'bloqueado';
          const estadoTxt = estaActivo ? '✅ Activo' : '🚫 Bloqueado';
          const localIdStr = loc.localId || String(loc.id);

          return `
            <div class="card-local ${estadoClase}">
              <div>
                <div class="local-name">${loc.nombre || localIdStr}</div>
                <div class="local-info">
                  <span><b>ID / Slug:</b> ${localIdStr}</span>
                  <span><b>RUT:</b> ${loc.rut || 'No registrado'}</span>
                  <span><b>Correo:</b> ${loc.correo || 'No registrado'}</span>
                  <span><b>Alta Registrada:</b> ${loc.altaRegistrada ? 'Sí' : 'No (Modo Demo)'}</span>
                  <span><b>Estado:</b> ${estadoTxt}</span>
                  ${loc.anuncio ? `<span style="color: var(--neon-blue); font-size:11px;"><b>Mensaje Actual:</b> "${loc.anuncio}"</span>` : ''}
                </div>
              </div>

              <!-- RECUADRO MENSAJE ESPECÍFICO -->
              <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px; border: 1px solid #333; margin-bottom: 10px;">
                <label style="font-size: 11px; color: var(--neon-yellow);">✉️ Enviar Mensaje a este Local:</label>
                <input type="text" id="input-msg-${localIdStr}" class="input-mensaje-especifico" placeholder="Mensaje específico..." value="${loc.anuncio || ''}">
                <button class="btn btn-blue" style="width:100%; margin-top:6px; padding: 6px;" onclick="enviarMensajeEspecifico('${localIdStr}')">📩 Guardar Mensaje</button>
              </div>

              <div class="actions-grid">
                <button class="btn btn-secondary" onclick="reenviarClave('${localIdStr}')">🔑 Reenviar Clave</button>
                <button class="btn btn-secondary" onclick="descargarDemoHTML('${localIdStr}')">📥 Descargar Acceso HTML</button>
                ${estaActivo 
                  ? `<button class="btn btn-danger" onclick="cambiarEstadoLicencia('${localIdStr}', false)">🚫 Bloquear Acceso</button>`
                  : `<button class="btn btn-success" onclick="cambiarEstadoLicencia('${localIdStr}', true)">✅ Desbloquear Acceso</button>`
                }
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        contenedor.innerHTML = '<p style="color: #ff2244;">⚠️ Error al cargar locales desde el servidor.</p>';
      }
    }

    async function enviarAnuncioGlobal() {
      const mensaje = document.getElementById('input-anuncio-global').value.trim();
      try {
        const res = await fetch(`${BACKEND_URL}/api/anuncio/global`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensaje })
        });
        const data = await res.json();
        alert(data.mensaje || 'Anuncio enviado.');
        cargarLocales();
      } catch (e) {
        alert("Error de conexión al enviar el anuncio global.");
      }
    }

    async function enviarMensajeEspecifico(localSlug) {
      const inputEl = document.getElementById(`input-msg-${localSlug}`);
      const mensaje = inputEl ? inputEl.value.trim() : '';

      try {
        const res = await fetch(`${BACKEND_URL}/api/anuncio/especifico`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ local: localSlug, mensaje })
        });
        const data = await res.json();
        alert(data.mensaje || 'Mensaje guardado para el local.');
        cargarLocales();
      } catch (e) {
        alert("Error de conexión al enviar el mensaje específico.");
      }
    }

    async function reenviarClave(localSlug) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/reenviar-clave`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ local: localSlug })
        });
        const data = await res.json();
        if (res.ok) {
          alert(`🔑 ${data.mensaje}`);
        } else {
          alert(`❌ ${data.error || 'Error al obtener clave'}`);
        }
      } catch (e) {
        alert('Error de conexión con el servidor.');
      }
    }

    async function cambiarEstadoLicencia(localSlug, nuevoEstado) {
      const accion = nuevoEstado ? 'DESBLOQUEAR' : 'BLOQUEAR';
      if (!confirm(`¿Estás seguro de que deseas ${accion} el acceso para "${localSlug}"?`)) return;

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/${encodeURIComponent(localSlug)}/licencia`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ activo: nuevoEstado })
        });

        if (res.ok) {
          alert(`✅ Estado actualizado con éxito.`);
          cargarLocales();
        } else {
          alert(`❌ Error al actualizar estado.`);
        }
      } catch (e) {
        alert('Error de conexión.');
      }
    }

    function descargarDemoHTML(localSlug) {
      const url = `${BACKEND_URL}/admin.html?local=${encodeURIComponent(localSlug)}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>

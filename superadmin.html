<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel SuperAdmin - Crear Cliente</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f0f14; color: #fff; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1 { color: #ff5500; text-align: center; }
    label { font-weight: bold; display: block; margin-top: 15px; }
    input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box; }
    button { background: #ff5500; color: #fff; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 5px; margin-top: 20px; cursor: pointer; }
    .resultado { margin-top: 25px; padding: 15px; background: #1a1a24; border-radius: 8px; display: none; }
    .btn-link { display: block; text-align: center; padding: 10px; margin-top: 10px; background: #333; color: #fff; text-decoration: none; border-radius: 5px; }
  </style>
</head>
<body>

  <h1>🛠️ Generador de Nuevo Cliente</h1>
  
  <label>ID / Slug del Local (Ej: restaurant-don-pedro):</label>
  <input type="text" id="input-slug" placeholder="restaurant-don-pedro">

  <button onclick="generarLinks()">Generar Enlaces del Cliente</button>

  <div class="resultado" id="box-resultado">
    <h3>Enlaces Generados:</h3>
    <a id="link-menu" class="btn-link" style="background:#ff5500;" target="_blank">📱 Ver Menú Cliente (Mesa 1)</a>
    <a id="link-garzon" class="btn-link" style="background:#2196F3;" target="_blank">🤵 Abrir Pantalla de Garzón</a>
  </div>

  <script>
    const URL_BASE = "https://cybernovala.github.io/AppMenu";

    function generarLinks() {
      const slug = document.getElementById('input-slug').value.trim().toLowerCase().replace(/\s+/g, '-');
      if (!slug) return alert('Ingresa un nombre para el local');

      document.getElementById('link-menu').href = `${URL_BASE}/index.html?local=${slug}&mesa=1`;
      document.getElementById('link-garzon').href = `${URL_BASE}/garzon.html?local=${slug}`;
      
      document.getElementById('box-resultado').style.display = 'block';
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛡️ Panel SuperAdmin - Gestión de Locales</title>
  <style>
    :root {
      --bg-dark: #08070d;
      --card-bg: rgba(18, 16, 28, 0.9);
      --neon-orange: #ff5500;
      --neon-yellow: #ffee00;
      --neon-green: #00ff66;
      --neon-blue: #00d2ff;
      --neon-pink: #ff007f;
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }

    h1 { font-size: 22px; color: var(--neon-orange); margin-bottom: 15px; }
    .card { background: var(--card-bg); border: 1px solid #333; border-radius: 10px; padding: 18px; margin-bottom: 20px; }
    
    .btn {
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      border: none; color: #000; padding: 10px 16px; font-weight: bold;
      border-radius: 6px; cursor: pointer; font-size: 13px; margin-right: 5px; margin-top: 5px;
    }
    .btn-secondary { background: #222; color: #fff; border: 1px solid #444; }
    .btn-danger { background: #ff3344; color: #fff; }
    .btn-success { background: var(--neon-green); color: #000; }
    .btn-blue { background: linear-gradient(135deg, var(--neon-blue), #0077ff); color: #fff; }

    input, textarea {
      width: 100%; padding: 10px; background: #161622; border: 1px solid #333; color: #fff; border-radius: 6px; margin-top: 6px; margin-bottom: 10px;
    }

    .local-card {
      background: #12121c; border: 1px solid #2a2a3c; border-radius: 8px; padding: 15px; margin-bottom: 15px;
    }
    .local-header { display: flex; justify-content: space-between; align-items: center; }
    .badge-activo { background: var(--neon-green); color: #000; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
    .badge-bloqueado { background: #ff3344; color: #fff; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🛡️ Panel SuperAdmin - Gestión de Locales</h1>

    <div class="card">
      <button class="btn btn-secondary" onclick="recargarLocales()">🔄 Recargar Lista</button>
    </div>

    <!-- RECUADRO PARA COMUNICADOS GLOBALES -->
    <div class="card" style="border-color: var(--neon-yellow);">
      <h3 style="color: var(--neon-yellow);">📢 Enviar Mensaje General / Aviso de Ajuste de Precios</h3>
      <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Este aviso se mostrará en la parte superior de los paneles de administración de TODOS los locales activos.</p>
      <textarea id="txt-mensaje-global" rows="3" placeholder="Ej: Estimados clientes, se les informa que a contar del 1 de Septiembre los valores de suscripción tendrán un ajuste de tarifa..."></textarea>
      <button class="btn btn-success" onclick="guardarMensajeGlobal()">🚀 Enviar Mensaje Global a Todos los Locales</button>
    </div>

    <!-- CREACIÓN DE LOCALES -->
    <div class="card">
      <h3>⚡ Crear Local Demo (Sin Registro)</h3>
      <input type="text" id="demo-nombre" placeholder="Nombre del restaurante demo">
      <button class="btn" onclick="crearLocalDemo()">Crear Local Demo</button>
    </div>

    <div id="lista-locales">
      <p style="color: var(--text-muted);">Cargando locales...</p>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'https://appmenu-tavr.onrender.com';

    document.addEventListener("DOMContentLoaded", () => {
      recargarLocales();
      cargarMensajeGlobal();
    });

    async function cargarMensajeGlobal() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/mensajes`);
        if (res.ok) {
          const data = await res.json();
          document.getElementById('txt-mensaje-global').value = data.mensajeGlobal || '';
        }
      } catch (e) {}
    }

    async function guardarMensajeGlobal() {
      const mensaje = document.getElementById('txt-mensaje-global').value.trim();
      try {
        const res = await fetch(`${BACKEND_URL}/api/superadmin/mensaje-global`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensaje })
        });
        if (res.ok) alert("✅ Mensaje global actualizado y enviado a todos los clientes.");
        else alert("Error al guardar mensaje global.");
      } catch (e) {
        alert("Error de conexión.");
      }
    }

    async function recargarLocales() {
      const cont = document.getElementById('lista-locales');
      cont.innerHTML = '<p style="color: var(--text-muted);">Cargando restaurantes registrados...</p>';

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales`);
        const locales = await res.json();

        if (!Array.isArray(locales) || locales.length === 0) {
          cont.innerHTML = '<p style="color: var(--text-muted);">No hay locales registrados.</p>';
          return;
        }

        cont.innerHTML = locales.map(loc => `
          <div class="local-card">
            <div class="local-header">
              <h3>[ID: ${loc.id || 1}] ${loc.nombre} ${loc.altaRegistrada ? '(OFICIAL)' : '(DEMO)'}</h3>
              <span class="${loc.activo ? 'badge-activo' : 'badge-bloqueado'}">
                ${loc.activo ? 'ACTIVO' : 'BLOQUEADO'}
              </span>
            </div>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: 5px;">
              Slug URL: <b>${loc.localId}</b> | RUT: ${loc.rut || 'N/A'} | Correo: ${loc.correo || 'N/A'}
            </p>
            <p style="font-size: 12px; color: var(--text-muted); margin-top: 3px;">
              📅 Creación: ${loc.fechaCreacion ? new Date(loc.fechaCreacion).toLocaleDateString('es-CL') : '--'} | 
              ⏳ Vencimiento: ${loc.fechaVencimiento ? new Date(loc.fechaVencimiento).toLocaleDateString('es-CL') : '--'}
            </p>

            <div style="margin-top: 10px;">
              <button class="btn btn-secondary" onclick="reenviarClave('${loc.localId}')">🔑 Reenviar Clave</button>
              <button class="btn ${loc.activo ? 'btn-danger' : 'btn-success'}" onclick="cambiarEstado('${loc.localId}', ${!loc.activo})">
                ${loc.activo ? '🚫 Bloquear Local' : '✅ Desbloquear Local'}
              </button>
            </div>

            <div style="margin-top: 12px; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 6px; border: 1px dashed #333;">
              <label style="font-size: 12px; color: var(--neon-blue);">💬 Mensaje exclusivo para este local:</label>
              <input type="text" id="msg-local-${loc.localId}" value="${loc.mensaje || ''}" placeholder="Ej: Tu pago vence mañana...">
              <button class="btn btn-blue" onclick="guardarMensajeLocal('${loc.localId}')">💾 Guardar Mensaje para este Local</button>
            </div>
          </div>
        `).join('');

      } catch (e) {
        cont.innerHTML = '<p style="color: #ff3344;">Error al cargar la lista de locales.</p>';
      }
    }

    async function crearLocalDemo() {
      const nombre = document.getElementById('demo-nombre').value.trim();
      if (!nombre) return alert("Ingresa un nombre para el local demo.");

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre })
        });

        if (res.ok) {
          document.getElementById('demo-nombre').value = '';
          recargarLocales();
        } else {
          alert("Error al crear local demo.");
        }
      } catch (e) { alert("Error de conexión."); }
    }

    async function reenviarClave(localId) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/reenviar-clave`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ local: localId })
        });
        const data = await res.json();
        alert(data.mensaje);
      } catch (e) { alert("Error al consultar clave."); }
    }

    async function cambiarEstado(localId, activo) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/${localId}/licencia`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ activo })
        });
        if (res.ok) recargarLocales();
      } catch (e) { alert("Error al actualizar estado."); }
    }

    async function guardarMensajeLocal(localId) {
      const mensaje = document.getElementById(`msg-local-${localId}`).value.trim();
      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/${localId}/mensaje`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensaje })
        });
        if (res.ok) alert(`✅ Mensaje guardado correctamente para el local ${localId}`);
      } catch (e) { alert("Error al guardar mensaje."); }
    }
  </script>
</body>
</html>

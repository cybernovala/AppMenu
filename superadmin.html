<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperAdmin - Gestión</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: rgba(18, 18, 22, 0.95);
      --neon-orange: #ff5500;
      --neon-yellow: #ffea00;
      --grad-neon: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 15px;
    }

    .container { max-width: 600px; margin: 0 auto; }

    .section-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 85, 0, 0.3);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 18px;
      color: var(--neon-yellow);
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    input, select {
      width: 100%;
      padding: 10px;
      background: #14141a;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      background: var(--grad-neon);
      border: none;
      color: #000;
      padding: 12px;
      font-weight: bold;
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #14141a;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .btn-del {
      background: #ff3333;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      width: auto;
      cursor: pointer;
    }

    .module-view { display: none; }
    .module-view.active { display: block; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- MÓDULO PRODUCTOS -->
    <div id="modulo-productos" class="module-view">
      <div class="section-card">
        <h2>➕ Agregar Producto</h2>
        <div class="form-group">
          <label>Categoría</label>
          <input type="text" id="prod-categoria" placeholder="Ej: Bebidas, Comida">
        </div>
        <div class="form-group">
          <label>Nombre del Producto</label>
          <input type="text" id="prod-nombre" placeholder="Ej: Hamburguesa Doble">
        </div>
        <div class="form-group">
          <label>Precio ($)</label>
          <input type="number" id="prod-precio" placeholder="Ej: 5900">
        </div>
        <button onclick="guardarProducto()">Guardar Producto</button>
      </div>

      <div class="section-card">
        <h2>📋 Lista de Productos</h2>
        <div id="lista-productos">Cargando...</div>
      </div>
    </div>

    <!-- MÓDULO HISTORIAL -->
    <div id="modulo-historial" class="module-view">
      <div class="section-card">
        <h2>📜 Historial de Ventas</h2>
        <div id="lista-historial">Cargando ventas...</div>
      </div>
    </div>

  </div>

  <script>
    const API_URL = "https://appmenu-tavr.onrender.com/api";
    const urlParams = new URLSearchParams(window.location.search);
    const localId = urlParams.get('local') || 'default';
    const vistaSolicitada = urlParams.get('view') || 'productos';

    // Activar la vista solicitada por el iframe
    if (vistaSolicitada === 'historial') {
      document.getElementById('modulo-historial').classList.add('active');
      cargarHistorial();
    } else {
      document.getElementById('modulo-productos').classList.add('active');
      cargarProductos();
    }

    async function cargarProductos() {
      try {
        const res = await fetch(`${API_URL}/menu?local=${localId}`);
        const data = await res.json();
        const cont = document.getElementById('lista-productos');
        
        if (!data.length) {
          cont.innerHTML = `<p style="color:var(--text-muted)">No hay productos registrados.</p>`;
          return;
        }

        let html = '';
        data.forEach(cat => {
          html += `<h4 style="color:var(--neon-orange); margin:10px 0;">${cat.categoria}</h4>`;
          cat.productos.forEach(p => {
            html += `
              <div class="item-row">
                <div>
                  <strong>${p.nombre}</strong> - $${p.precio.toLocaleString('es-CL')}
                </div>
                <button class="btn-del" onclick="eliminarProducto('${cat.categoria}', '${p.nombre}')">Eliminar</button>
              </div>
            `;
          });
        });
        cont.innerHTML = html;
      } catch (err) {
        document.getElementById('lista-productos').innerHTML = 'Error al cargar productos.';
      }
    }

    async function guardarProducto() {
      const categoria = document.getElementById('prod-categoria').value.trim();
      const nombre = document.getElementById('prod-nombre').value.trim();
      const precio = parseFloat(document.getElementById('prod-precio').value);

      if (!categoria || !nombre || isNaN(precio)) {
        alert('Completa todos los campos correctamente.');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/menu`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ local: localId, categoria, nombre, precio })
        });

        if (res.ok) {
          alert('Producto guardado con éxito');
          document.getElementById('prod-nombre').value = '';
          document.getElementById('prod-precio').value = '';
          cargarProductos();
        } else {
          alert('Error al guardar producto');
        }
      } catch (err) {
        alert('Error de conexión');
      }
    }

    async function eliminarProducto(categoria, nombre) {
      if (!confirm(`¿Eliminar ${nombre}?`)) return;

      try {
        const res = await fetch(`${API_URL}/menu`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ local: localId, categoria, nombre })
        });

        if (res.ok) {
          cargarProductos();
        } else {
          alert('Error al eliminar');
        }
      } catch (err) {
        alert('Error de conexión');
      }
    }

    async function cargarHistorial() {
      try {
        const res = await fetch(`${API_URL}/pedidos?local=${localId}&estado=entregado`);
        const pedidos = await res.json();
        const cont = document.getElementById('lista-historial');

        if (!pedidos.length) {
          cont.innerHTML = `<p style="color:var(--text-muted)">No hay historial de ventas registradadas.</p>`;
          return;
        }

        cont.innerHTML = pedidos.map(p => `
          <div class="item-row" style="flex-direction:column; align-items:flex-start; gap:5px;">
            <div style="display:flex; justify-content:space-between; width:100%;">
              <strong style="color:var(--neon-yellow)">MESA ${p.mesa}</strong>
              <span style="color:var(--text-muted); font-size:12px;">${new Date(p.fecha || Date.now()).toLocaleTimeString()}</span>
            </div>
            <div>Total: $${p.total ? p.total.toLocaleString('es-CL') : '0'}</div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('lista-historial').innerHTML = 'Error al cargar historial.';
      }
    }
  </script>
</body>
</html>

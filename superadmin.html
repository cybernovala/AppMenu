<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperAdmin - Gestión de Restoranes</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: rgba(18, 18, 22, 0.95);
      --neon-orange: #ff5500;
      --neon-yellow: #ffea00;
      --grad-neon: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
    }

    .container { max-width: 750px; margin: 0 auto; }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 85, 0, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    h1, h2 {
      font-size: 18px;
      color: var(--neon-yellow);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px; background: #14141a; border: 1px solid #333;
      color: #fff; border-radius: 6px; font-size: 15px; margin-bottom: 15px;
    }

    button {
      background: var(--grad-neon); border: none; color: #000;
      padding: 12px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 14px;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }

    .btn-block { width: 100%; font-size: 15px; padding: 14px; }

    .result-box {
      display: none; background: #121218; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-top: 15px;
    }

    .local-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #14141a;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 3px solid var(--neon-orange);
    }

    .venc-tag {
      font-size: 12px;
      color: var(--neon-yellow);
      margin-top: 4px;
    }

    .btn-download {
      background: #222;
      color: var(--neon-yellow);
      border: 1px solid var(--neon-yellow);
      font-size: 12px;
      padding: 8px 12px;
    }
    .btn-download:hover {
      background: var(--neon-yellow);
      color: #000;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- REGISTRAR LOCAL Y CREAR CONTRATO -->
    <div class="card">
      <h1>⚡ Crear Nuevo Restoran (Contrato 30 Días)</h1>
      
      <label>Nombre Comercial del Restoran / Cliente</label>
      <input type="text" id="nombre-local" placeholder="Ej: Sushi Valpo, Bar Central">

      <button class="btn-block" onclick="registrarNuevoLocal()">🚀 Registrar Local y Generar Script</button>

      <div id="resultado" class="result-box">
        <h3 style="color:var(--neon-orange); margin-bottom:12px;">✅ Local Creado Exitosamente</h3>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;" id="info-vencimiento"></p>
        
        <button class="btn-block" style="background: #00e676; color: #000;" onclick="descargarScriptActual()">
          📥 Descargar Script Único (.txt)
        </button>
      </div>
    </div>

    <!-- LISTA DE LOCALES CREADOS -->
    <div class="card">
      <h2>📜 Locales Creados y Fechas de Vencimiento</h2>
      <div id="lista-locales">Cargando restoranes...</div>
    </div>

  </div>

  <script>
    const API_URL = "https://appmenu-tavr.onrender.com/api";
    let ultimoLocalCreado = null;

    document.addEventListener("DOMContentLoaded", () => {
      cargarLocales();
    });

    function formatearIdLocal(texto) {
      return texto.toLowerCase().trim().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
    }

    async function registrarNuevoLocal() {
      const inputNombre = document.getElementById('nombre-local').value.trim();
      if (!inputNombre) {
        alert('Por favor ingresa el nombre del restoran.');
        return;
      }

      const localId = formatearIdLocal(inputNombre);
      
      // Fecha actual y calculo a +30 días para vencimiento
      const fechaCreacion = new Date();
      const fechaVencimiento = new Date();
      fechaVencimiento.setDate(fechaCreacion.getDate() + 30);

      const fechaVencISO = fechaVencimiento.toISOString();

      try {
        // Inicialización en base de datos registrando el local con fecha de vencimiento
        await fetch(`${API_URL}/menu`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            local: localId,
            categoria: 'Inicio',
            nombre: 'Producto de Muestra',
            precio: 1000,
            fechaVencimiento: fechaVencISO
          })
        });

        // Respaldar fecha de creación/vencimiento localmente
        localStorage.setItem(`venc_${localId}`, fechaVencimiento.getTime());

        ultimoLocalCreado = {
          nombre: inputNombre,
          id: localId,
          vencimiento: fechaVencimiento.toLocaleDateString('es-CL')
        };

        document.getElementById('info-vencimiento').innerText = `Vencimiento de Mensualidad: ${fechaVencimiento.toLocaleDateString('es-CL')}`;
        document.getElementById('resultado').style.display = 'block';
        document.getElementById('nombre-local').value = '';

        cargarLocales();

      } catch (err) {
        alert('Error al conectar con el servidor.');
      }
    }

    async function cargarLocales() {
      const contenedor = document.getElementById('lista-locales');
      try {
        const res = await fetch(`${API_URL}/locales`);
        let locales = [];
        
        if (res.ok) {
          locales = await res.json();
        }

        if (!locales || locales.length === 0) {
          contenedor.innerHTML = `<p style="color:var(--text-muted)">No hay restoranes registrados aún.</p>`;
          return;
        }

        contenedor.innerHTML = locales.map(loc => {
          const localId = typeof loc === 'string' ? loc : loc.id || loc.local;
          const nombreMostrar = localId.replace(/-/g, ' ').toUpperCase();
          
          // Cálculo de vencimiento basado en respaldo o estimación a 30 días
          const timestampGuardado = localStorage.getItem(`venc_${localId}`);
          let fVenc;
          if (timestampGuardado) {
            fVenc = new Date(parseInt(timestampGuardado));
          } else {
            fVenc = new Date();
            fVenc.setDate(fVenc.getDate() + 30);
          }

          const fechaFormateada = fVenc.toLocaleDateString('es-CL');

          return `
            <div class="local-row">
              <div>
                <strong>${nombreMostrar}</strong>
                <div class="venc-tag">📅 Vencimiento Mensualidad: ${fechaFormateada}</div>
              </div>
              <button class="btn-download" onclick="generarYDescargarTXT('${nombreMostrar}', '${localId}', '${fechaFormateada}')">
                📥 Descargar Script
              </button>
            </div>
          `;
        }).join('');

      } catch (err) {
        contenedor.innerHTML = `<p style="color:var(--text-muted)">No se pudo cargar la lista de locales.</p>`;
      }
    }

    function descargarScriptActual() {
      if (ultimoLocalCreado) {
        generarYDescargarTXT(ultimoLocalCreado.nombre, ultimoLocalCreado.id, ultimoLocalCreado.vencimiento);
      }
    }

    function generarYDescargarTXT(nombreLocal, localId, fechaVenc) {
      const baseUrl = window.location.origin;

      const textoScript = `=====================================================
SCRIPT ÚNICO Y CONFIGURACIÓN DE RESTORAN
=====================================================
CLIENTE / RESTORAN  : ${nombreLocal}
ID SISTEMA          : ${localId}
FECHA VENCIMIENTO   : ${fechaVenc}

-----------------------------------------------------
1. PANEL DE CONTROL Y ADMINISTRACIÓN GENERAL
-----------------------------------------------------
Este enlace abre el Panel Central para gestionar Productos,
Categorías, Historial, QR Garzón y Rango de Mesas:
${baseUrl}/admin.html?local=${localId}

-----------------------------------------------------
2. PANTALLA DE COCINA
-----------------------------------------------------
Enlace para la pantalla o Tablet en Cocina:
${baseUrl}/cocina.html?local=${localId}

-----------------------------------------------------
3. PANTALLA DE GARZONES (TURNO)
-----------------------------------------------------
Enlace directo para Garzones:
${baseUrl}/garzon.html?local=${localId}

-----------------------------------------------------
4. CARTA PÚBLICA DE CLIENTES (MESA 1)
-----------------------------------------------------
${baseUrl}/index.html?local=${localId}&mesa=1

=====================================================
Guarde este archivo como respaldo para la entrega al cliente.
=====================================================`;

      const blob = new Blob([textoScript], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `Script_${localId}.txt`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>

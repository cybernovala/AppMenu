<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>--SuperAdmin - Control de Licencias y Restaurantes</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: rgba(18, 18, 22, 0.95);
      --neon-orange: #ff5500;
      --neon-yellow: #ffea00;
      --neon-red: #ff3333;
      --neon-green: #00e676;
      --neon-blue: #00d2ff;
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 85, 0, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h1, h2 { color: var(--neon-yellow); margin-bottom: 15px; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }

    input, select {
      width: 100%;
      padding: 10px 12px;
      background: #141418;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn {
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      border: none;
      color: #000;
      padding: 10px 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-danger { background: var(--neon-red); color: #fff; }
    .btn-success { background: var(--neon-green); color: #000; }
    .btn-blue { background: var(--neon-blue); color: #000; }
    .btn-sm { padding: 6px 10px; font-size: 12px; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #222; }
    th { background: #121218; color: var(--neon-orange); }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 11px;
    }
    .badge-active { background: rgba(0, 230, 118, 0.2); color: var(--neon-green); border: 1px solid var(--neon-green); }
    .badge-blocked { background: rgba(255, 51, 51, 0.2); color: var(--neon-red); border: 1px solid var(--neon-red); }
  </style>
</head>
<body>

  <div class="container">
    <h1>👑 Panel SuperAdmin - AppMenu</h1>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>➕ Registrar Nuevo Local</h2>
        <a href="AppMenudemo.html" download class="btn btn-blue btn-sm">📥 Descargar Enlace Demo para WhatsApp</a>
      </div>
      <form id="form-crear-local" onsubmit="crearLocal(event)">
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <div style="flex: 2;">
            <label>Nombre del Local</label>
            <input type="text" id="nuevo-nombre" placeholder="Ej: Restaurant El Sol" required>
          </div>
          <div style="flex: 1;">
            <label>RUT</label>
            <input type="text" id="nuevo-rut" placeholder="Ej: 76.123.456-7">
          </div>
          <div style="flex: 1;">
            <label>Correo</label>
            <input type="email" id="nuevo-correo" placeholder="correo@local.com">
          </div>
          <div style="flex: 1;">
            <label>Contraseña Acceso</label>
            <input type="text" id="nuevo-password" placeholder="1234" value="1234">
          </div>
          <div style="display: flex; align-items: flex-end;">
            <button type="submit" class="btn">Crear Local</button>
          </div>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>🏢 Locales Registrados en MongoDB</h2>
      <button class="btn btn-sm" onclick="cargarLocales()">🔄 Cargar Lista</button>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Local</th>
            <th>Nombre</th>
            <th>RUT</th>
            <th>Correo</th>
            <th>Estado</th>
            <th>Vencimiento</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-locales">
          <tr><td colspan="8" style="text-align:center;">Cargando locales...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const BACKEND_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://appmenu-tavr.onrender.com';

    document.addEventListener("DOMContentLoaded", cargarLocales);

    async function cargarLocales() {
      const tbody = document.getElementById('tabla-locales');
      try {
        const res = await fetch(`${BACKEND_URL}/api/locales`);
        const locales = await res.json();

        if (locales.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">No hay locales registrados.</td></tr>';
          return;
        }

        tbody.innerHTML = locales.map(l => {
          const fechaVenc = l.fechaVencimiento ? new Date(l.fechaVencimiento).toLocaleDateString('es-CL') : '--';
          return `
            <tr>
              <td><b>${l.id || '--'}</b></td>
              <td>${l.localId || l.local}</td>
              <td>${l.nombre}</td>
              <td>${l.rut || '--'}</td>
              <td>${l.correo || '--'}</td>
              <td>
                <span class="badge ${l.activo ? 'badge-active' : 'badge-blocked'}">
                  ${l.activo ? 'ACTIVO' : 'BLOQUEADO'}
                </span>
              </td>
              <td>${fechaVenc}</td>
              <td style="display: flex; gap: 5px;">
                <button class="btn btn-sm ${l.activo ? 'btn-danger' : 'btn-success'}" onclick="toggleEstado('${l.localId}', ${!l.activo})">
                  ${l.activo ? 'Bloquear' : 'Desbloquear'}
                </button>
                <button class="btn btn-blue btn-sm" onclick="enviarPasswordSuperadmin('${l.localId}')">
                  ✉️ Enviar Clave
                </button>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color: red;">Error de conexión.</td></tr>';
      }
    }

    async function crearLocal(e) {
      e.preventDefault();
      const nombre = document.getElementById('nuevo-nombre').value;
      const rut = document.getElementById('nuevo-rut').value;
      const correo = document.getElementById('nuevo-correo').value;
      const password = document.getElementById('nuevo-password').value;

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, rut, correo, password })
        });
        if (res.ok) {
          alert("✅ Local creado con éxito en MongoDB.");
          document.getElementById('form-crear-local').reset();
          cargarLocales();
        } else {
          const data = await res.json();
          alert(`⚠️ ${data.error}`);
        }
      } catch (err) { alert("Error al conectar con el servidor."); }
    }

    async function toggleEstado(localId, nuevoEstado) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/${localId}/licencia`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ activo: nuevoEstado })
        });
        if (res.ok) cargarLocales();
      } catch (err) { alert("Error al actualizar estado."); }
    }

    async function enviarPasswordSuperadmin(localId) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/superadmin/enviar-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ localId })
        });
        const data = await res.json();
        if (res.ok) alert("✅ " + data.mensaje);
        else alert("⚠️ " + data.error);
      } catch (err) { alert("Error al enviar contraseña."); }
    }
  </script>
</body>
</html>

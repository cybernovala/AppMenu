<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Super Admin - Control Global</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 800px; margin: 0 auto; }
    h1 { color: #ffe600; text-align: center; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 4px; border: 1px solid #444; box-sizing: border-box; }
    input { background: #2a2a2a; color: #fff; }
    button { font-weight: bold; font-size: 15px; cursor: pointer; border: none; }
    .btn-green { background: #4CAF50; color: white; }
    .btn-blue { background: #2196F3; color: white; }
    .btn-orange { background: #ff9800; color: white; }
    
    .local-card { background: #2a2a2a; padding: 15px; border-radius: 6px; margin-bottom: 12px; border-left: 5px solid #2196F3; }
    .local-card.vencido { border-left-color: #f44336; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .badge-ok { background: rgba(76, 175, 80, 0.2); color: #4CAF50; border: 1px solid #4CAF50; }
    .badge-off { background: rgba(244, 67, 54, 0.2); color: #f44336; border: 1px solid #f44336; }
  </style>
</head>
<body>

  <h1>Panel Super Admin</h1>

  <!-- 1. CLAVE MAESTRA -->
  <div class="card">
    <label for="clave-maestra">Clave Maestra de Super Admin:</label>
    <input type="password" id="clave-maestra" value="superadmin123">
  </div>

  <!-- 2. ALTA DE NUEVO RESTAURANTE -->
  <div class="card">
    <h3>🚀 Alta de Nuevo Restaurante</h3>
    <label for="local-id">RUT o Identificador del Local:</label>
    <input type="text" id="local-id" placeholder="Ej: 77123456-7 o burger-papas">

    <label for="local-pass">Contraseña del Cliente:</label>
    <input type="password" id="local-pass" placeholder="Clave para que el cliente edite su menú">

    <button class="btn-green" onclick="generarPaqueteCliente()">Crear y Descargar Acceso Cliente</button>
  </div>

  <!-- 3. RESPALDOS Y RESTAURACIÓN -->
  <div class="card">
    <h3>💾 Copia de Seguridad y Respaldos</h3>
    <button class="btn-blue" onclick="descargarRespaldo()">📥 Descargar Respaldo JSON</button>
    <hr style="border-color: #333; margin: 15px 0;">
    <input type="file" id="archivo-json" accept=".json">
    <button class="btn-orange" onclick="restaurarServidor()">📤 Restaurar Servidor</button>
  </div>

  <!-- 4. LISTADO DE LOCALES CONTRATADOS (AL FINAL) -->
  <div class="card">
    <h3>🏢 Locales Contratados y Estado de Suscripción</h3>
    <button class="btn-blue" style="margin-bottom: 15px;" onclick="cargarListadoLocales()">🔄 Cargar / Actualizar Lista de Locales</button>
    <div id="contenedor-locales">
      <p style="color:#aaa; text-align:center;">Presiona el botón para listar los locales contratados.</p>
    </div>
  </div>

  <script>
    const API_URL = "https://appmenu-tavr.onrender.com/api";
    const BASE_URL = "https://cybernovala.github.io/AppMenu";

    async function cargarListadoLocales() {
      const clave = document.getElementById('clave-maestra').value;
      try {
        const res = await fetch(`${API_URL}/superadmin/locales?clave=${clave}`);
        if (!res.ok) return alert("Clave Maestra incorrecta.");
        const locales = await res.json();
        
        const cont = document.getElementById('contenedor-locales');
        cont.innerHTML = "";

        if (locales.length === 0) {
          cont.innerHTML = "<p style='color:#aaa; text-align:center;'>No hay locales registrados aún.</p>";
          return;
        }

        locales.forEach(loc => {
          const div = document.createElement('div');
          div.className = `local-card ${loc.activo ? '' : 'vencido'}`;
          div.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <h4 style="margin:0; font-size:16px;">${loc.id.toUpperCase()}</h4>
              <span class="badge ${loc.activo ? 'badge-ok' : 'badge-off'}">
                ${loc.activo ? `${loc.diasRestantes} días restantes` : 'SUSPENDIDO'}
              </span>
            </div>
            <div style="font-size:12px; color:#aaa; margin: 8px 0;">
              <span>📅 Creado: ${loc.fechaCreacion}</span> | 
              <span>⏳ Vence: ${loc.fechaVencimiento}</span> | 
              <span>🍔 Productos: ${loc.totalProductosMenu}</span>
            </div>
            <div style="display:flex; gap:8px; margin-top:10px;">
              <button class="btn-green" style="padding:6px; font-size:12px;" onclick="renovarPago('${loc.id}')">✅ Renovación (+30 días)</button>
              <a href="${BASE_URL}/index.html?local=${loc.id}&mesa=1" target="_blank" style="color:#2196F3; font-size:12px; text-decoration:none; align-self:center;">🔗 Menú Cliente</a>
            </div>
          `;
          cont.appendChild(div);
        });
      } catch (err) {
        alert("Error al cargar locales.");
      }
    }

    async function renovarPago(localKey) {
      const clave = document.getElementById('clave-maestra').value;
      try {
        const res = await fetch(`${API_URL}/superadmin/renovar-pago`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ claveSuperAdmin: clave, local: localKey })
        });
        const data = await res.json();
        if (res.ok) {
          alert(`¡Suscripción renovada para ${localKey}! Nueva fecha: ${data.nuevaFecha}`);
          cargarListadoLocales();
        }
      } catch (err) { alert("Error al renovar."); }
    }

    async function generarPaqueteCliente() {
      const claveSuperAdmin = document.getElementById('clave-maestra').value;
      const idRaw = document.getElementById('local-id').value.trim();
      const passwordCliente = document.getElementById('local-pass').value.trim();

      if (!idRaw || !passwordCliente) return alert("Ingresa RUT/identificador y contraseña.");

      // Limpia RUTs o identificadores (elimina puntos y espacios, mantiene guión)
      const localId = idRaw.toLowerCase().replace(/\./g, '').replace(/\s+/g, '-').replace(/[^a-z0-9_-]/g, '');

      try {
        const res = await fetch(`${API_URL}/superadmin/crear-local`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ claveSuperAdmin, local: localId, passwordCliente })
        });
        const data = await res.json();
        if (!res.ok) return alert("Error: " + data.error);

        descargarArchivoAccesoCliente(localId, passwordCliente, data.fechaVencimiento || 'N/A');

        alert(`Restaurante '${localId}' creado con éxito. Descargando acceso...`);
        cargarListadoLocales();
      } catch (err) {
        return alert("Error de conexión al servidor.");
      }
    }

    function descargarArchivoAccesoCliente(localId, passwordCliente, fechaVencimiento) {
      const htmlContent = `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - ${localId.toUpperCase()}</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 15px; max-width: 900px; margin: 0 auto; }
    h1, h2, h3 { color: #ffe600; text-align: center; margin-top: 5px; }
    .status-bar { background: #222; padding: 10px; border-radius: 6px; text-align: center; font-size: 14px; color: #aaa; border: 1px solid #333; margin-bottom: 15px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { flex: 1; min-width: 110px; padding: 14px; background: #2a2a2a; color: #fff; border: none; font-weight: bold; font-size: 16px; cursor: pointer; border-radius: 6px; }
    .tab-btn.active { background: #ffe600; color: #000; }
    .sec { display: none; }
    .sec.active { display: block; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
    input, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 4px; border: 1px solid #444; box-sizing: border-box; }
    input { background: #2a2a2a; color: #fff; }
    button { background: #ffe600; color: #000; font-weight: bold; border: none; cursor: pointer; }
    .btn-green { background: #4CAF50; color: white; font-size: 16px; padding: 12px; }
    .btn-blue { background: #2196F3; color: white; }
    .btn-red { background: #f44336; color: white; width: auto; padding: 5px 10px; }
    
    /* VISTA DE COCINA MAXIMIZADA */
    .cocina-card { background: #1a1a1a; border-left: 10px solid #ffe600; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
    .cocina-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
    .mesa-badge-lg { background: #ffe600; color: #000; font-size: 26px; font-weight: bold; padding: 5px 15px; border-radius: 6px; }
    .cocina-items { font-size: 22px; line-height: 1.6; margin: 15px 0; padding-left: 25px; font-weight: bold; color: #fff; }
    .cocina-total { font-size: 24px; color: #4CAF50; text-align: right; }

    #qr-box { background: #fff; padding: 15px; border-radius: 8px; display: inline-block; margin-top: 10px; }
    #qr-box img { margin: 0 auto; }
  </style>
</head>
<body>

  <h1>Panel - ${localId.toUpperCase()}</h1>

  <div id="login-sec" class="card">
    <label>Contraseña de Administración:</label>
    <input type="password" id="pass-input" value="${passwordCliente}">
    <button onclick="iniciarSesion()">Ingresar al Panel</button>
  </div>

  <div id="app-sec" style="display:none;">
    <div class="status-bar">
      <span>🔑 Identificador / RUT: <strong>${localId.toUpperCase()}</strong></span> | 
      <span>📅 Servicio Activo Hasta: <strong style="color:#4CAF50;">${fechaVencimiento}</strong></span>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="verTab('cocina')">🍳 Cocina</button>
      <button class="tab-btn" onclick="verTab('garzon')">🤵 Garzón</button>
      <button class="tab-btn" onclick="verTab('qr')">📱 Generar QR</button>
      <button class="tab-btn" onclick="verTab('menu')">🍔 Editar Menú</button>
    </div>

    <!-- 1. VISTA DE COCINA -->
    <div id="tab-cocina" class="sec active">
      <h2>🍳 Comandas de Cocina</h2>
      <div id="lista-pedidos-cocina">Cargando pedidos...</div>
    </div>

    <!-- 2. VISTA DE GARZÓN -->
    <div id="tab-garzon" class="sec">
      <h2>🤵 Pedidos Listos para Entregar</h2>
      <div id="lista-pedidos-garzon">Cargando comandas...</div>
    </div>

    <!-- 3. GENERADOR DE QR -->
    <div id="tab-qr" class="sec">
      <h2>📱 Generador de QR para Mesas</h2>
      <div class="card" style="text-align: center;">
        <label>Número de Mesa:</label>
        <input type="number" id="num-mesa" value="1" min="1" style="text-align: center; font-size: 20px;" onchange="generarQR()">
        <button class="btn-blue" onclick="generarQR()">Generar Código QR</button>
        <div style="margin-top: 15px;">
          <div id="qr-box"></div>
          <p id="qr-link-txt" style="font-size: 13px; color: #aaa; margin-top: 10px; word-break: break-all;"></p>
          <button class="btn-green" style="max-width:300px; margin-top:10px;" onclick="descargarQR()">📥 Descargar QR en Imagen</button>
        </div>
      </div>
    </div>

    <!-- 4. EDICIÓN DE MENÚ -->
    <div id="tab-menu" class="sec">
      <h2>🍔 Editor de Categorías y Productos</h2>
      <div class="card">
        <h3>+ Nueva Categoría</h3>
        <input type="text" id="nueva-cat" placeholder="Ej: Hamburguesas, Bebidas...">
        <button onclick="agregarCategoria()">Agregar Categoría</button>
      </div>
      <div id="editor-menu"></div>
      <button class="btn-green" style="margin-top:15px; padding:15px;" onclick="guardarMenu()">💾 Guardar Menú en Servidor</button>
    </div>
  </div>

  <script>
    const API_URL = "${API_URL}";
    const BASE_URL = "${BASE_URL}";
    const LOCAL_ID = "${localId}";
    let menuData = [];

    function iniciarSesion() {
      document.getElementById('login-sec').style.display = 'none';
      document.getElementById('app-sec').style.display = 'block';
      cargarCocina();
      cargarGarzon();
      cargarMenu();
      generarQR();
      setInterval(() => { cargarCocina(); cargarGarzon(); }, 4000);
    }

    function verTab(tabName) {
      const tabs = ['cocina', 'garzon', 'qr', 'menu'];
      tabs.forEach((t, i) => {
        const btn = document.querySelectorAll('.tab-btn')[i];
        const sec = document.getElementById('tab-' + t);
        if (t === tabName) {
          btn.classList.add('active');
          sec.classList.add('active');
        } else {
          btn.classList.remove('active');
          sec.classList.remove('active');
        }
      });
      if(tabName === 'qr') generarQR();
    }

    async function cargarCocina() {
      try {
        const res = await fetch(API_URL + '/pedidos?local=' + LOCAL_ID);
        const pedidos = await res.json();
        const cont = document.getElementById('lista-pedidos-cocina');
        if (!Array.isArray(pedidos) || pedidos.length === 0) {
          cont.innerHTML = '<p style="text-align:center; color:#888; font-size: 18px;">No hay pedidos pendientes en cocina.</p>';
          return;
        }
        cont.innerHTML = pedidos.map(p => {
          const items = p.items.map(i => '<li>' + i.nombre + '</li>').join('');
          return '<div class="cocina-card">' +
            '<div class="cocina-header">' +
              '<span class="mesa-badge-lg">Mesa ' + p.mesa + '</span>' +
              '<span style="color:#aaa; font-size: 18px;">⏰ ' + (p.hora || '') + '</span>' +
            '</div>' +
            '<ul class="cocina-items">' + items + '</ul>' +
            '<div class="cocina-total"><strong>Total: $' + (p.total || 0).toLocaleString('es-CL') + '</strong></div>' +
          '</div>';
        }).join('');
      } catch(e) {}
    }

    async function cargarGarzon() {
      try {
        const res = await fetch(API_URL + '/pedidos?local=' + LOCAL_ID);
        const pedidos = await res.json();
        const cont = document.getElementById('lista-pedidos-garzon');
        if (!Array.isArray(pedidos) || pedidos.length === 0) {
          cont.innerHTML = '<p style="text-align:center; color:#888; font-size: 18px;">Sin comandas pendientes por entregar.</p>';
          return;
        }
        cont.innerHTML = pedidos.map(p => {
          const items = p.items.map(i => '<li>' + i.nombre + '</li>').join('');
          return '<div class="card">' +
            '<div style="display:flex; justify-content:space-between; align-items:center;">' +
              '<span class="mesa-badge-lg" style="font-size:20px;">Mesa ' + p.mesa + '</span>' +
              '<small style="color:#aaa; font-size:16px;">' + (p.hora || '') + '</small>' +
            '</div>' +
            '<ul style="margin:15px 0; padding-left:25px; font-size:18px;">' + items + '</ul>' +
            '<button class="btn-green" onclick="eliminarOrden(' + p.id + ')">✅ Marcar Entregado y Borrar Orden</button>' +
          '</div>';
        }).join('');
      } catch(e) {}
    }

    async function eliminarOrden(id) {
      try {
        await fetch(API_URL + '/pedidos/entregar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ local: LOCAL_ID, id: id })
        });
        cargarCocina();
        cargarGarzon();
      } catch(e) {
        alert("Error al eliminar la orden.");
      }
    }

    function generarQR() {
      const mesa = document.getElementById('num-mesa').value || 1;
      const urlFinal = BASE_URL + '/index.html?local=' + LOCAL_ID + '&mesa=' + mesa;
      const box = document.getElementById('qr-box');
      box.innerHTML = "";
      if (typeof QRCode !== 'undefined') {
        new QRCode(box, { text: urlFinal, width: 220, height: 220 });
      } else {
        box.innerHTML = '<p style="color:red;">Cargando librería QR...</p>';
      }
      document.getElementById('qr-link-txt').innerText = urlFinal;
    }

    function descargarQR() {
      const img = document.querySelector('#qr-box img');
      const canvas = document.querySelector('#qr-box canvas');
      const mesa = document.getElementById('num-mesa').value || 1;
      let url = "";
      
      if (img && img.src) url = img.src;
      else if (canvas) url = canvas.toDataURL("image/png");

      if (!url) return alert("Primero genera un código QR.");

      const a = document.createElement('a');
      a.href = url;
      a.download = 'QR_Mesa_' + mesa + '_' + LOCAL_ID + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function cargarMenu() {
      try {
        const res = await fetch(API_URL + '/menu?local=' + LOCAL_ID);
        menuData = await res.json();
        renderMenu();
      } catch(e) {}
    }

    function renderMenu() {
      const cont = document.getElementById('editor-menu');
      if(!Array.isArray(menuData)) menuData = [];
      cont.innerHTML = menuData.map((cat, cIdx) => {
        const prods = (cat.productos || []).map((prod, pIdx) => 
          '<div style="display:flex; gap:5px; margin-bottom:5px;">' +
            '<input type="text" value="' + prod.nombre + '" onchange="menuData['+cIdx+'].productos['+pIdx+'].nombre=this.value">' +
            '<input type="number" value="' + prod.precio + '" style="width:100px;" onchange="menuData['+cIdx+'].productos['+pIdx+'].precio=Number(this.value)">' +
            '<button class="btn-red" onclick="eliminarProd('+cIdx+','+pIdx+')">X</button>' +
          '</div>'
        ).join('');

        return '<div class="card">' +
          '<div style="display:flex; justify-content:space-between; align-items:center;">' +
            '<h3>' + cat.categoria + '</h3>' +
            '<button class="btn-red" onclick="eliminarCat('+cIdx+')">Eliminar Categoría</button>' +
          '</div>' +
          '<div style="margin:10px 0;">' + prods + '</div>' +
          '<button onclick="agregarProd('+cIdx+')">+ Agregar Producto</button>' +
        '</div>';
      }).join('');
    }

    function agregarCategoria() {
      const val = document.getElementById('nueva-cat').value.trim();
      if(!val) return;
      menuData.push({ categoria: val, productos: [] });
      document.getElementById('nueva-cat').value = '';
      renderMenu();
    }

    function agregarProd(cIdx) {
      if(!menuData[cIdx].productos) menuData[cIdx].productos = [];
      menuData[cIdx].productos.push({ nombre: 'Nuevo Producto', precio: 1000 });
      renderMenu();
    }

    function eliminarCat(cIdx) { menuData.splice(cIdx, 1); renderMenu(); }
    function eliminarProd(cIdx, pIdx) { menuData[cIdx].productos.splice(pIdx, 1); renderMenu(); }

    async function guardarMenu() {
      const pass = document.getElementById('pass-input').value;
      const res = await fetch(API_URL + '/menu', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ local: LOCAL_ID, password: pass, menu: menuData })
      });
      if(res.ok) alert('¡Menú guardado correctamente en el servidor!');
      else alert('Error al guardar el menú. Revisa la contraseña.');
    }
  <\/script>
</body>
</html>`;

      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `admin_${localId}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function descargarRespaldo() {
      const clave = document.getElementById('clave-maestra').value;
      const res = await fetch(`${API_URL}/superadmin/backup?clave=${clave}`);
      const data = await res.json();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
      a.download = `Respaldo_Menu.json`;
      a.click();
    }

    async function restaurarServidor() {
      const clave = document.getElementById('clave-maestra').value;
      const file = document.getElementById('archivo-json').files[0];
      if (!file) return alert("Selecciona un archivo JSON.");
      const reader = new FileReader();
      reader.onload = async (e) => {
        await fetch(`${API_URL}/superadmin/restore`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clave, backupData: JSON.parse(e.target.result) })
        });
        alert("¡Base de datos restaurada!");
        cargarListadoLocales();
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>

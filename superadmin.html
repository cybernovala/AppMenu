<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperAdmin - Control de Licencias y Restaurantes</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: rgba(18, 18, 22, 0.95);
      --neon-orange: #ff5500;
      --neon-yellow: #ffea00;
      --neon-red: #ff3333;
      --neon-green: #00e676;
      --neon-blue: #00d2ff;
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
    }

    .container { max-width: 900px; margin: 0 auto; }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 85, 0, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    h1, h2 {
      font-size: 20px;
      color: var(--neon-yellow);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 15px;
    }

    input, select {
      padding: 12px;
      background: #121218;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
      flex: 1;
      min-width: 150px;
    }

    .btn {
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      border: none;
      color: #000;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-secondary { background: #222; color: #fff; border: 1px solid #444; }

    .local-card {
      background: #121218;
      border: 1px solid #2a2a36;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .local-info b { font-size: 16px; color: var(--neon-blue); }
    .local-info p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    /* Switch toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 54px;
      height: 28px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333;
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute; content: "";
      height: 20px; width: 20px;
      left: 4px; bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--neon-green); }
    input:checked + .slider:before { transform: translateX(26px); }

    .status-badge {
      font-size: 12px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
    }

    .status-active { background: rgba(0, 230, 118, 0.2); color: var(--neon-green); border: 1px solid var(--neon-green); }
    .status-inactive { background: rgba(255, 51, 51, 0.2); color: var(--neon-red); border: 1px solid var(--neon-red); }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>👑 SuperAdmin - Gestión de Licencias</h1>
      <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">
        Habilita o desactiva la conexión de los restaurantes en MongoDB instantáneamente.
      </p>

      <div class="form-group">
        <input type="text" id="input-buscar-local" placeholder="Nombre o ID del Local (Ej: mongo)">
        <button class="btn btn-secondary" onclick="buscarOAgregarLocal()">🔍 Buscar / Cargar Local</button>
        <button class="btn" onclick="cargarTodosLocales()">🔄 Actualizar Todos</button>
      </div>
    </div>

    <div class="card">
      <h2>Restaurantes Registrados</h2>
      <div id="lista-locales">
        <p style="color: var(--text-muted); text-align: center;">Cargando locales desde MongoDB...</p>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'https://appmenu-tavr.onrender.com';

    document.addEventListener("DOMContentLoaded", () => {
      cargarTodosLocales();
    });

    async function cargarTodosLocales() {
      const contenedor = document.getElementById('lista-locales');
      contenedor.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Consultando MongoDB...</p>';

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales?_t=${Date.now()}`);
        if (!res.ok) throw new Error("Error al obtener la lista");
        const locales = await res.json();

        if (!Array.isArray(locales) || locales.length === 0) {
          contenedor.innerHTML = '<p style="color: var(--text-muted); text-align: center;">No hay locales registrados.</p>';
          return;
        }

        renderizarLocales(locales);
      } catch (err) {
        contenedor.innerHTML = '<p style="color: var(--neon-red); text-align: center;">❌ Error de conexión al backend.</p>';
      }
    }

    function renderizarLocales(locales) {
      const contenedor = document.getElementById('lista-locales');
      contenedor.innerHTML = '';

      locales.forEach(loc => {
        const fVenc = loc.fechaVencimiento ? new Date(loc.fechaVencimiento).toISOString().split('T')[0] : 'Sin fecha';
        const estaActivo = loc.activo === true;

        const card = document.createElement('div');
        card.className = 'local-card';
        card.innerHTML = `
          <div class="local-info">
            <b>${(loc.nombre || loc.localId).toUpperCase()}</b> (ID: ${loc.localId})<br>
            <p style="margin-top:5px;">Vencimiento: <input type="date" id="date-${loc.localId}" value="${fVenc}" style="padding:4px; font-size:12px; min-width:auto;">
            <button class="btn btn-secondary" style="padding:4px 8px; font-size:11px;" onclick="guardarFecha('${loc.localId}')">💾 Guardar Fecha</button></p>
            <p style="margin-top:5px;">
              Estado Actual: 
              <span class="status-badge ${estaActivo ? 'status-active' : 'status-inactive'}">
                ${estaActivo ? 'ACTIVADO' : 'DESACTIVADO'}
              </span>
            </p>
          </div>
          <div>
            <label class="switch">
              <input type="checkbox" ${estaActivo ? 'checked' : ''} onchange="cambiarEstadoLocal('${loc.localId}', this.checked)">
              <span class="slider"></span>
            </label>
          </div>
        `;
        contenedor.appendChild(card);
      });
    }

    async function cambiarEstadoLocal(localId, activo) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/${encodeURIComponent(localId)}/licencia`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ activo })
        });

        if (res.ok) {
          alert(`✅ Local "${localId}" fue ${activo ? 'ACTIVADO' : 'DESACTIVADO'} en MongoDB.`);
          cargarTodosLocales();
        } else {
          alert("❌ Error al actualizar el estado del local.");
        }
      } catch (err) {
        alert("❌ Error de red al comunicarse con el servidor.");
      }
    }

    async function guardarFecha(localId) {
      const nuevaFecha = document.getElementById(`date-${localId}`).value;
      if (!nuevaFecha) return alert("Selecciona una fecha válida.");

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/${encodeURIComponent(localId)}/licencia`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fechaVencimiento: nuevaFecha })
        });

        if (res.ok) {
          alert("✅ Fecha de vencimiento actualizada correctamente.");
          cargarTodosLocales();
        }
      } catch (err) {
        alert("❌ Error de comunicación con el servidor.");
      }
    }

    async function buscarOAgregarLocal() {
      const q = document.getElementById('input-buscar-local').value.trim().toLowerCase();
      if (!q) return cargarTodosLocales();

      try {
        const res = await fetch(`${BACKEND_URL}/api/licencia?local=${encodeURIComponent(q)}&_t=${Date.now()}`);
        if (res.ok) {
          const data = await res.json();
          renderizarLocales([{
            localId: data.local,
            nombre: data.nombre,
            activo: data.activo,
            fechaVencimiento: data.fechaVencimiento
          }]);
        } else {
          alert("Local no encontrado. Creando y habilitando local...");
          cambiarEstadoLocal(q, true);
        }
      } catch (err) {
        alert("Error de red.");
      }
    }
  </script>
</body>
</html>

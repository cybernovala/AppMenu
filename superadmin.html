<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ SuperAdmin - CyberControl System</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #080b10;
      --card-bg: rgba(15, 23, 42, 0.75);
      --neon-blue: #00f0ff;
      --neon-green: #00ff66;
      --neon-purple: #7000ff;
      --neon-pink: #ff007f;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --border-color: rgba(0, 240, 255, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container { max-width: 1100px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 35px; }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.9rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

    input {
      background: rgba(8, 11, 16, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 15px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
    }

    button {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-main { background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue)); color: #fff; }
    .btn-download { background: rgba(0, 255, 102, 0.1); border: 1px solid var(--neon-green); color: var(--neon-green); }
    .btn-download:hover { background: var(--neon-green); color: #000; }
    .btn-renew { background: rgba(255, 0, 127, 0.1); border: 1px solid var(--neon-pink); color: var(--neon-pink); margin-right: 8px; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { font-family: 'Orbitron', sans-serif; color: var(--neon-blue); padding: 14px; text-align: left; border-bottom: 2px solid var(--border-color); }
    td { padding: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

    .badge { padding: 5px 10px; border-radius: 20px; font-weight: 700; font-family: 'Orbitron'; font-size: 0.7rem; }
    .badge-success { background: rgba(0, 255, 102, 0.15); color: var(--neon-green); border: 1px solid var(--neon-green); }
    .badge-danger { background: rgba(255, 0, 127, 0.15); color: var(--neon-pink); border: 1px solid var(--neon-pink); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🛡️ SUPERADMIN CONTROL</h1>
    </header>

    <div class="card">
      <h2>🔑 01. Autenticación Maestra</h2>
      <div class="form-grid">
        <div class="form-group">
          <label for="claveMaestra">Clave Maestra:</label>
          <input type="password" id="claveMaestra" value="superadmin123">
        </div>
      </div>
      <button class="btn-main" onclick="cargarLocales()">🔄 Sincronizar Locales</button>
    </div>

    <div class="card">
      <h2>⚡ 02. Alta de Nuevo Restaurante</h2>
      <div class="form-grid">
        <div class="form-group">
          <label for="nuevoLocal">ID del Local (sin espacios):</label>
          <input type="text" id="nuevoLocal" placeholder="Ej: don_pepe">
        </div>
        <div class="form-group">
          <label for="passwordCliente">Contraseña para el Cliente:</label>
          <input type="password" id="passwordCliente" placeholder="Ej: pass1234">
        </div>
      </div>
      <button class="btn-main" onclick="crearLocal()">🚀 Desplegar Restaurante</button>
    </div>

    <div class="card">
      <h2>📊 03. Estado de Nodos Registrados</h2>
      <table>
        <thead>
          <tr>
            <th>ID Local</th>
            <th>Vencimiento</th>
            <th>Días</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaLocales">
          <tr>
            <td colspan="5" style="text-align:center;">Carga los datos ingresando la clave maestra.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://appmenu-tavr.onrender.com"; 
    const URL_BASE_GITHUB = "https://cybernovala.github.io/AppMenu/admin.html";

    async function cargarLocales() {
      const clave = document.getElementById("claveMaestra").value;
      if (!clave) return alert("Ingresa la clave maestra");

      try {
        const res = await fetch(`${BACKEND_URL}/api/superadmin/locales?clave=${encodeURIComponent(clave)}`);
        const data = await res.json();
        if (!res.ok) return alert(data.error);

        const tbody = document.getElementById("tablaLocales");
        tbody.innerHTML = "";

        data.forEach(local => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><strong style="color: var(--neon-blue); font-family: 'Orbitron';">${local.id}</strong></td>
            <td>${local.fechaVencimiento}</td>
            <td><strong>${local.diasRestantes}</strong> d</td>
            <td>
              <span class="badge ${local.activo ? 'badge-success' : 'badge-danger'}">
                ${local.activo ? 'ONLINE' : 'SUSPENDIDO'}
              </span>
            </td>
            <td>
              <button class="btn-renew" onclick="renovarPago('${local.id}')">➕ 30 Días</button>
              <button class="btn-download" onclick="descargarScriptLocal('${local.id}')">📥 Descargar Script Único</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        alert("Error al conectar con Render");
      }
    }

    async function crearLocal() {
      const claveSuperAdmin = document.getElementById("claveMaestra").value;
      const local = document.getElementById("nuevoLocal").value.trim().toLowerCase().replace(/\s+/g, '_');
      const passwordCliente = document.getElementById("passwordCliente").value;

      if (!local || !passwordCliente) return alert("Rellena todos los campos");

      try {
        const res = await fetch(`${BACKEND_URL}/api/superadmin/crear-local`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ claveSuperAdmin, local, passwordCliente })
        });

        const data = await res.json();
        if (res.ok) {
          alert(`✅ Restaurante '${local}' creado correctamente`);
          document.getElementById("nuevoLocal").value = "";
          document.getElementById("passwordCliente").value = "";
          descargarScriptLocal(local);
          cargarLocales();
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert("Error de conexión");
      }
    }

    async function renovarPago(local) {
      const claveSuperAdmin = document.getElementById("claveMaestra").value;
      if (!confirm(`¿Renovar 30 días para '${local}'?`)) return;

      try {
        const res = await fetch(`${BACKEND_URL}/api/superadmin/renovar-pago`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ claveSuperAdmin, local })
        });

        if (res.ok) {
          alert("✅ Licencia renovada");
          cargarLocales();
        }
      } catch (err) {
        alert("Error al renovar");
      }
    }

    // DESCARGA DE SCRIPT ÚNICO INTEGRADO
    function descargarScriptLocal(idLocal) {
      const urlIntegrada = `${URL_BASE_GITHUB}?local=${idLocal}`;

      const contenidoHTML = `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acceso Sistema - ${idLocal}</title>
  <script>
    localStorage.setItem('localId', '${idLocal}');
    window.location.href = "${urlIntegrada}";
  <\/script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #080b10; color: #00f0ff;">
  <h2>Cargando Sistema Integrado para '${idLocal}'...</h2>
  <p style="color: #94a3b8;">Si no redirige automáticamente, <a href="${urlIntegrada}" style="color: #00ff66;">haz clic aquí</a>.</p>
</body>
</html>`;

      const blob = new Blob([contenidoHTML], { type: 'text/html' });
      const enlace = document.createElement('a');
      enlace.href = URL.createObjectURL(blob);
      enlace.download = `sistema_${idLocal}.html`;
      enlace.click();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperAdmin - AppMenu</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: rgba(18, 18, 22, 0.95);
      --neon-orange: #ff5500;
      --neon-yellow: #ffea00;
      --grad-neon: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
    }

    .container { max-width: 750px; margin: 0 auto; }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 85, 0, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    h1, h2 {
      font-size: 18px;
      color: var(--neon-yellow);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px; background: #14141a; border: 1px solid #333;
      color: #fff; border-radius: 6px; font-size: 15px; margin-bottom: 15px;
    }

    button {
      background: var(--grad-neon); border: none; color: #000;
      padding: 12px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 14px;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }

    .btn-block { width: 100%; font-size: 15px; padding: 14px; }

    .result-box {
      display: none; background: #121218; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-top: 15px;
    }

    .local-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #14141a;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 3px solid var(--neon-orange);
    }

    .venc-tag {
      font-size: 12px;
      color: var(--neon-yellow);
      margin-top: 4px;
    }

    .btn-download {
      background: #222;
      color: var(--neon-yellow);
      border: 1px solid var(--neon-yellow);
      font-size: 12px;
      padding: 8px 12px;
    }
    .btn-download:hover {
      background: var(--neon-yellow);
      color: #000;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- CREACIÓN DE CLIENTES -->
    <div class="card">
      <h1>⚡ Crear Nuevo Restoran / Cliente</h1>
      
      <label>Nombre Comercial del Restoran</label>
      <input type="text" id="nombre-local" placeholder="Ej: Sushi Valpo, Bar Central">

      <button class="btn-block" onclick="registrarNuevoLocal()">🚀 Registrar Cliente y Generar Acceso HTML</button>

      <div id="resultado" class="result-box">
        <h3 style="color:var(--neon-orange); margin-bottom:12px;">✅ Cliente Creado Exitosamente</h3>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;" id="info-vencimiento"></p>
        
        <button class="btn-block" style="background: #00e676; color: #000;" onclick="descargarScriptActual()">
          🌐 Descargar Lanzador Web (.html)
        </button>
      </div>
    </div>

    <!-- LISTADO DE CLIENTES EN MONGO -->
    <div class="card">
      <h2>📜 Clientes Registrados en MongoDB</h2>
      <div id="lista-locales">Cargando restoranes...</div>
    </div>

  </div>

  <script>
    const API_URL = "https://appmenu-tavr.onrender.com/api";
    const GITHUB_PAGES_URL = "https://cybernovala.github.io/AppMenu";

    let ultimoLocalCreado = null;

    document.addEventListener("DOMContentLoaded", () => {
      cargarLocales();
    });

    function formatearIdLocal(texto) {
      return texto.toLowerCase().trim().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
    }

    async function registrarNuevoLocal() {
      const inputNombre = document.getElementById('nombre-local').value.trim();
      if (!inputNombre) {
        alert('Por favor ingresa el nombre del restoran.');
        return;
      }

      const localId = formatearIdLocal(inputNombre);
      
      const fechaCreacion = new Date();
      const fechaVencimiento = new Date();
      fechaVencimiento.setDate(fechaCreacion.getDate() + 30);

      try {
        await fetch(`${API_URL}/menu`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            local: localId,
            categoria: 'General',
            nombre: 'Producto Inicial',
            precio: 1000,
            fechaVencimiento: fechaVencimiento.toISOString()
          })
        });

        localStorage.setItem(`venc_${localId}`, fechaVencimiento.getTime());

        ultimoLocalCreado = {
          nombre: inputNombre,
          id: localId,
          vencimiento: fechaVencimiento.toLocaleDateString('es-CL')
        };

        document.getElementById('info-vencimiento').innerText = `Vencimiento de Contrato: ${fechaVencimiento.toLocaleDateString('es-CL')}`;
        document.getElementById('resultado').style.display = 'block';
        document.getElementById('nombre-local').value = '';

        cargarLocales();

      } catch (err) {
        alert('Error al comunicar con el servidor.');
      }
    }

    async function cargarLocales() {
      const contenedor = document.getElementById('lista-locales');
      try {
        let localesList = [];
        
        // Intentar consultar endpoint directo de locales
        const resLocales = await fetch(`${API_URL}/locales`);
        if (resLocales.ok) {
          localesList = await resLocales.json();
        }

        // Si no responde o está vacío, obtener los locales únicos desde el menú
        if (!localesList || localesList.length === 0) {
          const resMenu = await fetch(`${API_URL}/menu`);
          if (resMenu.ok) {
            const todosLosPlatos = await resMenu.json();
            localesList = [...new Set(todosLosPlatos.map(item => item.local).filter(Boolean))];
          }
        }

        if (!localesList || localesList.length === 0) {
          contenedor.innerHTML = `<p style="color:var(--text-muted)">No hay clientes registrados aún en MongoDB.</p>`;
          return;
        }

        contenedor.innerHTML = localesList.map(item => {
          const localId = typeof item === 'string' ? item : (item.id || item.local || item._id);
          if (!localId) return '';

          const nombreMostrar = localId.replace(/-/g, ' ').toUpperCase();
          
          const timestampGuardado = localStorage.getItem(`venc_${localId}`);
          let fVenc = timestampGuardado ? new Date(parseInt(timestampGuardado)) : new Date();
          if (!timestampGuardado) fVenc.setDate(fVenc.getDate() + 30);

          const fechaFormateada = fVenc.toLocaleDateString('es-CL');

          return `
            <div class="local-row">
              <div>
                <strong>${nombreMostrar}</strong>
                <div class="venc-tag">📅 Vencimiento: ${fechaFormateada}</div>
              </div>
              <button class="btn-download" onclick="generarYDescargarHTML('${nombreMostrar}', '${localId}', '${fechaFormateada}')">
                🌐 Descargar HTML
              </button>
            </div>
          `;
        }).join('');

      } catch (err) {
        contenedor.innerHTML = `<p style="color:var(--text-muted)">Error al cargar la lista desde MongoDB.</p>`;
      }
    }

    function descargarScriptActual() {
      if (ultimoLocalCreado) {
        generarYDescargarHTML(ultimoLocalCreado.nombre, ultimoLocalCreado.id, ultimoLocalCreado.vencimiento);
      }
    }

    function generarYDescargarHTML(nombreLocal, localId, fechaVenc) {
      const urlAdminAbsoluta = `${GITHUB_PAGES_URL}/admin.html?local=${localId}`;

      const contenidoHTML = `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - ${nombreLocal}</title>
  <style>
    body {
      background-color: #08080a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .box {
      background: #121216;
      border: 1px solid #ff5500;
      padding: 30px;
      border-radius: 12px;
      max-width: 400px;
    }
    h1 { color: #ffea00; font-size: 20px; margin-bottom: 10px; }
    p { font-size: 14px; color: #a0a0b0; margin-bottom: 20px; }
    a {
      display: inline-block;
      background: linear-gradient(135deg, #ff5500, #ffea00);
      color: #000;
      text-decoration: none;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>${nombreLocal}</h1>
    <p>Redirigiendo al Panel de Control Web...</p>
    <a href="${urlAdminAbsoluta}">Ingresar Directamente</a>
  </div>
  <script>
    window.location.href = "${urlAdminAbsoluta}";
  <\/script>
</body>
</html>`;

      const blob = new Blob([contenidoHTML], { type: 'text/html;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `Acceso_${localId}.html`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>

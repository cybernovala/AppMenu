<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Superadmin - Control Global de Restaurantes</title>
  <style>
    :root {
      --bg-dark: #0a0a12;
      --card-bg: #141422;
      --accent: #ff007f;
      --green: #00ff66;
      --red: #ff3344;
      --text: #ffffff;
      --text-muted: #8a8a9e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: var(--accent); margin-bottom: 20px; font-size: 24px; text-transform: uppercase; text-align: center; }
    
    .card { background: var(--card-bg); border: 1px solid #28283d; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .form-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    input { flex: 1; padding: 12px; background: #1c1c2e; border: 1px solid #333; color: #fff; border-radius: 6px; min-width: 200px; }
    button { padding: 12px 20px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { opacity: 0.9; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 14px; text-align: left; border-bottom: 1px solid #222; }
    th { background: #10101a; color: var(--accent); font-size: 14px; }
    
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .badge-act { background: rgba(0, 255, 102, 0.2); color: var(--green); border: 1px solid var(--green); }
    .badge-des { background: rgba(255, 51, 68, 0.2); color: var(--red); border: 1px solid var(--red); }
    
    .btn-toggle { padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; border: none; }
    .btn-desactivar { background: var(--red); color: #fff; }
    .btn-activar { background: var(--green); color: #000; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🛡️ Panel Superadministrador</h1>

    <div class="card">
      <h3>➕ Registrar / Habilitar Nuevo Restaurante</h3>
      <div class="form-row" style="margin-top: 15px;">
        <input type="text" id="input-local-nuevo" placeholder="Nombre único del local (ej: restaurante1)">
        <button onclick="crearOActivarLocal()">Registrar / Habilitar</button>
      </div>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3>🏬 Lista de Restaurantes en Sistema</h3>
        <button style="background: #222; border: 1px solid #444;" onclick="cargarLocales()">🔄 Actualizar</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Nombre del Local</th>
            <th>Estado Mongo</th>
            <th>Fecha Registro</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tabla-locales">
          <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Cargando restaurantes...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'https://appmenu-tavr.onrender.com';

    document.addEventListener("DOMContentLoaded", cargarLocales);

    async function cargarLocales() {
      const tbody = document.getElementById('tabla-locales');
      try {
        const res = await fetch(`${BACKEND_URL}/api/superadmin/locales?_t=${Date.now()}`);
        if (!res.ok) throw new Error("Error obteniendo locales");
        const locales = await res.json();

        if (locales.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No hay restaurantes registrados.</td></tr>';
          return;
        }

        tbody.innerHTML = locales.map(l => {
          const estaActivo = l.activo !== false;
          return `
            <tr>
              <td><b>${l.nombre.toUpperCase()}</b></td>
              <td><span class="badge ${estaActivo ? 'badge-act' : 'badge-des'}">${estaActivo ? 'ACTIVO' : 'DESACTIVADO'}</span></td>
              <td>${new Date(l.createdAt || Date.now()).toLocaleDateString('es-CL')}</td>
              <td>
                <button class="btn-toggle ${estaActivo ? 'btn-desactivar' : 'btn-activar'}" onclick="toggleEstado('${l.nombre}', ${!estaActivo})">
                  ${estaActivo ? '🚫 Desactivar' : '✅ Activar'}
                </button>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--red);">Error al conectar con la base de datos.</td></tr>';
      }
    }

    async function toggleEstado(localNombre, nuevoEstado) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/superadmin/locales/toggle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ local: localNombre, activo: nuevoEstado })
        });
        if (res.ok) cargarLocales();
      } catch (err) {
        alert("Error al cambiar el estado del restaurante.");
      }
    }

    async function crearOActivarLocal() {
      const input = document.getElementById('input-local-nuevo');
      const nombre = input.value.trim().toLowerCase();
      if (!nombre) return alert("Ingresa un nombre válido.");

      await toggleEstado(nombre, true);
      input.value = '';
    }
  </script>
</body>
</html>

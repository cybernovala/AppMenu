<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperAdmin - Panel de Licencias AppMenu</title>

  <style>
    :root {
      --bg-dark: #09090e;
      --card-bg: rgba(18, 16, 26, 0.95);
      --neon-orange: #ff5500;
      --neon-pink: #ff007f;
      --neon-yellow: #ffee00;
      --neon-green: #00ff66;
      --neon-red: #ff2255;
      --neon-blue: #00d2ff;
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
      --border-color: rgba(255, 85, 0, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--border-color);
    }

    h1 {
      font-size: 24px;
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      font-weight: 900;
    }

    .btn {
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      border: none;
      color: #000;
      padding: 10px 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.9; }
    .btn-danger { background: linear-gradient(135deg, var(--neon-red), #aa0022); color: #fff; }
    .btn-success { background: linear-gradient(135deg, var(--neon-green), #00aa44); color: #000; }
    .btn-blue { background: linear-gradient(135deg, var(--neon-blue), #0066cc); color: #fff; }
    .btn-secondary { background: #222; color: #fff; border: 1px solid #444; }

    .grid-locales {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    .card-local {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .card-local.bloqueado {
      border-color: var(--neon-red);
      opacity: 0.85;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .local-nombre {
      font-size: 18px;
      font-weight: bold;
      color: var(--neon-yellow);
    }

    .badge-estado {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }

    .badge-activo { background: rgba(0, 255, 102, 0.2); color: var(--neon-green); border: 1px solid var(--neon-green); }
    .badge-inactivo { background: rgba(255, 34, 85, 0.2); color: var(--neon-red); border: 1px solid var(--neon-red); }

    .info-row {
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .info-row b { color: #fff; }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 15px;
    }

    .global-card {
      background: var(--card-bg);
      border: 1px solid var(--neon-blue);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: #12121a;
      border: 1px solid #333;
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 6px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>⚡ SuperAdmin AppMenu</h1>
      <button class="btn btn-secondary" onclick="cargarLocales()">🔄 Actualizar Lista</button>
    </header>

    <!-- RECUADRO PARA MENSAJE GLOBAL A TODOS LOS CLIENTES -->
    <div class="global-card">
      <h3 style="color: var(--neon-blue); margin-bottom: 8px;">📢 Enviar Mensaje Global a Todos los Clientes Activos</h3>
      <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 10px;">Este aviso se mostrará en el banner superior del frontend de todos los restaurantes.</p>
      <textarea id="txt-mensaje-global" rows="2" placeholder="Escribe tu anuncio global aquí... Ej: 'Aviso: Actualización del servicio hoy a las 23:00 hrs'"></textarea>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-blue" onclick="guardarMensajeGlobal()">🚀 Publicar Mensaje Global</button>
        <button class="btn btn-secondary" onclick="borrarMensajeGlobal()">🗑️ Quitar Mensaje Global</button>
      </div>
    </div>

    <div class="grid-locales" id="contenedor-locales">
      <p style="color: var(--text-muted);">Cargando lista de locales desde MongoDB Atlas...</p>
    </div>
  </div>

  <script>
    const BACKEND_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://appmenu-tavr.onrender.com';

    document.addEventListener("DOMContentLoaded", () => {
      cargarMensajeGlobal();
      cargarLocales();
    });

    async function cargarMensajeGlobal() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/mensajes/global`);
        if (res.ok) {
          const data = await res.json();
          document.getElementById('txt-mensaje-global').value = data.mensaje || '';
        }
      } catch (e) {}
    }

    async function guardarMensajeGlobal() {
      const mensaje = document.getElementById('txt-mensaje-global').value;
      try {
        const res = await fetch(`${BACKEND_URL}/api/mensajes/global`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensaje })
        });
        if (res.ok) alert("✅ Mensaje global actualizado con éxito.");
        else alert("Error al guardar mensaje global.");
      } catch (e) {
        alert("Error de conexión.");
      }
    }

    async function borrarMensajeGlobal() {
      document.getElementById('txt-mensaje-global').value = '';
      await guardarMensajeGlobal();
    }

    async function cargarLocales() {
      const cont = document.getElementById('contenedor-locales');
      cont.innerHTML = '<p style="color: var(--text-muted);">Consultando la base de datos...</p>';

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales?_t=${Date.now()}`);
        if (!res.ok) throw new Error("Error al obtener lista de locales");

        const locales = await res.json();

        if (!Array.isArray(locales) || locales.length === 0) {
          cont.innerHTML = '<p style="color: var(--text-muted);">No hay locales registrados.</p>';
          return;
        }

        cont.innerHTML = locales.map(l => {
          const estaActivo = l.activo !== false;
          const localSlug = l.localId || String(l.id);
          const fechaVenc = l.fechaVencimiento ? new Date(l.fechaVencimiento).toLocaleDateString('es-CL') : 'N/A';

          return `
            <div class="card-local ${!estaActivo ? 'bloqueado' : ''}">
              <div>
                <div class="card-header">
                  <span class="local-nombre">${l.nombre || localSlug}</span>
                  <span class="badge-estado ${estaActivo ? 'badge-activo' : 'badge-inactivo'}">
                    ${estaActivo ? 'ACTIVO' : 'BLOQUEADO'}
                  </span>
                </div>

                <div class="info-row"><b>ID Local:</b> ${localSlug}</div>
                <div class="info-row"><b>RUT:</b> ${l.rut || 'No registrado'}</div>
                <div class="info-row"><b>Correo:</b> ${l.correo || 'No registrado'}</div>
                <div class="info-row"><b>Contraseña:</b> ${l.password || '1234'}</div>
                <div class="info-row"><b>Vencimiento:</b> ${fechaVenc}</div>

                <!-- RECUADRO DE MENSAJE ESPECÍFICO DE LOCAL -->
                <div style="margin-top: 10px; border-top: 1px dashed #333; padding-top: 8px;">
                  <label style="font-size: 11px; color: var(--neon-blue); font-weight: bold;">💬 Mensaje para este local:</label>
                  <input type="text" id="msj-local-${localSlug}" value="${l.mensajeIndividual || ''}" placeholder="Ej: Saludos o ajuste de precios...">
                  <button class="btn btn-blue" style="width: 100%; font-size: 11px; padding: 6px;" onclick="guardarMensajeLocal('${localSlug}')">💾 Guardar Mensaje Local</button>
                </div>
              </div>

              <div class="actions-grid">
                <button class="btn btn-secondary" onclick="reenviarClave('${localSlug}')">🔑 Reenviar Clave</button>
                <button class="btn btn-blue" onclick="descargarAccesoHTML('${localSlug}', '${l.nombre || localSlug}')">📥 Descargar Acceso HTML</button>
                <button class="btn ${estaActivo ? 'btn-danger' : 'btn-success'}" style="grid-column: span 2;" onclick="cambiarEstadoLicencia('${localSlug}', ${!estaActivo})">
                  ${estaActivo ? '🚫 Bloquear Local' : '✅ Desbloquear Local'}
                </button>
              </div>
            </div>
          `;
        }).join('');

      } catch (e) {
        cont.innerHTML = '<p style="color: var(--neon-red);">⚠️ Error al cargar los restaurantes.</p>';
      }
    }

    async function guardarMensajeLocal(localSlug) {
      const input = document.getElementById(`msj-local-${localSlug}`);
      const mensaje = input ? input.value : '';

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/${encodeURIComponent(localSlug)}/mensaje`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensaje })
        });
        if (res.ok) alert(`✅ Mensaje guardado para el local ${localSlug.toUpperCase()}`);
        else alert("Error al guardar mensaje.");
      } catch (e) {
        alert("Error de conexión al servidor.");
      }
    }

    async function reenviarClave(localSlug) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/reenviar-clave`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ local: localSlug })
        });
        const data = await res.json();
        if (res.ok) alert(`✉️ ${data.mensaje}`);
        else alert(`Error: ${data.error}`);
      } catch (e) {
        alert("Error de conexión.");
      }
    }

    async function cambiarEstadoLicencia(localSlug, nuevoEstado) {
      const accion = nuevoEstado ? "desbloquear" : "bloquear";
      if (!confirm(`¿Estás seguro de que deseas ${accion} el local "${localSlug}"?`)) return;

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/${encodeURIComponent(localSlug)}/licencia`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ activo: nuevoEstado })
        });

        if (res.ok) {
          alert(`✅ Local ${accion}do exitosamente.`);
          cargarLocales();
        } else {
          alert("❌ No se pudo cambiar el estado.");
        }
      } catch (e) {
        alert("Error de conexión.");
      }
    }

    function descargarAccesoHTML(localSlug, nombreLocal) {
      const contenidoHTML = `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acceso Directo - ${nombreLocal}</title>
  <script>
    window.location.href = "https://appmenu-tavr.onrender.com/admin.html?local=${localSlug}";
  <\/script>
</head>
<body>
  <p>Redirigiendo a ${nombreLocal}...</p>
</body>
</html>`;

      const blob = new Blob([contenidoHTML], { type: 'text/html' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `Acceso_${localSlug}.html`;
      link.click();
    }
  </script>
</body>
</html>

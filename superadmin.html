<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel SuperAdmin - Gestión de Locales y Licencias</title>
  <style>
    :root {
      --bg-dark: #09090e;
      --card-bg: rgba(20, 20, 30, 0.9);
      --neon-orange: #ff5500;
      --neon-pink: #ff007f;
      --neon-yellow: #ffee00;
      --neon-green: #00ff66;
      --neon-blue: #00d2ff;
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
      --border-color: rgba(255, 85, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    header {
      background: var(--card-bg);
      border: 1px solid var(--neon-pink);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    h1 {
      font-size: 22px;
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .section-card h2 {
      font-size: 16px;
      color: var(--neon-yellow);
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      align-items: end;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      background: #14141f;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn {
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      border: none;
      color: #000;
      padding: 10px 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.9; }
    .btn-green { background: var(--neon-green); color: #000; }
    .btn-danger { background: #ff3344; color: #fff; }
    .btn-blue { background: linear-gradient(135deg, var(--neon-blue), #0077ff); color: #fff; }

    .table-wrapper { overflow-x: auto; margin-top: 15px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #222;
    }

    th { background: #12121c; color: var(--neon-yellow); }

    .status-badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      display: inline-block;
    }

    .status-active { background: rgba(0, 255, 102, 0.15); color: var(--neon-green); border: 1px solid var(--neon-green); }
    .status-blocked { background: rgba(255, 51, 68, 0.15); color: #ff3344; border: 1px solid #ff3344; }

    .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>👑 Panel SuperAdmin - AppMenu</h1>
        <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Control de Locales, Licencias y Accesos Demos</p>
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-blue" onclick="descargarDemoHTML()">📥 Descargar appmenudemo.html</button>
        <button class="btn" onclick="cargarLocales()">🔄 Actualizar Tabla</button>
      </div>
    </header>

    <!-- CREAR NUEVO LOCAL -->
    <div class="section-card">
      <h2>➕ Registrar Nuevo Local / Restaurante</h2>
      <div class="form-grid">
        <div>
          <label style="font-size: 11px; color: var(--text-muted);">Nombre Comercial</label>
          <input type="text" id="nuevo-nombre" placeholder="Ej: Pizzería Roma">
        </div>
        <div>
          <label style="font-size: 11px; color: var(--text-muted);">RUT Empresa / Titular</label>
          <input type="text" id="nuevo-rut" placeholder="Ej: 76123456-7">
        </div>
        <div>
          <label style="font-size: 11px; color: var(--text-muted);">Correo de Contacto</label>
          <input type="email" id="nuevo-correo" placeholder="contacto@pizzeria.cl">
        </div>
        <div>
          <label style="font-size: 11px; color: var(--text-muted);">Contraseña Inicial</label>
          <input type="text" id="nuevo-pass" value="1234">
        </div>
        <div>
          <button class="btn btn-green" onclick="crearLocalSuperAdmin()">✅ Crear Restaurante</button>
        </div>
      </div>
    </div>

    <!-- LISTA DE LOCALES -->
    <div class="section-card">
      <h2>📋 Locales Registrados y Estado de Licencias</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Local (Slug)</th>
              <th>Nombre Comercial</th>
              <th>RUT</th>
              <th>Correo</th>
              <th>Creación</th>
              <th>Vencimiento</th>
              <th>Estado</th>
              <th>Acciones de Licencia</th>
            </tr>
          </thead>
          <tbody id="tabla-locales-body">
            <tr>
              <td colspan="9" style="text-align: center; color: var(--text-muted);">Cargando locales desde el servidor...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://appmenu-tavr.onrender.com';

    document.addEventListener("DOMContentLoaded", () => {
      cargarLocales();
    });

    async function cargarLocales() {
      const tbody = document.getElementById('tabla-locales-body');
      tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; color: var(--text-muted);">Cargando locales...</td></tr>';

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales?_t=${Date.now()}`);
        if (!res.ok) throw new Error("Error al obtener los locales");
        const locales = await res.json();

        if (!Array.isArray(locales) || locales.length === 0) {
          tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; color: var(--text-muted);">No hay locales registrados aún.</td></tr>';
          return;
        }

        tbody.innerHTML = locales.map(l => {
          const id = l.id || '--';
          const localId = l.localId || l.local || '';
          const nombre = l.nombre || localId;
          const rut = l.rut || 'N/A';
          const correo = l.correo || 'N/A';
          const fCreacion = l.fechaCreacion ? new Date(l.fechaCreacion).toLocaleDateString('es-CL') : '--';
          const fVenc = l.fechaVencimiento ? new Date(l.fechaVencimiento).toLocaleDateString('es-CL') : '--';
          const activo = l.activo !== false;

          return `
            <tr>
              <td><b>#${id}</b></td>
              <td><code>${localId}</code></td>
              <td><b>${nombre}</b></td>
              <td>${rut}</td>
              <td>${correo}</td>
              <td>${fCreacion}</td>
              <td>${fVenc}</td>
              <td>
                <span class="status-badge ${activo ? 'status-active' : 'status-blocked'}">
                  ${activo ? '✅ ACTIVO' : '🚫 BLOQUEADO'}
                </span>
              </td>
              <td>
                <div class="actions-cell">
                  ${activo 
                    ? `<button class="btn btn-danger" style="padding: 4px 8px; font-size: 11px;" onclick="cambiarEstadoLicencia('${localId}', false)">🚫 Bloquear</button>`
                    : `<button class="btn btn-green" style="padding: 4px 8px; font-size: 11px;" onclick="cambiarEstadoLicencia('${localId}', true)">✅ Desbloquear</button>`
                  }
                  <button class="btn btn-blue" style="padding: 4px 8px; font-size: 11px;" onclick="extenderLicencia30Dias('${localId}', '${l.fechaVencimiento || ''}')">+30 Días</button>
                  <button class="btn" style="padding: 4px 8px; font-size: 11px; background:#444; color:#fff;" onclick="verClaveLocal('${localId}')">🔑 Clave</button>
                </div>
              </td>
            </tr>
          `;
        }).join('');

      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; color: #ff3344;">Error de comunicación con el backend server.</td></tr>';
      }
    }

    async function crearLocalSuperAdmin() {
      const nombre = document.getElementById('nuevo-nombre').value.trim();
      const rut = document.getElementById('nuevo-rut').value.trim();
      const correo = document.getElementById('nuevo-correo').value.trim();
      const password = document.getElementById('nuevo-pass').value.trim();

      if (!nombre) return alert("Ingresa el nombre comercial del local.");

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, rut, correo, password, altaRegistrada: true })
        });

        const data = await res.json();
        if (res.ok) {
          alert(`🎉 Restaurante "${data.nombre}" creado con éxito.`);
          document.getElementById('nuevo-nombre').value = '';
          document.getElementById('nuevo-rut').value = '';
          document.getElementById('nuevo-correo').value = '';
          cargarLocales();
        } else {
          alert(`❌ ${data.error || 'Error al crear local'}`);
        }
      } catch (e) {
        alert("Error de red al registrar el local.");
      }
    }

    async function cambiarEstadoLicencia(localId, activar) {
      if (!confirm(`¿Estás seguro de ${activar ? 'DESBLOQUEAR' : 'BLOQUEAR'} el acceso para el local "${localId}"?`)) return;

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/${encodeURIComponent(localId)}/licencia`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ activo: activar })
        });

        if (res.ok) {
          cargarLocales();
        } else {
          alert("No se pudo cambiar el estado de la licencia.");
        }
      } catch (e) {
        alert("Error al actualizar la licencia.");
      }
    }

    async function extenderLicencia30Dias(localId, fechaVencActual) {
      let baseFecha = fechaVencActual ? new Date(fechaVencActual) : new Date();
      if (isNaN(baseFecha.getTime()) || baseFecha < new Date()) {
        baseFecha = new Date();
      }

      baseFecha.setDate(baseFecha.getDate() + 30);

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/${encodeURIComponent(localId)}/licencia`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fechaVencimiento: baseFecha.toISOString(), activo: true })
        });

        if (res.ok) {
          alert(`✅ Licencia extendida exitosamente hasta: ${baseFecha.toLocaleDateString('es-CL')}`);
          cargarLocales();
        } else {
          alert("Error al extender la fecha de la licencia.");
        }
      } catch (e) {
        alert("Error de red.");
      }
    }

    async function verClaveLocal(localId) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/reenviar-clave`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ local: localId })
        });

        const data = await res.json();
        if (res.ok) {
          alert(data.mensaje);
        } else {
          alert(data.error || "Error al obtener la contraseña.");
        }
      } catch (e) {
        alert("Error al consultar credenciales.");
      }
    }

    function descargarDemoHTML() {
      const demoHTMLContent = `<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    }
    h1 {
      color: #ffee00;

    }
    p {

    .contacto-box {

<body>
  <div class="card">
    <h1>🚀 AppMenu Demo (30 Días)</h1>
    <p>Ingresa el nombre de tu local o restaurante para ingresar o generar tu acceso permanente durante los 30 días de demo o pago de licencia mensual.</p>
    
    <input type="text" id="nombreLocal" placeholder="Ej: Mi Restaurante Demo">
    <button class="btn" onclick="iniciarOAbrirLocal()">⚡ Acceder / Abrir Mi Local</button>
    <button class="btn" style="background: #00d2ff; color:#000;" onclick="descargarAccesoDirectoLocal()">📥 Descargar Lanzador Exclusivo de Mi Local (.html)</button>

    <div class="contacto-box">
      <p style="margin-bottom: 5px;">📲 <b>Soporte & Licencias Mensuales:</b></p>
      <p style="margin-bottom: 3px;">💬 WhatsApp: <b>+56966648585</b></p>
      <p style="margin-bottom: 0;">✉️ Correo: <b>appmenunova@gmail.com</b></p>
    </div>
  </div>

  <script>
    const SERVER_URL = "https://appmenu-tavr.onrender.com";

    function obtenerSlug(nombre) {
      return nombre.toLowerCase().trim().replace(/[^a-z0-9]/g, '_').replace(/_+/g, '_');
    }

    function iniciarOAbrirLocal() {
      const nombre = document.getElementById('nombreLocal').value.trim();
      if (!nombre) return alert("Por favor ingresa el nombre de tu local.");
      const slug = obtenerSlug(nombre);
      window.location.href = \`\${SERVER_URL}/admin.html?local=\${encodeURIComponent(slug)}\`;
    }

    function descargarAccesoDirectoLocal() {
      const nombre = document.getElementById('nombreLocal').value.trim();
      if (!nombre) return alert("Por favor ingresa el nombre de tu local para generar la descarga.");
      const slug = obtenerSlug(nombre);

      const htmlAccesoLocal = \`<!DOCTYPE html>

  <\\/script>

  <p>Si no te redirige automáticamente, <a href="\${SERVER_URL}/admin.html?local=\${encodeURIComponent(slug)}" style="color:#00ff66;">haz clic aquí</a>.</p>
</body>
</html>\`;

      const blob = new Blob([htmlAccesoLocal], { type: 'text/html' });
      const a = document.createElement('a');
      a.download = \`Acceso_\${slug}.html\`;
      a.href = URL.createObjectURL(blob);
      a.click();
    }
  <\\/script>
</body>
</html>`;

      const blob = new Blob([demoHTMLContent], { type: 'text/html' });
      const link = document.createElement('a');
      link.download = 'appmenudemo.html';
      link.href = URL.createObjectURL(blob);
      link.click();
    }
  </script>
</body>
</html>

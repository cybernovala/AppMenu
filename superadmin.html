<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel SuperAdmin - Gestión de Locales</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f8f9fa; color: #333; }
    h1, h2 { color: #2c3e50; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    .btn-download { background-color: #28a745; margin-left: 8px; }
    .btn-download:hover { background-color: #218838; }
    .btn-renew { background-color: #ffc107; color: #212529; margin-left: 8px; }
    .btn-renew:hover { background-color: #e0a800; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #dee2e6; padding: 10px; text-align: left; }
    th { background-color: #e9ecef; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
    .badge-success { background-color: #d4edda; color: #155724; }
    .badge-danger { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <h1>🛡️ Panel SuperAdmin - Control de Suscripciones</h1>

  <!-- SECCIÓN CLAVE MAESTRA -->
  <div class="card">
    <h2>1. Autenticación</h2>
    <div class="form-group">
      <label for="claveMaestra">Clave Maestra:</label>
      <input type="password" id="claveMaestra" value="superadmin123" placeholder="Ingresa la clave maestra">
    </div>
    <button onclick="cargarLocales()">Cargar / Refrescar Lista de Locales</button>
  </div>

  <!-- SECCIÓN CREAR LOCAL -->
  <div class="card">
    <h2>2. Crear Nuevo Restaurante</h2>
    <div class="form-group">
      <label for="nuevoLocal">Nombre / ID del Local (sin espacios):</label>
      <input type="text" id="nuevoLocal" placeholder="Ej: restaurante_don_pepe">
    </div>
    <div class="form-group">
      <label for="passwordCliente">Contraseña para el Administrador del Local:</label>
      <input type="password" id="passwordCliente" placeholder="Ej: clave1234">
    </div>
    <button onclick="crearLocal()">Crear Local y Activar 30 Días</button>
  </div>

  <!-- LISTA DE LOCALES -->
  <div class="card">
    <h2>3. Estado de Locales Registrados</h2>
    <table>
      <thead>
        <tr>
          <th>ID Local</th>
          <th>Fecha Creación</th>
          <th>Vencimiento</th>
          <th>Días Restantes</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaLocales">
        <tr>
          <td colspan="6" style="text-align:center;">Ingresa la Clave Maestra y presiona "Cargar"</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // URL DE TU BACKEND EN RENDER
    const BACKEND_URL = "https://appmenu-tavr.onrender.com"; 

    // URL PÚBLICA DE TU FRONTEND EN GITHUB PAGES
    const URL_BASE_GITHUB = "https://cybernovala.github.io/AppMenu/index.html";

    async function cargarLocales() {
      const clave = document.getElementById("claveMaestra").value;
      if (!clave) return alert("Ingresa la clave maestra");

      try {
        const res = await fetch(`${BACKEND_URL}/api/superadmin/locales?clave=${encodeURIComponent(clave)}`);
        const data = await res.json();

        if (!res.ok) return alert(data.error || "Error al cargar locales");

        const tbody = document.getElementById("tablaLocales");
        tbody.innerHTML = "";

        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No hay restaurantes registrados.</td></tr>`;
          return;
        }

        data.forEach(local => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><strong>${local.id}</strong></td>
            <td>${local.fechaCreacion}</td>
            <td>${local.fechaVencimiento}</td>
            <td>${local.diasRestantes} días</td>
            <td>
              <span class="badge ${local.activo ? 'badge-success' : 'badge-danger'}">
                ${local.activo ? 'ACTIVO' : 'SUSPENDIDO'}
              </span>
            </td>
            <td>
              <button class="btn-renew" onclick="renovarPago('${local.id}')">➕ 30 Días</button>
              <button class="btn-download" onclick="descargarScriptLocal('${local.id}')">📥 Descargar Script</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        alert("Error de conexión con el servidor de Render");
      }
    }

    async function crearLocal() {
      const claveSuperAdmin = document.getElementById("claveMaestra").value;
      const local = document.getElementById("nuevoLocal").value.trim().toLowerCase().replace(/\s+/g, '_');
      const passwordCliente = document.getElementById("passwordCliente").value;

      if (!local || !passwordCliente) return alert("Completa el nombre y la contraseña del local");

      try {
        const res = await fetch(`${BACKEND_URL}/api/superadmin/crear-local`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ claveSuperAdmin, local, passwordCliente })
        });

        const data = await res.json();
        if (res.ok) {
          alert(`✅ Restaurante creado con éxito. Vence el: ${data.fechaVencimiento}`);
          document.getElementById("nuevoLocal").value = "";
          document.getElementById("passwordCliente").value = "";
          descargarScriptLocal(local); // Descargar acceso directo automáticamente
          cargarLocales();
        } else {
          alert("Error: " + data.error);
        }
      } catch (err) {
        alert("Error al conectar con el servidor");
      }
    }

    async function renovarPago(local) {
      const claveSuperAdmin = document.getElementById("claveMaestra").value;
      if (!confirm(`¿Confirmas la recepción del pago para renovar 30 días a '${local}'?`)) return;

      try {
        const res = await fetch(`${BACKEND_URL}/api/superadmin/renovar-pago`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ claveSuperAdmin, local })
        });

        const data = await res.json();
        if (res.ok) {
          alert(`✅ Pago registrado. Nueva fecha de vencimiento: ${data.nuevaFecha}`);
          cargarLocales();
        } else {
          alert("Error: " + data.error);
        }
      } catch (err) {
        alert("Error al procesar la renovación");
      }
    }

    // GENERADOR DEL SCRIPT EJECUTABLE DINÁMICO (Sincronizado con GitHub)
    function descargarScriptLocal(idLocal) {
      const contenidoHTML = `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=${URL_BASE_GITHUB}?local=${idLocal}">
  <title>Cargando Restaurante...</title>
  <script>
    window.location.href = "${URL_BASE_GITHUB}?local=${idLocal}";
  <\/script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f4f6f8;">
  <h2>Cargando la aplicación del restaurante...</h2>
  <p>Si no redirige automáticamente en unos segundos, <a href="${URL_BASE_GITHUB}?local=${idLocal}">haz clic aquí</a>.</p>
</body>
</html>`;

      const blob = new Blob([contenidoHTML], { type: 'text/html' });
      const enlace = document.createElement('a');
      enlace.href = URL.createObjectURL(blob);
      enlace.download = `index_${idLocal}.html`;
      enlace.click();
    }
  </script>
</body>
</html>

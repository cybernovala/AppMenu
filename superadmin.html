<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperAdmin - Generador de Locales</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: rgba(18, 18, 22, 0.95);
      --neon-orange: #ff5500;
      --neon-yellow: #ffea00;
      --grad-neon: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
    }

    .container { max-width: 600px; margin: 0 auto; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--neon-orange);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h1 { font-size: 20px; color: var(--neon-yellow); margin-bottom: 15px; text-transform: uppercase; }

    label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }
    input {
      width: 100%; padding: 12px; background: #14141a; border: 1px solid #333;
      color: #fff; border-radius: 6px; font-size: 15px; margin-bottom: 15px;
    }

    button {
      background: var(--grad-neon); border: none; color: #000;
      padding: 14px; font-weight: bold; width: 100%; border-radius: 6px; cursor: pointer; font-size: 15px;
    }

    .result-box {
      display: none; background: #121218; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-top: 15px;
    }

    .link-item { margin-bottom: 12px; word-break: break-all; }
    .link-item span { color: var(--neon-yellow); font-size: 12px; display: block; }
    .link-item a { color: #fff; text-decoration: underline; font-size: 13px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>⚡ SuperAdmin: Crear Cliente</h1>
      
      <label>Nombre del Nuevo Local / Cliente</label>
      <input type="text" id="nombre-local" placeholder="Ej: sushi-valpo o bar-central">

      <button onclick="generarEnlaces()">🚀 Registrar Local y Generar Enlaces</button>

      <div id="resultado" class="result-box">
        <h3 style="color:var(--neon-orange); margin-bottom:10px;">Enlaces Creados para el Cliente:</h3>
        
        <div class="link-item">
          <span>1. Panel de Administración del Cliente (Entrega este link):</span>
          <a id="link-admin" target="_blank"></a>
        </div>

        <div class="link-item">
          <span>2. Carta Pública (QR de Mesas):</span>
          <a id="link-cliente" target="_blank"></a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function generarEnlaces() {
      const input = document.getElementById('nombre-local').value.trim();
      if (!input) {
        alert('Ingresa el nombre del local.');
        return;
      }

      // Limpia el texto para crearlo como ID (ejemplo: "Bar Central" -> "bar-central")
      const localId = input.toLowerCase().replace(/[^a-z0-9]/g, '-');
      const baseUrl = window.location.origin;

      const urlAdmin = `${baseUrl}/admin.html?local=${localId}`;
      const urlCliente = `${baseUrl}/index.html?local=${localId}&mesa=1`;

      document.getElementById('link-admin').href = urlAdmin;
      document.getElementById('link-admin').innerText = urlAdmin;

      document.getElementById('link-cliente').href = urlCliente;
      document.getElementById('link-cliente').innerText = urlCliente;

      document.getElementById('resultado').style.display = 'block';
    }
  </script>
</body>
</html>

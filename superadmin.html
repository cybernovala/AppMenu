<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperAdmin - Control de Licencias y Restaurantes</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: rgba(18, 18, 22, 0.95);
      --neon-orange: #ff5500;
      --neon-yellow: #ffea00;
      --neon-red: #ff3333;
      --neon-green: #00e676;
      --neon-blue: #00d2ff;
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
    }

    .container { max-width: 900px; margin: 0 auto; }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 85, 0, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    h1, h2 {
      font-size: 20px;
      color: var(--neon-yellow);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 15px;
    }

    input, select {
      padding: 12px;
      background: #121218;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
      flex: 1;
      min-width: 180px;
    }

    .btn {
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      border: none;
      color: #000;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s ease;
    }

    .btn:hover { opacity: 0.9; }

    .btn-secondary { background: #222; color: #fff; border: 1px solid #444; }
    .btn-secondary:hover { background: #333; }

    .btn-download {
      background: transparent;
      border: 1px solid var(--neon-blue);
      color: var(--neon-blue);
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .btn-download:hover {
      background: var(--neon-blue);
      color: #000;
    }

    .local-card {
      background: #121218;
      border: 1px solid #2a2a36;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .local-info b { font-size: 16px; color: var(--neon-blue); }
    .local-info p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    .controls-wrapper {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* Switch toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 54px;
      height: 28px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333;
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute; content: "";
      height: 20px; width: 20px;
      left: 4px; bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--neon-green); }
    input:checked + .slider:before { transform: translateX(26px); }

    .status-badge {
      font-size: 12px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
    }

    .status-active { background: rgba(0, 230, 118, 0.2); color: var(--neon-green); border: 1px solid var(--neon-green); }
    .status-inactive { background: rgba(255, 51, 51, 0.2); color: var(--neon-red); border: 1px solid var(--neon-red); }
  </style>
</head>
<body>

  <div class="container">
    <!-- Panel de creación -->
    <div class="card">
      <h1>👑 SuperAdmin - Control de Licencias</h1>
      <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">
        Crea nuevos restaurantes con la fecha actual y 30 días de vigencia por defecto. Descarga el archivo HTML de licencia habilitante y gestiona su acceso a MongoDB en cualquier momento.
      </p>

      <form class="form-group" onsubmit="crearNuevoLocal(event)">
        <input type="text" id="input-nombre-local" placeholder="Nombre del Restaurante (Ej: Pizzería Central)" required>
        <button type="submit" class="btn">➕ Crear Restaurante</button>
      </form>
    </div>

    <!-- Panel de búsqueda y lista -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px;">
        <h2>Restaurantes Registrados</h2>
        <button class="btn btn-secondary" onclick="cargarTodosLocales()">🔄 Actualizar Lista</button>
      </div>

      <div class="form-group">
        <input type="text" id="input-buscar-local" placeholder="Buscar por Nombre o ID de Local...">
        <button class="btn btn-secondary" onclick="buscarLocal()">🔍 Buscar Local</button>
      </div>

      <div id="lista-locales">
        <p style="color: var(--text-muted); text-align: center;">Cargando locales desde MongoDB...</p>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'https://appmenu-tavr.onrender.com';

    document.addEventListener("DOMContentLoaded", () => {
      cargarTodosLocales();
    });

    // Formatear fechas a YYYY-MM-DD local de manera segura
    function obtenerFechaFormateada(fechaObj) {
      const year = fechaObj.getFullYear();
      const month = String(fechaObj.getMonth() + 1).padStart(2, '0');
      const day = String(fechaObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // Cargar todos los locales
    async function cargarTodosLocales() {
      const contenedor = document.getElementById('lista-locales');
      contenedor.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Consultando MongoDB...</p>';

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales?_t=${Date.now()}`);
        if (!res.ok) throw new Error("Error al obtener la lista");
        const locales = await res.json();

        if (!Array.isArray(locales) || locales.length === 0) {
          contenedor.innerHTML = '<p style="color: var(--text-muted); text-align: center;">No hay locales registrados.</p>';
          return;
        }

        renderizarLocales(locales);
      } catch (err) {
        contenedor.innerHTML = '<p style="color: var(--neon-red); text-align: center;">❌ Error de conexión al backend en Render.</p>';
      }
    }

    // Crear un nuevo local calculando automáticamente fechaCreacion (hoy) y fechaVencimiento (+30 días)
    async function crearNuevoLocal(e) {
      e.preventDefault();
      const nombreInput = document.getElementById('input-nombre-local');
      const nombre = nombreInput.value.trim();

      if (!nombre) return alert("Por favor ingresa un nombre válido para el local.");

      // Generar ID amigable derivado del nombre
      const localId = nombre.toLowerCase().replace(/[^a-z0-9]/g, '_') + '_' + Math.floor(Math.random() * 1000);

      const hoy = new Date();
      const fechaCreacion = obtenerFechaFormateada(hoy);

      const vencimiento = new Date();
      vencimiento.setDate(vencimiento.getDate() + 30);
      const fechaVencimiento = obtenerFechaFormateada(vencimiento);

      const payload = {
        localId: localId,
        nombre: nombre,
        activo: true,
        fechaCreacion: fechaCreacion,
        fechaVencimiento: fechaVencimiento
      };

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert(`✅ Restaurante "${nombre}" creado correctamente.\nLicencia válida hasta: ${fechaVencimiento}`);
          nombreInput.value = '';
          cargarTodosLocales();
        } else {
          const errData = await res.json().catch(() => ({}));
          alert(`❌ Error al crear el local: ${errData.message || 'Respuesta inválida del servidor'}`);
        }
      } catch (err) {
        alert("❌ Error de red al comunicarse con el servidor.");
      }
    }

    // Renderizar la lista de restaurantes en pantalla
    function renderizarLocales(locales) {
      const contenedor = document.getElementById('lista-locales');
      contenedor.innerHTML = '';

      locales.forEach(loc => {
        const fCreacion = loc.fechaCreacion ? loc.fechaCreacion.split('T')[0] : 'No registrada';
        const fVenc = loc.fechaVencimiento ? loc.fechaVencimiento.split('T')[0] : 'Sin fecha';
        const estaActivo = loc.activo === true;

        const card = document.createElement('div');
        card.className = 'local-card';
        card.innerHTML = `
          <div class="local-info">
            <b>${loc.nombre ? loc.nombre.toUpperCase() : 'SIN NOMBRE'}</b> (ID: ${loc.localId})<br>
            <p><b>Fecha Creación:</b> ${fCreacion}</p>
            <p><b>Vencimiento Licencia:</b> <input type="date" id="date-${loc.localId}" value="${fVenc}" style="padding:4px; font-size:12px; min-width:auto;">
            <button class="btn btn-secondary" style="padding:4px 8px; font-size:11px;" onclick="guardarFecha('${loc.localId}')">💾 Guardar Fecha</button></p>
            <p style="margin-top:5px;">
              Estado Licencia: 
              <span class="status-badge ${estaActivo ? 'status-active' : 'status-inactive'}">
                ${estaActivo ? 'HABILITADO' : 'BLOQUEADO'}
              </span>
            </p>
          </div>

          <div class="controls-wrapper">
            <button class="btn-download" onclick="descargarHTML('${loc.localId}')">
              📥 Descargar HTML Licencia
            </button>
            <label class="switch" title="Habilitar / Bloquear Acceso">
              <input type="checkbox" ${estaActivo ? 'checked' : ''} onchange="cambiarEstadoLocal('${loc.localId}', this.checked)">
              <span class="slider"></span>
            </label>
          </div>
        `;
        contenedor.appendChild(card);
      });
    }

    // Habilitar o Bloquear (Activar/Desactivar) en MongoDB mediante PATCH
    async function cambiarEstadoLocal(localId, activo) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/${encodeURIComponent(localId)}/licencia`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ activo })
        });

        if (res.ok) {
          alert(`✅ Estado del local "${localId}" actualizado a ${activo ? 'HABILITADO' : 'BLOQUEADO'}.`);
          cargarTodosLocales();
        } else {
          alert("❌ Error al actualizar el estado del local en MongoDB.");
        }
      } catch (err) {
        alert("❌ Error de red al comunicarse con el servidor.");
      }
    }

    // Modificar o Extender manualmente la fecha de vencimiento
    async function guardarFecha(localId) {
      const nuevaFecha = document.getElementById(`date-${localId}`).value;
      if (!nuevaFecha) return alert("Selecciona una fecha válida.");

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/${encodeURIComponent(localId)}/licencia`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fechaVencimiento: nuevaFecha })
        });

        if (res.ok) {
          alert("✅ Fecha de vencimiento de licencia actualizada en MongoDB.");
          cargarTodosLocales();
        } else {
          alert("❌ Error al guardar la nueva fecha.");
        }
      } catch (err) {
        alert("❌ Error de comunicación con el servidor.");
      }
    }

    // Buscar local específico
    async function buscarLocal() {
      const q = document.getElementById('input-buscar-local').value.trim().toLowerCase();
      if (!q) return cargarTodosLocales();

      try {
        const res = await fetch(`${BACKEND_URL}/api/licencia?local=${encodeURIComponent(q)}&_t=${Date.now()}`);
        if (res.ok) {
          const data = await res.json();
          renderizarLocales([{
            localId: data.local || data.localId || q,
            nombre: data.nombre || q,
            activo: data.activo,
            fechaCreacion: data.fechaCreacion,
            fechaVencimiento: data.fechaVencimiento
          }]);
        } else {
          alert("Local no encontrado en MongoDB.");
        }
      } catch (err) {
        alert("❌ Error de red al buscar.");
      }
    }

    // Descargar el archivo HTML de licencia que leerá la aplicación Admin para validar el acceso
    async function descargarHTML(localId) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/licencia?local=${encodeURIComponent(localId)}&_t=${Date.now()}`);
        if (!res.ok) throw new Error("No se pudo obtener la información del local");
        
        const data = await res.json();

        const htmlContent = `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Licencia Oficial - ${data.nombre || localId}</title>
</head>
<body>
  <script>
    // Archivo de Licencia Generado por SuperAdmin
    window.LICENCIA_CONFIG = ${JSON.stringify(data, null, 2)};
    
    // Guardar en la sesión local para lectura del Panel Admin
    localStorage.setItem('licencia_local_activa', JSON.stringify(window.LICENCIA_CONFIG));

    function validarLicencia() {
      const hoy = new Date().toISOString().split('T')[0];
      const lic = window.LICENCIA_CONFIG;

      if (!lic.activo) {
        alert('⛔ ACCESO BLOQUEADO: La licencia de este local ha sido desactivada.');
        return false;
      }

      if (lic.fechaVencimiento && hoy > lic.fechaVencimiento) {
        alert('⚠️ LICENCIA VENCIDA: Expiró el ' + lic.fechaVencimiento + '. Contacte al administrador.');
        return false;
      }

      console.log('✅ Licencia válida para ' + lic.nombre + '. Creada el: ' + lic.fechaCreacion);
      return true;
    }

    validarLicencia();
  <\/script>
</body>
</html>`;

        const blob = new Blob([htmlContent], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `licencia_${localId}.html`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        alert("❌ Error al generar el archivo HTML de la licencia.");
      }
    }
  </script>
</body>
</html>

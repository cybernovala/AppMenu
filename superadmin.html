<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Superadmin - Gestión de Locales</title>
  <style>
    :root {
      --bg-dark: #08070d;
      --card-bg: rgba(18, 16, 28, 0.85);
      --neon-orange: #ff5500;
      --neon-pink: #ff007f;
      --neon-yellow: #ffee00;
      --neon-green: #00ff66;
      --neon-blue: #00d2ff;
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
      --border-neon: rgba(255, 0, 127, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header {
      background: var(--card-bg);
      border: 1px solid var(--border-neon);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 { color: var(--neon-yellow); font-size: 22px; font-weight: 800; text-transform: uppercase; }

    .section-card {
      background: var(--card-bg);
      border: 1px solid #222;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .section-card h3 {
      color: var(--neon-orange);
      font-size: 16px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 15px;
    }

    input {
      padding: 12px;
      background: #181822;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
    }

    .btn {
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-pink));
      border: none;
      color: #fff;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-success { background: linear-gradient(135deg, var(--neon-green), #00b347); color: #000; }
    .btn-msg { background: linear-gradient(135deg, var(--neon-blue), #0077ff); color: #fff; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #222; }
    th { background: #12121c; color: var(--neon-yellow); }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 11px;
    }
    .badge-active { background: rgba(0, 255, 102, 0.2); color: var(--neon-green); border: 1px solid var(--neon-green); }
    .badge-inactive { background: rgba(255, 0, 51, 0.2); color: #ff3344; border: 1px solid #ff3344; }

    .action-btn {
      padding: 6px 12px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }
    .btn-toggle { background: #333; color: #fff; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>👑 PANEL SUPERADMINISTRADOR</h1>
      <button class="btn btn-msg" onclick="recargarLocales()">🔄 Actualizar</button>
    </header>

    <!-- SECCIÓN DE DAR DE ALTA RESTAURANTE -->
    <div class="section-card">
      <h3>➕ Dar de Alta Restaurante (Cliente Oficial)</h3>
      <div class="form-grid">
        <input type="text" id="alta-nombre" placeholder="Nombre Restaurante">
        <input type="text" id="alta-rut" placeholder="RUT Empresa">
        <input type="email" id="alta-correo" placeholder="Correo Electrónico">
        <input type="text" id="alta-pass" placeholder="Contraseña Admin">
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn btn-success" onclick="crearNuevoLocal()">✅ Dar de Alta Restaurante</button>
        <!-- BOTÓN PARA ABRIR PESTAÑA DE MENSAJES -->
        <button class="btn btn-msg" onclick="window.open('mensajes.html', '_blank')">📢 Enviar Mensaje Global a Clientes</button>
      </div>
    </div>

    <!-- LISTADO DE LOCALES -->
    <div class="section-card">
      <h3>🏪 Clientes y Locales Registrados</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre / Local Slug</th>
              <th>RUT</th>
              <th>Correo</th>
              <th>Estado Licencia</th>
              <th>Fecha Vencimiento</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-locales">
            <tr>
              <td colspan="7" style="text-align: center; color: var(--text-muted);">Cargando locales...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://appmenu-tavr.onrender.com';

    document.addEventListener("DOMContentLoaded", () => {
      recargarLocales();
    });

    async function recargarLocales() {
      const tbody = document.getElementById('tabla-locales');
      tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Cargando locales...</td></tr>';

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales?_t=${Date.now()}`);
        if (!res.ok) throw new Error("Error al obtener los locales");
        const locales = await res.json();

        if (!Array.isArray(locales) || locales.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">No hay clientes registrados.</td></tr>';
          return;
        }

        tbody.innerHTML = locales.map(l => {
          const estaActivo = l.activo !== false;
          const fechaVenc = l.fechaVencimiento ? new Date(l.fechaVencimiento).toLocaleDateString('es-CL') : 'Indefinido';

          return `
            <tr>
              <td><b>#${l.id || '--'}</b></td>
              <td><b>${l.nombre || l.localId}</b><br><span style="font-size: 11px; color: var(--text-muted);">${l.localId}</span></td>
              <td>${l.rut || 'S/RUT'}</td>
              <td>${l.correo || 'S/Correo'}</td>
              <td>
                <span class="badge ${estaActivo ? 'badge-active' : 'badge-inactive'}">
                  ${estaActivo ? '✅ ACTIVO' : '🚫 BLOQUEADO'}
                </span>
              </td>
              <td>${fechaVenc}</td>
              <td>
                <button class="action-btn btn-toggle" onclick="cambiarEstadoLicencia('${l.localId}', ${!estaActivo})">
                  ${estaActivo ? '🚫 Desactivar' : '✅ Activar'}
                </button>
              </td>
            </tr>
          `;
        }).join('');

      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #ff3344;">Error al conectar con el servidor.</td></tr>';
      }
    }

    async function crearNuevoLocal() {
      const nombre = document.getElementById('alta-nombre').value.trim();
      const rut = document.getElementById('alta-rut').value.trim();
      const correo = document.getElementById('alta-correo').value.trim();
      const password = document.getElementById('alta-pass').value.trim();

      if (!nombre) return alert("El nombre del restaurante es obligatorio.");

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/alta`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, rut, correo, password: password || '1234' })
        });

        const data = await res.json();

        if (res.ok) {
          alert("🎉 Cliente / Restaurante creado correctamente");
          document.getElementById('alta-nombre').value = '';
          document.getElementById('alta-rut').value = '';
          document.getElementById('alta-correo').value = '';
          document.getElementById('alta-pass').value = '';
          recargarLocales();
        } else {
          alert(`❌ Error: ${data.error || 'No se pudo dar de alta'}`);
        }
      } catch (e) {
        alert("Error de conexión al servidor");
      }
    }

    async function cambiarEstadoLicencia(localId, nuevoEstado) {
      if (!confirm(`¿Estás seguro de ${nuevoEstado ? 'ACTIVAR' : 'DESACTIVAR'} la cuenta de "${localId}"?`)) return;

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/${encodeURIComponent(localId)}/licencia`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ activo: nuevoEstado })
        });

        if (res.ok) {
          recargarLocales();
        } else {
          alert("No se pudo actualizar el estado.");
        }
      } catch (e) {
        alert("Error al conectar con el servidor.");
      }
    }
  </script>
</body>
</html>

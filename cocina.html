<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Cocina</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; }
    h1 { text-align: center; color: #ffe600; margin-bottom: 30px; }
    .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    .card { background: #1e1e1e; border: 2px solid #ffe600; border-radius: 8px; padding: 15px; width: 280px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .card.completado { border-color: #4CAF50; opacity: 0.5; }
    .mesa { font-size: 22px; font-weight: bold; color: #ffe600; }
    .hora { font-size: 13px; color: #888; float: right; }
    ul { padding-left: 20px; margin: 15px 0; }
    li { margin-bottom: 5px; }
    button { background: #4CAF50; color: white; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px; }
    .btn-del { background: #f44336; }
  </style>
</head>
<body>

  <h1>ÓRDENES EN COCINA</h1>
  <div id="pedidos-container" class="grid"></div>

  <script>
    const API_URL = "https://appmenu-tavr.onrender.com/api/pedidos";

    async function cargarPedidos() {
      try {
        const res = await fetch(API_URL);
        const pedidos = await res.json();
        
        const container = document.getElementById('pedidos-container');
        container.innerHTML = '';

        if (pedidos.length === 0) {
          container.innerHTML = '<p style="color:#888;">No hay pedidos pendientes en este momento.</p>';
          return;
        }

        pedidos.forEach(p => {
          const itemsHtml = p.items.map(i => `<li><strong>${i.nombre}</strong></li>`).join('');
          container.innerHTML += `
            <div class="card ${p.estado === 'Despachado' ? 'completado' : ''}">
              <span class="hora">${p.hora}</span>
              <div class="mesa">Mesa ${p.mesa}</div>
              <p style="margin: 5px 0;"><strong>Estado:</strong> ${p.estado}</p>
              <ul>${itemsHtml}</ul>
              <p><strong>Total: $${p.total.toLocaleString('es-CL')}</strong></p>
              ${p.estado === 'Pendiente' 
                ? `<button onclick="cambiarEstado(${p.id}, 'Despachado')">Marcar Listo</button>` 
                : `<button class="btn-del" onclick="cambiarEstado(${p.id}, 'Eliminar')">Borrar Pedido</button>`
              }
            </div>
          `;
        });
      } catch (err) {
        console.error("Error al obtener pedidos:", err);
      }
    }

    async function cambiarEstado(id, estado) {
      await fetch(`${API_URL}/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ estado })
      });
      cargarPedidos();
    }

    setInterval(cargarPedidos, 3000);
    cargarPedidos();
  </script>
</body>
</html>

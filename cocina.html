<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla de Cocina</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1e1e1e; color: white; padding: 20px; }
    h1 { color: #ffe600; }
    .grid { display: flex; flex-wrap: wrap; gap: 15px; }
    .card { background: #2a2a2a; border: 2px solid #444; border-radius: 8px; padding: 15px; width: 280px; }
    .card.pendiente { border-color: #ff9800; }
    .card.preparando { border-color: #2196F3; }
    .btn { padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }
    .btn-prep { background: #2196F3; color: white; }
    .btn-listo { background: #4CAF50; color: white; }
    .btn-elim { background: #f44336; color: white; }
  </style>
</head>
<body>

  <h1>📺 Cocina - <span id="nombre-local"></span></h1>
  <div class="grid" id="contenedor-pedidos">Cargando comandas...</div>

  <script>
    const API_URL = 'https://appmenu-tavr.onrender.com/api';
    const params = new URLSearchParams(window.location.search);
    const local = params.get('local') || 'default';

    document.getElementById('nombre-local').innerText = local.toUpperCase();

    async function cargarPedidos() {
      try {
        const res = await fetch(`${API_URL}/pedidos?local=${local}`);
        const pedidos = await res.json();
        const contenedor = document.getElementById('contenedor-pedidos');
        contenedor.innerHTML = '';

        pedidos.forEach(p => {
          const card = document.createElement('div');
          card.className = `card ${p.estado.toLowerCase()}`;
          
          let itemsHtml = p.items.map(i => `<li>${i.nombre}</li>`).join('');

          card.innerHTML = `
            <h3>Mesa ${p.mesa} <small>(${p.hora})</small></h3>
            <p><strong>Estado:</strong> ${p.estado}</p>
            <ul>${itemsHtml}</ul>
            <button class="btn btn-prep" onclick="cambiarEstado(${p.id}, 'Preparando')">En Preparación</button>
            <button class="btn btn-listo" onclick="cambiarEstado(${p.id}, 'Listo')">Listo para Servir</button>
            <button class="btn btn-elim" onclick="cambiarEstado(${p.id}, 'Eliminar')">Borrar Comanda</button>
          `;
          contenedor.appendChild(card);
        });
      } catch (e) {
        console.error(e);
      }
    }

    async function cambiarEstado(id, estado) {
      await fetch(`${API_URL}/pedidos/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ local, estado })
      });
      cargarPedidos();
    }

    setInterval(cargarPedidos, 3000);
    cargarPedidos();
  </script>
</body>
</html>

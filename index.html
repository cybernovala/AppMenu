<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Administración & Menús Digitales</title>
  <style>
    :root {
      --bg-dark: #08070d;
      --card-bg: rgba(18, 16, 28, 0.9);
      --neon-orange: #ff5500;
      --neon-pink: #ff007f;
      --neon-yellow: #ffee00;
      --neon-blue: #00d2ff;
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
      --border-neon: rgba(255, 0, 127, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-container {
      background: var(--card-bg);
      border: 1px solid var(--border-neon);
      border-radius: 16px;
      padding: 30px 25px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.25);
      text-align: center;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .brand-subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 25px;
    }

    .section-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid #222;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 18px;
      text-align: left;
    }

    .section-box h3 {
      font-size: 14px;
      color: var(--neon-yellow);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: #181822;
      border: 1px solid #333;
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: var(--neon-pink);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-admin {
      background: linear-gradient(135deg, var(--neon-pink), #9900ff);
      color: #fff;
    }

    .btn-demo {
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      color: #000;
    }

    .btn-existente {
      background: linear-gradient(135deg, var(--neon-blue), #0055ff);
      color: #fff;
    }

    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-title">Plataforma de Administración</div>
    <div class="brand-subtitle">Gestión centralizada de restaurantes y demostraciones</div>

    <!-- SECCIÓN 1: ACCESO ADMIN GENERAL -->
    <div class="section-box">
      <h3>🔑 Acceso Administrador General</h3>
      <div class="form-group">
        <label>Contraseña Administrador</label>
        <input type="password" id="admin-password" placeholder="Ingresa clave superadmin">
      </div>
      <button class="btn btn-admin" onclick="ingresarMensajesAdmin()">Ingresar a Mensajes (Admin)</button>
    </div>

    <!-- SECCIÓN 2: CREAR DEMO GRATIS -->
    <div class="section-box">
      <h3>🎁 Crear y Probar Demo Gratis (30 Días)</h3>
      <div class="form-group">
        <label>Nombre de tu Local / Negocio</label>
        <input type="text" id="demo-local-nombre" placeholder="Ej: Resto Bar Demo">
      </div>
      <button class="btn btn-demo" onclick="crearProbarDemo()">🚀 Crear y Probar Demo</button>
    </div>

    <!-- SECCIÓN 3: LOCAL EXISTENTE -->
    <div class="section-box">
      <h3>🏪 Ingreso a Local Existente</h3>
      <div class="form-group">
        <label>Nombre de tu Local Registrado</label>
        <input type="text" id="existente-local-nombre" placeholder="Ej: prueba3">
      </div>
      <button class="btn btn-existente" onclick="entrarAdminLocal()">📱 Entrar al Admin del Local</button>
    </div>
  </div>

  <script>
    const BACKEND_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://appmenu-tavr.onrender.com';

    // 1. Validar la contraseña contra MongoDB e ingresar
    async function ingresarMensajesAdmin() {
      const password = document.getElementById('admin-password').value.trim();
      if (!password) return alert("⚠️ Ingresa la contraseña de Administrador.");

      try {
        const res = await fetch(`${BACKEND_URL}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();
        if (res.ok && data.ok) {
          window.location.href = 'https://appmenu-990c3.web.app/mensajes.html';
        } else {
          alert(`❌ ${data.error || 'Contraseña incorrecta'}`);
        }
      } catch (err) {
        alert("❌ Error de comunicación con el servidor");
      }
    }

    // 2. Crear una nueva demo asignando 30 días exactos
    async function crearProbarDemo() {
      const nombre = document.getElementById('demo-local-nombre').value.trim();
      if (!nombre) return alert("⚠️ Ingresa el nombre para tu local");

      // Asignar fechaVencimiento a exactamente 30 días desde la fecha actual
      const hoy = new Date();
      const fechaVencimiento = new Date(hoy);
      fechaVencimiento.setDate(fechaVencimiento.getDate() + 30);

      const payload = {
        nombre: nombre,
        rut: "DEMO-30DIAS",
        correo: "demo@appmenu.cl",
        password: "123",
        fechaVencimiento: fechaVencimiento.toISOString()
      };

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/alta`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok) {
          alert("🎉 Local demo creado con éxito (Válido por 30 días).");
          const targetLocal = data.local || data.localId || nombre;
          window.location.href = `https://appmenu-990c3.web.app/admin.html?local=${encodeURIComponent(targetLocal)}`;
        } else {
          alert(`❌ Error al crear el local: ${data.error || 'No se pudo procesar la solicitud'}`);
        }
      } catch (err) {
        console.error("Error al crear demo:", err);
        alert("❌ Error de conexión con el servidor");
      }
    }

    // 3. Verificar en MongoDB si el local existe y redirigir
    async function entrarAdminLocal() {
      const busqueda = document.getElementById('existente-local-nombre').value.trim();
      if (!busqueda) return alert("⚠️ Ingresa el nombre de tu local");

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/verificar/${encodeURIComponent(busqueda)}`);
        const data = await res.json();

        if (res.ok && data.existe) {
          window.location.href = `https://appmenu-990c3.web.app/admin.html?local=${encodeURIComponent(data.local)}`;
        } else {
          alert("❌ El local ingresado no se encuentra registrado.");
        }
      } catch (err) {
        alert("❌ Error al consultar la existencia del local");
      }
    }
  </script>
</body>
</html>

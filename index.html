<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Menú Digital</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: rgba(18, 18, 22, 0.95);
      --neon-orange: #ff5500;
      --neon-yellow: #ffea00;
      --grad-neon: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: calc(120px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    .app-container { width: 100%; max-width: 500px; margin: 0 auto; padding: 12px; }

    header {
      text-align: center; margin-bottom: 15px; padding: 15px 10px;
      background: var(--card-bg); border: 1px solid rgba(255, 85, 0, 0.3); border-radius: 12px;
    }

    h1 {
      font-size: 20px; text-transform: uppercase; letter-spacing: 1px;
      background: var(--grad-neon); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .mesa-badge {
      display: inline-block; margin-top: 6px; padding: 3px 10px;
      background: rgba(255, 234, 0, 0.1); border: 1px solid var(--neon-yellow);
      color: var(--neon-yellow); font-size: 11px; font-weight: bold; border-radius: 20px;
    }

    .categories-bar {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 15px;
      -webkit-overflow-scrolling: touch;
    }
    .categories-bar::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: #181820; color: var(--text-muted); border: 1px solid #333;
      padding: 8px 14px; font-size: 13px; font-weight: bold; white-space: nowrap; border-radius: 20px; cursor: pointer;
    }
    .cat-btn.active { color: #000; background: var(--grad-neon); border-color: var(--neon-yellow); }

    .product-card {
      background: var(--card-bg); border: 1px solid rgba(255, 85, 0, 0.2);
      border-radius: 10px; padding: 12px 15px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .add-btn {
      background: transparent; border: 1px solid var(--neon-orange); color: var(--neon-orange);
      padding: 8px 12px; font-size: 12px; font-weight: bold; border-radius: 6px; cursor: pointer;
    }

    /* Barra inferior flotante */
    .cart-bar {
      position: fixed; bottom: 0; left: 0; width: 100%; background: #0f0f14;
      border-top: 1px solid var(--neon-orange);
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex; justify-content: space-between; align-items: center; z-index: 100;
    }

    .review-btn {
      background: var(--grad-neon); border: none; color: #000;
      padding: 12px 20px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer;
    }
    .review-btn:disabled { opacity: 0.4; }

    /* Modal emergente centrado y adaptativo */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
      display: none; justify-content: center; align-items: flex-end; z-index: 200;
    }
    .modal-overlay.open { display: flex; }

    .modal-content {
      background: #14141a; border: 1px solid var(--neon-orange);
      border-radius: 16px 16px 0 0; width: 100%; max-width: 500px;
      max-height: 85dvh; max-height: 85vh; /* Se ajusta dinámicamente al alto de la pantalla */
      display: flex; flex-direction: column; padding: 18px 18px calc(20px + env(safe-area-inset-bottom)) 18px;
    }

    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #282830; padding-bottom: 10px; flex-shrink: 0;
    }

    /* Solo esta sección scrollea */
    .cart-items-list {
      overflow-y: auto; flex: 1; margin: 12px 0; -webkit-overflow-scrolling: touch;
      padding-right: 4px;
    }

    .cart-item { display: flex; justify-content: space-between; align-items: center; background: #1c1c24; padding: 10px; margin-bottom: 8px; border-radius: 6px; }
    .btn-qty { background: #282835; border: 1px solid var(--neon-orange); color: var(--neon-orange); width: 32px; height: 32px; font-weight: bold; border-radius: 4px; font-size: 16px; }

    /* El footer con el botón siempre se queda visible abajo */
    .modal-footer {
      border-top: 1px solid #282830; padding-top: 12px; flex-shrink: 0;
    }

    .confirm-btn {
      background: var(--grad-neon); border: none; color: #000;
      padding: 16px; font-size: 16px; font-weight: bold; cursor: pointer;
      width: 100%; border-radius: 8px; box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1 id="titulo-local">MENÚ DIGITAL</h1>
      <div class="mesa-badge" id="badge-mesa">MESA --</div>
    </header>

    <div class="categories-bar" id="contenedor-categorias"></div>
    <div id="contenedor-menu"></div>
  </div>

  <div class="cart-bar">
    <div>
      <span id="cant-items" style="font-size:11px; color:var(--text-muted);">0 productos</span><br>
      <strong id="total-pedido" style="font-size:18px; color:var(--neon-yellow);">$0</strong>
    </div>
    <button class="review-btn" id="btn-revisar" onclick="abrirModal()" disabled>Revisar Orden 🛒</button>
  </div>

  <div class="modal-overlay" id="modal-orden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="color:var(--neon-yellow); font-size:16px;">📋 Confirmar Pedido</h3>
        <button style="background:none; border:none; color:#fff; font-size:24px; cursor:pointer;" onclick="cerrarModal()">&times;</button>
      </div>

      <div class="cart-items-list" id="lista-carrito-modal"></div>

      <div class="modal-footer">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:16px; font-weight:bold;">
          <span>Total a Pagar:</span>
          <span id="modal-total-val" style="color:var(--neon-yellow);">$0</span>
        </div>
        <button class="confirm-btn" id="btn-confirmar" onclick="enviarPedido()">🚀 Pedir Orden</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://appmenu-tavr.onrender.com/api";
    const urlParams = new URLSearchParams(window.location.search);
    const localId = urlParams.get('local') || 'default';
    const numMesa = urlParams.get('mesa') || '1';

    let menuCompleto = [];
    let carrito = [];

    document.getElementById('titulo-local').innerText = localId.replace('-', ' ').toUpperCase();
    document.getElementById('badge-mesa').innerText = `MESA ${numMesa}`;

    async function cargarMenu() {
      try {
        const res = await fetch(`${API_URL}/menu?local=${localId}`);
        menuCompleto = await res.json();
        renderizarCategorias();
        if (menuCompleto.length > 0) renderizarProductos(menuCompleto[0].categoria);
      } catch (err) {
        document.getElementById('contenedor-menu').innerHTML = `<p style="text-align:center; color:var(--neon-orange);">Error cargando menú.</p>`;
      }
    }

    function renderizarCategorias() {
      const cont = document.getElementById('contenedor-categorias');
      cont.innerHTML = menuCompleto.map((cat, index) => `
        <button class="cat-btn ${index === 0 ? 'active' : ''}" onclick="seleccionarCategoria('${cat.categoria}', this)">
          ${cat.categoria}
        </button>
      `).join('');
    }

    function seleccionarCategoria(catNombre, btnElement) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      renderizarProductos(catNombre);
    }

    function renderizarProductos(catNombre) {
      const cont = document.getElementById('contenedor-menu');
      const categoria = menuCompleto.find(c => c.categoria === catNombre);

      if (!categoria || !categoria.productos.length) {
        cont.innerHTML = `<p style="text-align:center; color:var(--text-muted); margin-top:20px;">Sin productos disponibles.</p>`;
        return;
      }

      cont.innerHTML = categoria.productos.map(p => `
        <div class="product-card">
          <div>
            <div style="font-size:15px; font-weight:bold;">${p.nombre}</div>
            <div style="color:var(--neon-yellow); font-weight:bold; font-size:14px;">$${p.precio.toLocaleString('es-CL')}</div>
          </div>
          <button class="add-btn" onclick="agregarAlCarrito('${p.nombre}', ${p.precio})">+ Agregar</button>
        </div>
      `).join('');
    }

    function agregarAlCarrito(nombre, precio) {
      const itemExistente = carrito.find(i => i.nombre === nombre);
      if (itemExistente) itemExistente.cantidad += 1;
      else carrito.push({ nombre, precio, cantidad: 1 });
      actualizarCarrito();
    }

    function cambiarCantidad(index, delta) {
      carrito[index].cantidad += delta;
      if (carrito[index].cantidad <= 0) carrito.splice(index, 1);
      actualizarCarrito();
      renderizarModal();
      if (carrito.length === 0) cerrarModal();
    }

    function actualizarCarrito() {
      const cantTotal = carrito.reduce((acc, item) => acc + item.cantidad, 0);
      const totalPrecio = carrito.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);

      document.getElementById('cant-items').innerText = `${cantTotal} producto(s)`;
      document.getElementById('total-pedido').innerText = `$${totalPrecio.toLocaleString('es-CL')}`;
      document.getElementById('modal-total-val').innerText = `$${totalPrecio.toLocaleString('es-CL')}`;
      document.getElementById('btn-revisar').disabled = carrito.length === 0;
    }

    function abrirModal() {
      if (carrito.length === 0) return;
      renderizarModal();
      document.getElementById('modal-orden').classList.add('open');
    }

    function cerrarModal() {
      document.getElementById('modal-orden').classList.remove('open');
    }

    function renderizarModal() {
      const cont = document.getElementById('lista-carrito-modal');
      cont.innerHTML = carrito.map((item, index) => `
        <div class="cart-item">
          <div>
            <div style="font-size:14px; font-weight:bold;">${item.nombre}</div>
            <span style="color:var(--neon-yellow); font-size:13px;">$${(item.precio * item.cantidad).toLocaleString('es-CL')}</span>
          </div>
          <div style="display:flex; gap:10px; align-items:center;">
            <button class="btn-qty" onclick="cambiarCantidad(${index}, -1)">-</button>
            <span style="font-weight:bold;">${item.cantidad}</span>
            <button class="btn-qty" onclick="cambiarCantidad(${index}, 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    async function enviarPedido() {
      if (carrito.length === 0) return;

      const itemsParaEnviar = [];
      carrito.forEach(item => {
        for (let i = 0; i < item.cantidad; i++) {
          itemsParaEnviar.push({ nombre: item.nombre, precio: item.precio });
        }
      });

      const total = itemsParaEnviar.reduce((acc, item) => acc + item.precio, 0);
      const payload = { local: localId, mesa: numMesa, items: itemsParaEnviar, total };

      const btnConfirmar = document.getElementById('btn-confirmar');
      btnConfirmar.disabled = true;
      btnConfirmar.innerText = "Enviando a Cocina...";

      try {
        const res = await fetch(`${API_URL}/pedidos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok) {
          alert('¡Tu pedido ha sido recibido en cocina!');
          carrito = [];
          actualizarCarrito();
          cerrarModal();
        } else {
          alert(data.error || 'Ocurrió un error al enviar el pedido.');
        }
      } catch (err) {
        alert('Error de conexión.');
      } finally {
        btnConfirmar.disabled = false;
        btnConfirmar.innerText = "🚀 Pedir Orden";
      }
    }

    cargarMenu();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Digital Futurista</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: rgba(18, 18, 22, 0.85);
      --neon-orange: #ff5500;
      --neon-yellow: #ffea00;
      --grad-neon: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
      --grid-color: rgba(255, 85, 0, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 110px;
      overflow-x: hidden;
      position: relative;
    }

    .grid-background {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 0; perspective: 600px; overflow: hidden;
    }

    .grid-lines {
      position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
      background-image: 
        linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
      background-size: 40px 40px;
      transform: rotateX(55deg) translateY(-20%);
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: rotateX(55deg) translateY(0); }
      100% { transform: rotateX(55deg) translateY(40px); }
    }

    .app-container { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; padding: 20px 15px; }

    header {
      text-align: center; margin-bottom: 25px; padding: 20px; background: var(--card-bg);
      border: 1px solid rgba(255, 85, 0, 0.3);
      clip-path: polygon(0 0, 92% 0, 100% 20px, 100% 100%, 8% 100%, 0 calc(100% - 20px));
    }

    h1 {
      font-size: 26px; text-transform: uppercase; letter-spacing: 2px;
      background: var(--grad-neon); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .mesa-badge {
      display: inline-block; margin-top: 8px; padding: 4px 12px;
      background: rgba(255, 234, 0, 0.1); border: 1px solid var(--neon-yellow);
      color: var(--neon-yellow); font-size: 12px; font-weight: bold; border-radius: 20px;
    }

    .categories-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
    .cat-btn {
      background: rgba(20, 20, 25, 0.8); color: var(--text-muted); border: 1px solid #333;
      padding: 8px 16px; font-size: 13px; font-weight: bold; white-space: nowrap; cursor: pointer;
    }
    .cat-btn.active { color: #000; background: var(--grad-neon); border-color: var(--neon-yellow); }

    .product-card {
      background: var(--card-bg); border: 1px solid rgba(255, 85, 0, 0.2);
      padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;
    }

    .add-btn {
      background: transparent; border: 1px solid var(--neon-orange); color: var(--neon-orange);
      padding: 8px 14px; font-size: 12px; font-weight: bold; cursor: pointer;
    }

    /* BARRA DE CARRITO INFERIOR */
    .cart-bar {
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: rgba(10, 10, 14, 0.95); border-top: 1px solid var(--neon-orange);
      padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100;
    }

    .review-btn {
      background: var(--grad-neon); border: none; color: #000; padding: 12px 20px;
      font-weight: bold; cursor: pointer;
    }

    /* MODAL FLOTANTE DE REVISIÓN DE PEDIDO */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: flex-end; z-index: 200;
    }
    .modal-overlay.open { display: flex; }

    .modal-content {
      background: #121216; border: 1px solid var(--neon-orange);
      border-radius: 12px 12px 0 0; width: 100%; max-width: 600px; max-height: 80vh;
      display: flex; flex-direction: column; padding: 20px; animation: slideUp 0.3s ease;
    }

    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-header { display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding-bottom: 12px; }
    .cart-items-list { overflow-y: auto; flex: 1; margin: 15px 0; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; background: #19191e; padding: 12px; margin-bottom: 8px; }
    .btn-qty { background: #222; border: 1px solid var(--neon-orange); color: var(--neon-orange); width: 28px; height: 28px; cursor: pointer; }

    .confirm-btn { background: var(--grad-neon); border: none; color: #000; padding: 14px; font-weight: bold; cursor: pointer; width: 100%; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="grid-background"><div class="grid-lines"></div></div>

  <div class="app-container">
    <header>
      <h1 id="titulo-local">MENÚ DIGITAL</h1>
      <div class="mesa-badge" id="badge-mesa">MESA --</div>
    </header>

    <div class="categories-bar" id="contenedor-categorias"></div>
    <div id="contenedor-menu"></div>
  </div>

  <div class="cart-bar">
    <div>
      <span id="cant-items" style="font-size:12px; color:var(--text-muted);">0 productos</span><br>
      <strong id="total-pedido" style="font-size:20px; color:var(--neon-yellow);">$0</strong>
    </div>
    <button class="review-btn" id="btn-revisar" onclick="abrirModal()" disabled>Revisar Orden</button>
  </div>

  <!-- MODAL DE CONFIRMACIÓN -->
  <div class="modal-overlay" id="modal-orden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 style="color:var(--neon-yellow); font-size:18px;">📋 Resumen de tu Pedido</h2>
        <button style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;" onclick="cerrarModal()">&times;</button>
      </div>

      <div class="cart-items-list" id="lista-carrito-modal"></div>

      <div style="border-top:1px solid #222; padding-top:15px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-size:18px; font-weight:bold;">
          <span>Total:</span>
          <span id="modal-total-val" style="color:var(--neon-yellow);">$0</span>
        </div>
        <button class="confirm-btn" id="btn-confirmar" onclick="enviarPedido()">🚀 Confirmar y Enviar Pedido</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://appmenu-tavr.onrender.com/api";
    const urlParams = new URLSearchParams(window.location.search);
    const localId = urlParams.get('local') || 'default';
    const numMesa = urlParams.get('mesa') || '1';

    let menuCompleto = [];
    let carrito = [];

    document.getElementById('titulo-local').innerText = localId.replace('-', ' ').toUpperCase();
    document.getElementById('badge-mesa').innerText = `MESA ${numMesa}`;

    async function cargarMenu() {
      try {
        const res = await fetch(`${API_URL}/menu?local=${localId}`);
        menuCompleto = await res.json();
        renderizarCategorias();
        if (menuCompleto.length > 0) renderizarProductos(menuCompleto[0].categoria);
      } catch (err) {
        document.getElementById('contenedor-menu').innerHTML = `<p style="text-align:center; color:var(--neon-orange);">Error cargando la carta digital.</p>`;
      }
    }

    function renderizarCategorias() {
      const cont = document.getElementById('contenedor-categorias');
      cont.innerHTML = menuCompleto.map((cat, index) => `
        <button class="cat-btn ${index === 0 ? 'active' : ''}" onclick="seleccionarCategoria('${cat.categoria}', this)">
          ${cat.categoria}
        </button>
      `).join('');
    }

    function seleccionarCategoria(catNombre, btnElement) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      renderizarProductos(catNombre);
    }

    function renderizarProductos(catNombre) {
      const cont = document.getElementById('contenedor-menu');
      const categoria = menuCompleto.find(c => c.categoria === catNombre);

      if (!categoria || !categoria.productos.length) {
        cont.innerHTML = `<p style="text-align:center; color:var(--text-muted); margin-top:30px;">No hay productos disponibles.</p>`;
        return;
      }

      cont.innerHTML = categoria.productos.map(p => `
        <div class="product-card">
          <div>
            <h3>${p.nombre}</h3>
            <div style="color:var(--neon-yellow); font-weight:bold;">$${p.precio.toLocaleString('es-CL')}</div>
          </div>
          <button class="add-btn" onclick="agregarAlCarrito('${p.nombre}', ${p.precio})">+ Agregar</button>
        </div>
      `).join('');
    }

    function agregarAlCarrito(nombre, precio) {
      const itemExistente = carrito.find(i => i.nombre === nombre);
      if (itemExistente) itemExistente.cantidad += 1;
      else carrito.push({ nombre, precio, cantidad: 1 });
      actualizarCarrito();
    }

    function cambiarCantidad(index, delta) {
      carrito[index].cantidad += delta;
      if (carrito[index].cantidad <= 0) carrito.splice(index, 1);
      actualizarCarrito();
      renderizarModal();
      if (carrito.length === 0) cerrarModal();
    }

    function actualizarCarrito() {
      const cantTotal = carrito.reduce((acc, item) => acc + item.cantidad, 0);
      const totalPrecio = carrito.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);

      document.getElementById('cant-items').innerText = `${cantTotal} producto(s)`;
      document.getElementById('total-pedido').innerText = `$${totalPrecio.toLocaleString('es-CL')}`;
      document.getElementById('modal-total-val').innerText = `$${totalPrecio.toLocaleString('es-CL')}`;
      document.getElementById('btn-revisar').disabled = carrito.length === 0;
    }

    function abrirModal() {
      if (carrito.length === 0) return;
      renderizarModal();
      document.getElementById('modal-orden').classList.add('open');
    }

    function cerrarModal() {
      document.getElementById('modal-orden').classList.remove('open');
    }

    function renderizarModal() {
      const cont = document.getElementById('lista-carrito-modal');
      cont.innerHTML = carrito.map((item, index) => `
        <div class="cart-item">
          <div>
            <h4>${item.nombre}</h4>
            <span style="color:var(--neon-yellow);">$${(item.precio * item.cantidad).toLocaleString('es-CL')}</span>
          </div>
          <div style="display:flex; gap:8px; align-items:center;">
            <button class="btn-qty" onclick="cambiarCantidad(${index}, -1)">-</button>
            <span>${item.cantidad}</span>
            <button class="btn-qty" onclick="cambiarCantidad(${index}, 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    async function enviarPedido() {
      if (carrito.length === 0) return;

      const itemsParaEnviar = [];
      carrito.forEach(item => {
        for (let i = 0; i < item.cantidad; i++) {
          itemsParaEnviar.push({ nombre: item.nombre, precio: item.precio });
        }
      });

      const total = itemsParaEnviar.reduce((acc, item) => acc + item.precio, 0);
      const payload = { local: localId, mesa: numMesa, items: itemsParaEnviar, total };

      const btnConfirmar = document.getElementById('btn-confirmar');
      btnConfirmar.disabled = true;
      btnConfirmar.innerText = "Enviando...";

      try {
        const res = await fetch(`${API_URL}/pedidos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok) {
          alert('¡Tu pedido ha sido enviado con éxito!');
          carrito = [];
          actualizarCarrito();
          cerrarModal();
        } else {
          alert('Error: ' + (data.error || 'Ocurrió un error al enviar el pedido.'));
        }
      } catch (err) {
        alert('Error de conexión con el servidor.');
      } finally {
        btnConfirmar.disabled = false;
        btnConfirmar.innerText = "🚀 Confirmar y Enviar Pedido";
      }
    }

    cargarMenu();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Cliente</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: rgba(18, 18, 22, 0.95);
      --neon-orange: #ff5500;
      --neon-yellow: #ffea00;
      --neon-red: #ff3333;
      --neon-green: #00e676;
      --neon-blue: #00d2ff;
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
    }

    .container { max-width: 900px; margin: 0 auto; }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 85, 0, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    h1, h2, h3 {
      color: var(--neon-yellow);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    textarea {
      padding: 12px;
      background: #121218;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-size: 13px;
      width: 100%;
      min-height: 130px;
      resize: vertical;
      font-family: monospace;
      line-height: 1.4;
    }

    .btn {
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      border: none;
      color: #000;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s ease;
      display: inline-block;
      text-align: center;
      text-decoration: none;
    }

    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: #222; color: #fff; border: 1px solid #444; }
    .btn-secondary:hover { background: #333; }

    .banner-credenciales {
      background: rgba(0, 210, 255, 0.05);
      border: 1px solid var(--neon-blue);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 25px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- ENCABEZADO DEL PANEL -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1 id="titulo-panel">🛠️ Panel de Administración</h1>
      <span id="badge-estado" style="font-size: 12px; padding: 4px 10px; border-radius: 4px; border: 1px solid #666; color: #ccc;">Cargando...</span>
    </div>

    <!-- SECCIÓN CON EL MENSAJE Y CREDENCIALES DEL CLIENTE -->
    <div id="seccion-bienvenida-cliente" class="banner-credenciales" style="display: none;">
      <h3 style="color: var(--neon-blue); font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px;">
        ℹ️ Ficha de Información y Accesos de tu Local
      </h3>
      <div class="form-group" style="margin-bottom: 12px;">
        <textarea id="mensaje-credenciales-cliente" readonly></textarea>
      </div>
      <button class="btn btn-secondary" onclick="copiarCredencialesCliente()" style="width: 100%; font-size: 13px;">
        📋 Copiar Mis Datos de Acceso
      </button>
    </div>

    <!-- SECCIÓN PRINCIPAL DEL PANEL DE CONTROL -->
    <div class="card">
      <h2>🍽️ Gestión del Restaurante</h2>
      <p style="color: var(--text-muted); font-size: 14px;">Bienvenido a tu panel. Desde aquí podrás administrar tu menú, pedidos y configuración general.</p>
    </div>

  </div>

  <script>
    const BACKEND_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://appmenu-tavr.onrender.com';

    let localIdActual = '';

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      localIdActual = urlParams.get('local') || 'demo';

      cargarDatosDelLocal();
    });

    async function cargarDatosDelLocal() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/${encodeURIComponent(localIdActual)}`);
        
        if (!res.ok) {
          document.getElementById('titulo-panel').innerText = "⚠️ Restaurante No Encontrado";
          return;
        }

        const local = await res.json();

        document.getElementById('titulo-panel').innerText = `🛠️ Panel: ${local.nombre}`;
        
        const badge = document.getElementById('badge-estado');
        if (local.activo !== false) {
          badge.innerText = "LICENCIA ACTIVA";
          badge.style.borderColor = "var(--neon-green)";
          badge.style.color = "var(--neon-green)";
        } else {
          badge.innerText = "LICENCIA BLOQUEADA";
          badge.style.borderColor = "var(--neon-red)";
          badge.style.color = "var(--neon-red)";
        }

        // MOSTRAR RECUADRO CON MENSAJE DE BIENVENIDA EN ADMIN.HTML
        mostrarCredencialesEnPanel(local);

      } catch (err) {
        console.error("Error al cargar datos del restaurante:", err);
      }
    }

    function mostrarCredencialesEnPanel(datosLocal) {
      const contenedor = document.getElementById('seccion-bienvenida-cliente');
      const txtArea = document.getElementById('mensaje-credenciales-cliente');

      if (!contenedor || !txtArea) return;

      const urlPanel = `https://cybernovala.github.io/AppMenu/admin.html?local=${datosLocal.localId}`;

      const mensaje = `🎉 ¡Bienvenido a tu panel de administración AppMenu!

📌 Datos de Tu Registro:
• Restaurante: ${datosLocal.nombre}
• RUT Registrado: ${datosLocal.rut || 'No especificado'}
• Correo de Contacto: ${datosLocal.correo || 'No especificado'}
• Slug / URL: ${datosLocal.localId}

🌐 Enlace de Acceso a tu Panel:
${urlPanel}

💬 Soporte Técnico: WhatsApp +56966648585 | appmenunova@gmail.com`;

      txtArea.value = mensaje;
      contenedor.style.display = 'block';
    }

    function copiarCredencialesCliente() {
      const txtArea = document.getElementById('mensaje-credenciales-cliente');
      if (!txtArea || !txtArea.value) return;

      txtArea.select();
      navigator.clipboard.writeText(txtArea.value).then(() => {
        alert("✅ Datos copiados al portapapeles.");
      }).catch(() => {
        alert("Selecciona el texto manualmente para copiarlo.");
      });
    }
  </script>
</body>
</html>

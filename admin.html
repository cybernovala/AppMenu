<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Control - Restaurante</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #080b10;
      --card-bg: rgba(15, 23, 42, 0.85);
      --neon-blue: #00f0ff;
      --neon-green: #00ff66;
      --neon-orange: #ff9900;
      --neon-purple: #7000ff;
      --text-main: #e2e8f0;
      --border-color: rgba(0, 240, 255, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* BARRA SUPERIOR DE PESTAÑAS INTEGRADAS */
    .top-nav {
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 2px solid var(--neon-blue);
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .tab-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn:hover, .tab-btn.active {
      background: var(--neon-blue);
      color: #000;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
    }

    /* SECCIONES / PESTAÑAS */
    .tab-content {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .tab-content.active {
      display: block;
    }

    iframe {
      width: 100%;
      height: 75vh;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- NAVEGACIÓN PRINCIPAL -->
  <nav class="top-nav">
    <button class="tab-btn active" onclick="cambiarPestana('productos', this)">⚙️ Productos & Valores</button>
    <button class="tab-btn" onclick="cambiarPestana('cocina', this)">👨‍🍳 Cocina</button>
    <button class="tab-btn" onclick="cambiarPestana('garzon', this)">🤵 Garzón</button>
    <button class="tab-btn" onclick="cambiarPestana('historial', this)">📜 Historial</button>
  </nav>

  <div class="container">
    <!-- PESTAÑA 1: PRODUCTOS / ADMIN -->
    <div id="tab-productos" class="tab-content active">
      <h2>⚙️ Panel de Gestión de Productos</h2>
      <hr style="border-color: var(--border-color); margin: 15px 0;">
      <iframe id="frame-admin"></iframe>
    </div>

    <!-- PESTAÑA 2: COCINA -->
    <div id="tab-cocina" class="tab-content">
      <h2>👨‍🍳 Panel de Cocina</h2>
      <hr style="border-color: var(--border-color); margin: 15px 0;">
      <iframe id="frame-cocina"></iframe>
    </div>

    <!-- PESTAÑA 3: GARZÓN -->
    <div id="tab-garzon" class="tab-content">
      <h2>🤵 Panel de Garzón</h2>
      <hr style="border-color: var(--border-color); margin: 15px 0;">
      <iframe id="frame-garzon"></iframe>
    </div>

    <!-- PESTAÑA 4: HISTORIAL -->
    <div id="tab-historial" class="tab-content">
      <h2>📜 Historial de Ventas</h2>
      <hr style="border-color: var(--border-color); margin: 15px 0;">
      <iframe id="frame-historial"></iframe>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const localActual = urlParams.get('local') || localStorage.getItem('localId') || 'demo';
    const BASE_URL = "https://cybernovala.github.io/AppMenu";

    // Cargar los módulos correspondientes en cada iframe manteniendo el parámetro ?local=
    document.getElementById('frame-admin').src = `${BASE_URL}/index.html?local=${localActual}`;
    document.getElementById('frame-cocina').src = `${BASE_URL}/cocina.html?local=${localActual}`;
    document.getElementById('frame-garzon').src = `${BASE_URL}/garzon.html?local=${localActual}`;
    document.getElementById('frame-historial').src = `${BASE_URL}/historial.html?local=${localActual}`;

    function cambiarPestana(nombrePestana, boton) {
      // Ocultar todas las pestañas
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      // Mostrar pestaña activa
      document.getElementById(`tab-${nombrePestana}`).classList.add('active');
      boton.classList.add('active');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Control - Restaurante</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Librerías para QR y PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg-color: #080b10;
      --card-bg: rgba(15, 23, 42, 0.85);
      --neon-blue: #00f0ff;
      --neon-green: #00ff66;
      --neon-orange: #ff9900;
      --neon-purple: #7000ff;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --border-color: rgba(0, 240, 255, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* BARRA SUPERIOR DE PESTAÑAS */
    .top-nav {
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 2px solid var(--neon-blue);
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
    }

    .tab-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn:hover, .tab-btn.active {
      background: var(--neon-blue);
      color: #000;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .tab-content {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .tab-content.active {
      display: block;
    }

    iframe {
      width: 100%;
      height: 78vh;
      border: none;
      border-radius: 8px;
      background: #080b10;
    }

    /* HERRAMIENTA QR */
    .qr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .qr-card {
      background: rgba(8, 11, 16, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }

    .qr-card h3 {
      font-family: 'Orbitron', sans-serif;
      color: var(--neon-blue);
      font-size: 1rem;
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-weight: bold;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    input {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      outline: none;
    }

    .btn-action {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.3s ease;
      width: 100%;
    }

    .btn-blue { background: var(--neon-blue); color: #000; }
    .btn-green { background: var(--neon-green); color: #000; }
    .btn-purple { background: var(--neon-purple); color: #fff; }

    #qr-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      background: #fff;
      border-radius: 8px;
      margin-top: 15px;
      min-height: 220px;
    }

    #qr-preview p {
      color: #000;
      font-weight: 900;
      font-family: 'Orbitron', sans-serif;
      margin-top: 10px;
      font-size: 1.1rem;
    }

    #qrcode-hidden { display: none; }
  </style>
</head>
<body>

  <nav class="top-nav">
    <button class="tab-btn active" onclick="cambiarPestana('productos', this)">⚙️ Productos & Valores</button>
    <button class="tab-btn" onclick="cambiarPestana('cocina', this)">👨‍🍳 Cocina</button>
    <button class="tab-btn" onclick="cambiarPestana('garzon', this)">🤵 Garzón</button>
    <button class="tab-btn" onclick="cambiarPestana('historial', this)">📜 Historial</button>
    <button class="tab-btn" onclick="cambiarPestana('qr', this)">📱 Menú & Códigos QR</button>
  </nav>

  <div class="container">
    <!-- PESTAÑA 1: PRODUCTOS -->
    <div id="tab-productos" class="tab-content active">
      <h2>⚙️ Panel de Gestión de Productos</h2>
      <hr style="border-color: var(--border-color); margin: 15px 0;">
      <iframe id="frame-admin"></iframe>
    </div>

    <!-- PESTAÑA 2: COCINA -->
    <div id="tab-cocina" class="tab-content">
      <h2>👨‍🍳 Panel de Cocina</h2>
      <hr style="border-color: var(--border-color); margin: 15px 0;">
      <iframe id="frame-cocina"></iframe>
    </div>

    <!-- PESTAÑA 3: GARZÓN -->
    <div id="tab-garzon" class="tab-content">
      <h2>🤵 Panel de Garzón</h2>
      <hr style="border-color: var(--border-color); margin: 15px 0;">
      <iframe id="frame-garzon"></iframe>
    </div>

    <!-- PESTAÑA 4: HISTORIAL -->
    <div id="tab-historial" class="tab-content">
      <h2>📜 Historial de Ventas y Pedidos</h2>
      <hr style="border-color: var(--border-color); margin: 15px 0;">
      <iframe id="frame-historial"></iframe>
    </div>

    <!-- PESTAÑA 5: CÓDIGOS QR -->
    <div id="tab-qr" class="tab-content">
      <h2>📱 Menú Digital y Generador de Códigos QR</h2>
      <hr style="border-color: var(--border-color); margin: 15px 0;">

      <div class="qr-grid">
        <div class="qr-card">
          <h3>🔗 URL Menú del Cliente</h3>
          <div class="form-group">
            <label>Enlace Público:</label>
            <input type="text" id="url-menu-input" readonly>
          </div>
          <button class="btn-action btn-blue" onclick="copiarUrlMenu()">📋 Copiar Link del Menú</button>
          <button class="btn-action btn-purple" style="margin-top: 10px;" onclick="abrirMenuCliente()">🌐 Ver Carta Digital</button>
        </div>

        <div class="qr-card">
          <h3>🖼️ QR Individual por Mesa</h3>
          <div class="form-group">
            <label>Número de Mesa:</label>
            <input type="number" id="num-mesa-ind" value="1" min="1">
          </div>
          <button class="btn-action btn-green" onclick="generarQRIndividual()">⚡ Generar Vista Previa</button>
          
          <div id="qr-preview">
            <div id="qr-canvas"></div>
            <p id="qr-label-preview">MESA 1</p>
          </div>
          <button class="btn-action btn-blue" style="margin-top: 10px;" onclick="descargarQRImagen()">📥 Descargar Imagen PNG</button>
        </div>

        <div class="qr-card">
          <h3>📄 Generar PDF por Rango (5x5 cm)</h3>
          <div class="form-group">
            <label>Desde la Mesa N°:</label>
            <input type="number" id="mesa-desde" value="1" min="1">
          </div>
          <div class="form-group">
            <label>Hasta la Mesa N°:</label>
            <input type="number" id="mesa-hasta" value="13" min="1">
          </div>
          <button class="btn-action btn-green" onclick="generarPDFRangos()">📄 Descargar PDF Imprimible</button>
        </div>
      </div>
    </div>
  </div>

  <div id="qrcode-hidden"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const localActual = urlParams.get('local') || localStorage.getItem('localId') || 'demo';
    const BASE_URL = "https://cybernovala.github.io/AppMenu";
    const URL_CLIENTE = `${BASE_URL}/index.html?local=${localActual}`;

    // Configuración de LocalStorage local
    localStorage.setItem('localId', localActual);
    localStorage.setItem('esAdmin', 'true');

    // Carga de marcos forzando los parámetros de vista
    document.getElementById('frame-admin').src = `${BASE_URL}/index.html?local=${localActual}&admin=true&view=admin#admin`;
    document.getElementById('frame-cocina').src = `${BASE_URL}/cocina.html?local=${localActual}`;
    document.getElementById('frame-garzon').src = `${BASE_URL}/garzon.html?local=${localActual}`;
    document.getElementById('frame-historial').src = `${BASE_URL}/index.html?local=${localActual}&admin=true&view=historial#historial`;
    
    document.getElementById('url-menu-input').value = URL_CLIENTE;

    function cambiarPestana(nombrePestana, boton) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${nombrePestana}`).classList.add('active');
      boton.classList.add('active');

      if (nombrePestana === 'qr') {
        generarQRIndividual();
      }
    }

    function copiarUrlMenu() {
      const input = document.getElementById('url-menu-input');
      input.select();
      document.execCommand('copy');
      alert('✅ Enlace copiado al portapapeles');
    }

    function abrirMenuCliente() {
      window.open(URL_CLIENTE, '_blank');
    }

    let qrObj = null;
    function generarQRIndividual() {
      const mesa = document.getElementById('num-mesa-ind').value || '1';
      const urlFinal = `${URL_CLIENTE}&mesa=${mesa}`;
      const qrDiv = document.getElementById('qr-canvas');
      
      qrDiv.innerHTML = "";
      document.getElementById('qr-label-preview').innerText = `MESA ${mesa}`;

      qrObj = new QRCode(qrDiv, {
        text: urlFinal,
        width: 150,
        height: 150,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function descargarQRImagen() {
      const mesa = document.getElementById('num-mesa-ind').value || '1';
      const img = document.querySelector('#qr-canvas img');
      if (!img) return alert("Genera primero el código QR");

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 300;
      canvas.height = 360;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 25, 20, 250, 250);

      ctx.fillStyle = '#000000';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`MESA ${mesa}`, canvas.width / 2, 320);

      const enlace = document.createElement('a');
      enlace.download = `QR_Mesa_${mesa}_${localActual}.png`;
      enlace.href = canvas.toDataURL('image/png');
      enlace.click();
    }

    async function generarPDFRangos() {
      const desde = parseInt(document.getElementById('mesa-desde').value);
      const hasta = parseInt(document.getElementById('mesa-hasta').value);

      if (isNaN(desde) || isNaN(hasta) || desde > hasta) {
        return alert("Ingresa un rango válido de mesas.");
      }

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'cm', format: 'a4' });

      const tarjetaAncho = 5;
      const tarjetaAlto = 6;
      const margenX = 1;
      const margenY = 1;
      const columnas = 3;
      const filas = 4;

      let colActual = 0;
      let filaActual = 0;

      const tempDiv = document.getElementById('qrcode-hidden');

      for (let i = desde; i <= hasta; i++) {
        tempDiv.innerHTML = "";
        const urlMesa = `${URL_CLIENTE}&mesa=${i}`;

        new QRCode(tempDiv, {
          text: urlMesa,
          width: 200,
          height: 200,
          colorDark: "#000000",
          colorLight: "#ffffff"
        });

        await new Promise(r => setTimeout(r, 100));
        const imgQr = tempDiv.querySelector('img').src;

        const x = margenX + (colActual * (tarjetaAncho + 1.5));
        const y = margenY + (filaActual * (tarjetaAlto + 0.8));

        pdf.setLineWidth(0.02);
        pdf.setDrawColor(180, 180, 180);
        pdf.rect(x, y, tarjetaAncho, tarjetaAlto);

        pdf.addImage(imgQr, 'PNG', x + 0.25, y + 0.25, 4.5, 4.5);

        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(12);
        pdf.setTextColor(0, 0, 0);
        pdf.text(`MESA ${i}`, x + (tarjetaAncho / 2), y + 5.4, { align: "center" });

        colActual++;
        if (colActual >= columnas) {
          colActual = 0;
          filaActual++;
        }

        if (filaActual >= filas && i < hasta) {
          pdf.addPage();
          colActual = 0;
          filaActual = 0;
        }
      }

      pdf.save(`QR_Mesas_${desde}_a_${hasta}_${localActual}.pdf`);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Panel de Administración</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: rgba(18, 18, 22, 0.95);
      --neon-orange: #ff5500;
      --neon-yellow: #ffea00;
      --grad-neon: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    body, html {
      height: 100%;
      width: 100%;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    .admin-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    header {
      background: #000;
      border-bottom: 1px solid rgba(255, 85, 0, 0.3);
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: bold;
      background: var(--grad-neon);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .tabs-bar {
      display: flex;
      background: #101015;
      border-bottom: 1px solid #222;
      overflow-x: auto;
      flex-shrink: 0;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 1;
      min-width: 110px;
      padding: 12px 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--neon-yellow);
      border-bottom-color: var(--neon-orange);
      background: rgba(255, 85, 0, 0.05);
    }

    .content-area {
      flex: 1;
      position: relative;
      overflow-y: auto;
      padding: 15px;
    }

    /* Vistas directas */
    .view-panel { display: none; }
    .view-panel.active { display: block; }

    /* Estilos de Formularios y Listas */
    .section-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 85, 0, 0.3);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    h2 { font-size: 16px; color: var(--neon-yellow); margin-bottom: 12px; text-transform: uppercase; }

    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    input {
      width: 100%; padding: 10px; background: #14141a; border: 1px solid #333;
      color: #fff; border-radius: 6px; font-size: 14px;
    }

    .btn-action {
      background: var(--grad-neon); border: none; color: #000;
      padding: 12px; font-weight: bold; width: 100%; border-radius: 6px; cursor: pointer;
    }

    .item-row {
      display: flex; justify-content: space-between; align-items: center;
      background: #14141a; padding: 10px; border-radius: 6px; margin-bottom: 8px;
    }

    .btn-del {
      background: #ff3333; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer;
    }

    iframe { width: 100%; height: 100%; border: none; min-height: 80vh; }
  </style>
</head>
<body>

  <div class="admin-layout">
    <header>
      <div class="brand-title" id="admin-local-name">PANEL DE CONTROL</div>
    </header>

    <nav class="tabs-bar">
      <button class="tab-btn active" onclick="cambiarPestana('productos', this)">📦 Productos</button>
      <button class="tab-btn" onclick="cambiarPestana('historial', this)">📜 Historial</button>
      <button class="tab-btn" onclick="cambiarPestana('cocina', this)">👨‍🍳 Cocina</button>
      <button class="tab-btn" onclick="cambiarPestana('garzon', this)">🍷 Garzón</button>
    </nav>

    <main class="content-area">
      
      <!-- Pestaña 1: Productos -->
      <div id="view-productos" class="view-panel active">
        <div class="section-card">
          <h2>➕ Agregar Producto</h2>
          <div class="form-group">
            <label>Categoría</label>
            <input type="text" id="prod-categoria" placeholder="Ej: Bebidas, Comida">
          </div>
          <div class="form-group">
            <label>Nombre del Producto</label>
            <input type="text" id="prod-nombre" placeholder="Ej: Hamburguesa Doble">
          </div>
          <div class="form-group">
            <label>Precio ($)</label>
            <input type="number" id="prod-precio" placeholder="Ej: 5900">
          </div>
          <button class="btn-action" onclick="guardarProducto()">Guardar Producto</button>
        </div>

        <div class="section-card">
          <h2>📋 Lista de Productos</h2>
          <div id="lista-productos">Cargando...</div>
        </div>
      </div>

      <!-- Pestaña 2: Historial -->
      <div id="view-historial" class="view-panel">
        <div class="section-card">
          <h2>📜 Historial de Ventas</h2>
          <div id="lista-historial">Cargando historial...</div>
        </div>
      </div>

      <!-- Pestaña 3: Cocina -->
      <div id="view-cocina" class="view-panel">
        <iframe id="frame-cocina"></iframe>
      </div>

      <!-- Pestaña 4: Garzón -->
      <div id="view-garzon" class="view-panel">
        <iframe id="frame-garzon"></iframe>
      </div>

    </main>
  </div>

  <script>
    const API_URL = "https://appmenu-tavr.onrender.com/api";
    const urlParams = new URLSearchParams(window.location.search);
    const localActual = urlParams.get('local') || 'default';
    const BASE_URL = window.location.origin;

    document.getElementById('admin-local-name').innerText = `LOCAL: ${localActual.replace('-', ' ').toUpperCase()}`;

    // Carga de marcos externos para cocina y garzón
    document.getElementById('frame-cocina').src = `${BASE_URL}/cocina.html?local=${localActual}`;
    document.getElementById('frame-garzon').src = `${BASE_URL}/garzon.html?local=${localActual}`;

    function cambiarPestana(nombre, btnElement) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(v => v.classList.remove('active'));

      btnElement.classList.add('active');
      document.getElementById(`view-${nombre}`).classList.add('active');

      if (nombre === 'productos') cargarProductos();
      if (nombre === 'historial') cargarHistorial();
    }

    async function cargarProductos() {
      try {
        const res = await fetch(`${API_URL}/menu?local=${localActual}`);
        const data = await res.json();
        const cont = document.getElementById('lista-productos');
        
        if (!data || !data.length) {
          cont.innerHTML = `<p style="color:var(--text-muted)">No hay productos registrados.</p>`;
          return;
        }

        let html = '';
        data.forEach(cat => {
          html += `<h4 style="color:var(--neon-orange); margin:10px 0;">${cat.categoria}</h4>`;
          cat.productos.forEach(p => {
            html += `
              <div class="item-row">
                <div>
                  <strong>${p.nombre}</strong> - $${p.precio.toLocaleString('es-CL')}
                </div>
                <button class="btn-del" onclick="eliminarProducto('${cat.categoria}', '${p.nombre}')">Eliminar</button>
              </div>
            `;
          });
        });
        cont.innerHTML = html;
      } catch (err) {
        document.getElementById('lista-productos').innerHTML = 'Error al cargar productos.';
      }
    }

    async function guardarProducto() {
      const categoria = document.getElementById('prod-categoria').value.trim();
      const nombre = document.getElementById('prod-nombre').value.trim();
      const precio = parseFloat(document.getElementById('prod-precio').value);

      if (!categoria || !nombre || isNaN(precio)) {
        alert('Completa todos los campos.');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/menu`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ local: localActual, categoria, nombre, precio })
        });

        if (res.ok) {
          alert('Producto guardado');
          document.getElementById('prod-nombre').value = '';
          document.getElementById('prod-precio').value = '';
          cargarProductos();
        }
      } catch (err) { alert('Error al guardar'); }
    }

    async function eliminarProducto(categoria, nombre) {
      if (!confirm(`¿Eliminar ${nombre}?`)) return;
      try {
        const res = await fetch(`${API_URL}/menu`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ local: localActual, categoria, nombre })
        });
        if (res.ok) cargarProductos();
      } catch (err) { alert('Error al eliminar'); }
    }

    async function cargarHistorial() {
      try {
        const res = await fetch(`${API_URL}/pedidos?local=${localActual}`);
        const pedidos = await res.json();
        const cont = document.getElementById('lista-historial');

        if (!pedidos || !pedidos.length) {
          cont.innerHTML = `<p style="color:var(--text-muted)">No hay ventas registradas.</p>`;
          return;
        }

        cont.innerHTML = pedidos.map(p => `
          <div class="item-row" style="flex-direction:column; align-items:flex-start;">
            <div style="display:flex; justify-content:space-between; width:100%;">
              <strong style="color:var(--neon-yellow)">MESA ${p.mesa}</strong>
              <span style="color:var(--text-muted); font-size:12px;">${p.fecha ? new Date(p.fecha).toLocaleTimeString() : ''}</span>
            </div>
            <div>Total: $${p.total ? p.total.toLocaleString('es-CL') : '0'}</div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('lista-historial').innerHTML = 'Error al cargar historial.';
      }
    }

    // Carga inicial
    cargarProductos();
  </script>
</body>
</html>

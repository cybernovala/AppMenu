<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - AppMenu</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: rgba(18, 18, 22, 0.95);
      --neon-orange: #ff5500;
      --neon-yellow: #ffea00;
      --grad-neon: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
    }

    .container { max-width: 800px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }

    h1 { color: var(--neon-yellow); font-size: 22px; }

    .nav-links {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      background: #14141a;
      border: 1px solid var(--neon-orange);
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }

    .nav-btn:hover {
      background: var(--neon-orange);
      color: #000;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }
    input, select {
      width: 100%; padding: 10px; background: #14141a; border: 1px solid #333;
      color: #fff; border-radius: 6px; margin-bottom: 12px;
    }

    button.btn-submit {
      width: 100%; background: var(--grad-neon); border: none; color: #000;
      padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer;
    }

    .item-row {
      display: flex; justify-content: space-between; align-items: center;
      background: #14141a; padding: 10px 15px; border-radius: 6px; margin-bottom: 8px;
    }

    .btn-delete { background: #ff3333; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1 id="titulo-local">Cargando Local...</h1>
        <p style="font-size: 12px; color: var(--text-muted);">Panel General de Gestión</p>
      </div>

      <!-- NAVEGACIÓN CORREGIDA SIN ERROR 404 -->
      <nav class="nav-links">
        <a id="link-cocina" class="nav-btn" href="#">👨‍🍳 Cocina</a>
        <a id="link-garzon" class="nav-btn" href="#">🤵 Garzón</a>
        <a id="link-menu" class="nav-btn" href="#" target="_blank">📖 Ver Carta</a>
      </nav>
    </header>

    <!-- AGREGAR PLATOS -->
    <div class="card">
      <h2 style="font-size: 16px; color: var(--neon-yellow); margin-bottom: 12px;">➕ Agregar Nuevo Producto</h2>
      
      <label>Nombre del Producto</label>
      <input type="text" id="nombre" placeholder="Ej: Hamburguesa Doble">

      <label>Categoría</label>
      <input type="text" id="categoria" placeholder="Ej: Comida, Bebida, Postre">

      <label>Precio ($)</label>
      <input type="number" id="precio" placeholder="Ej: 5990">

      <button class="btn-submit" onclick="agregarPlato()">Guardar Producto</button>
    </div>

    <!-- LISTADO -->
    <div class="card">
      <h2 style="font-size: 16px; color: var(--neon-yellow); margin-bottom: 12px;">📋 Menú Actual</h2>
      <div id="lista-menu">Cargando menú...</div>
    </div>
  </div>

  <script>
    const API_URL = "https://appmenu-tavr.onrender.com/api";
    const params = new URLSearchParams(window.location.search);
    const currentLocal = params.get('local') || 'default';

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('titulo-local').innerText = `Local: ${currentLocal.replace(/-/g, ' ').toUpperCase()}`;
      
      // Mantiene el parámetro 'local' en todos los enlaces del menú
      document.getElementById('link-cocina').href = `cocina.html?local=${currentLocal}`;
      document.getElementById('link-garzon').href = `garzon.html?local=${currentLocal}`;
      document.getElementById('link-menu').href = `index.html?local=${currentLocal}`;

      cargarMenu();
    });

    async function cargarMenu() {
      const lista = document.getElementById('lista-menu');
      try {
        const res = await fetch(`${API_URL}/menu?local=${currentLocal}`);
        const platos = await res.json();

        if (!platos || platos.length === 0) {
          lista.innerHTML = `<p style="color:var(--text-muted)">No hay productos creados en este local.</p>`;
          return;
        }

        lista.innerHTML = platos.map(p => `
          <div class="item-row">
            <div>
              <strong>${p.nombre}</strong> <span style="font-size: 12px; color: var(--text-muted);">(${p.categoria})</span>
              <div style="color: var(--neon-yellow); font-size: 13px;">$${p.precio}</div>
            </div>
            <button class="btn-delete" onclick="eliminarPlato('${p._id}')">Eliminar</button>
          </div>
        `).join('');

      } catch (err) {
        lista.innerHTML = `<p style="color:var(--text-muted)">Error al cargar el menú.</p>`;
      }
    }

    async function agregarPlato() {
      const nombre = document.getElementById('nombre').value.trim();
      const categoria = document.getElementById('categoria').value.trim() || 'General';
      const precio = document.getElementById('precio').value;

      if (!nombre || !precio) {
        alert('Por favor completa el nombre y el precio.');
        return;
      }

      try {
        await fetch(`${API_URL}/menu`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ local: currentLocal, nombre, categoria, precio: Number(precio) })
        });

        document.getElementById('nombre').value = '';
        document.getElementById('precio').value = '';
        cargarMenu();

      } catch (err) {
        alert('Error al guardar el producto.');
      }
    }

    async function eliminarPlato(id) {
      if (!confirm('¿Deseas eliminar este producto?')) return;
      try {
        await fetch(`${API_URL}/menu/${id}`, { method: 'DELETE' });
        cargarMenu();
      } catch (err) {
        alert('Error al eliminar.');
      }
    }
  </script>
</body>
</html>

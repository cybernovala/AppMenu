<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración de Menú</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #141419;
      color: #fff;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { color: #ff5500; text-align: center; }
    .card {
      background: #1f1f26;
      border: 1px solid #333;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    label { font-weight: bold; display: block; margin-top: 10px; }
    input, button {
      padding: 10px;
      margin: 5px 0;
      border-radius: 4px;
      border: 1px solid #444;
      box-sizing: border-box;
    }
    input { background: #2a2a35; color: #fff; width: 100%; }
    .btn { background: #ff5500; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    .btn-green { background: #4CAF50; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    .btn-red { background: #f44336; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    
    .category-box {
      background: #252530;
      border-left: 4px solid #ff5500;
      padding: 15px;
      margin-top: 15px;
      border-radius: 4px;
    }
    .cat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .product-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
    .product-row input[type="text"] { flex: 2; }
    .product-row input[type="number"] { flex: 1; }

    /* Estilos del Banner de Suscripción */
    .banner-sub {
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      display: none;
    }
    .banner-ok { background: rgba(46, 125, 50, 0.2); border: 1px solid #4CAF50; color: #81c784; }
    .banner-warn { background: rgba(255, 152, 0, 0.2); border: 1px solid #ff9800; color: #ffb74d; animation: pulse 1.5s infinite; }
    .banner-danger { background: rgba(244, 67, 54, 0.2); border: 1px solid #f44336; color: #e57373; }

    @keyframes pulse {
      0% { opacity: 0.8; }
      50% { opacity: 1; }
      100% { opacity: 0.8; }
    }
  </style>
</head>
<body>

  <h1>⚙️ Administración del Menú</h1>

  <!-- Banner de Estado de Pago / Vencimiento -->
  <div id="banner-suscripcion" class="banner-sub"></div>

  <!-- Autenticación -->
  <div class="card">
    <label for="admin-pass">Contraseña de Administrador del Local:</label>
    <input type="password" id="admin-pass" placeholder="Ingresa tu clave de administrador">
  </div>

  <!-- Crear Nueva Categoría -->
  <div class="card">
    <h3>📁 Agregar Nueva Categoría</h3>
    <div style="display:flex; gap:10px;">
      <input type="text" id="nueva-cat-nombre" placeholder="Ej: Bebidas, Hamburguesas">
      <button class="btn-green" onclick="agregarCategoria()">Crear Categoría</button>
    </div>
  </div>

  <!-- Estructura del Menú -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>📋 Estructura de la Carta</h3>
      <button class="btn-green" style="padding: 12px 20px;" onclick="guardarCambiosMenu()">💾 Guardar Cambios</button>
    </div>
    <div id="contenedor-categorias"></div>
  </div>

  <script>
    const API_URL = "https://appmenu-tavr.onrender.com/api";
    const urlParams = new URLSearchParams(window.location.search);
    const localId = urlParams.get('local') || 'default';

    let menuDatos = [];

    async function verificarSuscripcion() {
      try {
        const res = await fetch(`${API_URL}/suscripcion?local=${localId}`);
        const data = await res.json();
        const banner = document.getElementById('banner-suscripcion');
        banner.style.display = 'block';

        if (data.vencido) {
          banner.className = 'banner-sub banner-danger';
          banner.innerHTML = `🚨 <strong>SUSCRIPCIÓN VENCIDA:</strong> Tu periodo expiró el ${data.fechaVencimiento}. El sistema de pedidos se encuentra pausado.`;
        } else if (data.alerta) {
          banner.className = 'banner-sub banner-warn';
          banner.innerHTML = `⚠️ <strong>AVISO DE PAGO:</strong> Tu mensualidad vence en ${data.diasRestantes} día(s) (${data.fechaVencimiento}). Contacta al administrador para renovar tu servicio.`;
        } else {
          banner.className = 'banner-sub banner-ok';
          banner.innerHTML = `📅 <strong>Suscripción Activa:</strong> Próximo vencimiento el <strong>${data.fechaVencimiento}</strong>.`;
        }
      } catch (err) {
        console.error("Error comprobando suscripción", err);
      }
    }

    async function cargarMenu() {
      try {
        const res = await fetch(`${API_URL}/menu?local=${localId}`);
        menuDatos = await res.json();
        renderizarEstructura();
      } catch (err) {
        alert("Error al cargar la información del menú.");
      }
    }

    function renderizarEstructura() {
      const cont = document.getElementById('contenedor-categorias');
      cont.innerHTML = "";

      if (menuDatos.length === 0) {
        cont.innerHTML = "<p style='color:#aaa;'>No hay categorías creadas. Agrega una arriba.</p>";
        return;
      }

      menuDatos.forEach((cat, catIdx) => {
        const catBox = document.createElement('div');
        catBox.className = 'category-box';

        let productosHTML = cat.productos.map((prod, prodIdx) => `
          <div class="product-row">
            <input type="text" value="${prod.nombre}" onchange="actualizarProducto(${catIdx}, ${prodIdx}, 'nombre', this.value)">
            <input type="number" value="${prod.precio}" onchange="actualizarProducto(${catIdx}, ${prodIdx}, 'precio', this.value)">
            <button class="btn-red" onclick="eliminarProducto(${catIdx}, ${prodIdx})">🗑️</button>
          </div>
        `).join('');

        catBox.innerHTML = `
          <div class="cat-header">
            <input type="text" value="${cat.categoria}" style="font-weight:bold; font-size:16px; width:60%;" onchange="renombrarCategoria(${catIdx}, this.value)">
            <button class="btn-red" onclick="eliminarCategoria(${catIdx})">Eliminar Categoría</button>
          </div>
          <div style="margin-top: 10px;">
            <strong>Productos:</strong>
            ${productosHTML}
            <button class="btn" style="margin-top: 5px; font-size:12px;" onclick="agregarProducto(${catIdx})">+ Agregar Producto</button>
          </div>
        `;

        cont.appendChild(catBox);
      });
    }

    function agregarCategoria() {
      const input = document.getElementById('nueva-cat-nombre');
      const nombre = input.value.trim();
      if (!nombre) return alert("Escribe un nombre para la categoría.");

      menuDatos.push({ categoria: nombre, productos: [] });
      input.value = "";
      renderizarEstructura();
    }

    function renombrarCategoria(catIdx, nuevoNombre) {
      menuDatos[catIdx].categoria = nuevoNombre.trim();
    }

    function eliminarCategoria(catIdx) {
      if (confirm(`¿Eliminar la categoría "${menuDatos[catIdx].categoria}"?`)) {
        menuDatos.splice(catIdx, 1);
        renderizarEstructura();
      }
    }

    function agregarProducto(catIdx) {
      menuDatos[catIdx].productos.push({ id: Date.now().toString(), nombre: "Nuevo Producto", precio: 1000 });
      renderizarEstructura();
    }

    function actualizarProducto(catIdx, prodIdx, campo, valor) {
      if (campo === 'precio') {
        menuDatos[catIdx].productos[prodIdx].precio = parseInt(valor) || 0;
      } else {
        menuDatos[catIdx].productos[prodIdx].nombre = valor;
      }
    }

    function eliminarProducto(catIdx, prodIdx) {
      menuDatos[catIdx].productos.splice(prodIdx, 1);
      renderizarEstructura();
    }

    async function guardarCambiosMenu() {
      const password = document.getElementById('admin-pass').value.trim();
      if (!password) return alert("Ingresa la contraseña de administrador.");

      try {
        const res = await fetch(`${API_URL}/menu`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ local: localId, password, menu: menuDatos })
        });

        if (res.ok) alert("¡Menú actualizado correctamente!");
        else alert("Error al guardar menú.");
      } catch (err) {
        alert("Error de conexión al guardar cambios.");
      }
    }

    verificarSuscripcion();
    cargarMenu();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Menú</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1, h2, h3 {
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .card {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* Formularios e Inputs */
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        input[type="text"], input[type="number"], select {
            flex: 1;
            min-width: 180px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            padding: 10px 18px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #219150;
        }

        button.btn-danger {
            background-color: #e74c3c;
        }
        button.btn-danger:hover {
            background-color: #c0392b;
        }

        button.btn-warning {
            background-color: #f39c12;
        }
        button.btn-warning:hover {
            background-color: #d68910;
        }

        button.btn-secondary {
            background-color: #7f8c8d;
        }
        button.btn-secondary:hover {
            background-color: #626567;
        }

        /* Mensajes de Alerta */
        #alert-message {
            display: none;
            padding: 12px 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        /* Tablas y Listas */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f8f9fa;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-active {
            background-color: #27ae60;
            color: white;
        }

        .status-inactive {
            background-color: #95a5a6;
            color: white;
        }

        .actions {
            display: flex;
            gap: 5px;
        }

        /* Vista previa Menú Final */
        .preview-category {
            margin-bottom: 20px;
            border-left: 4px solid #3498db;
            padding-left: 15px;
        }

        .preview-product {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Panel de Administración del Menú</h1>
    
    <!-- Mensaje de Notificación -->
    <div id="alert-message"></div>

    <!-- 1. CREAR CATEGORÍA -->
    <div class="card">
        <h2>1. Gestión de Categorías</h2>
        <form id="category-form" class="form-group">
            <input type="text" id="category-name" placeholder="Nombre de la Categoría (Ej: Bebidas, Entradas)" required>
            <button type="submit">Crear Categoría</button>
        </form>

        <table id="categories-table">
            <thead>
                <tr>
                    <th>Categoría</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="categories-list">
                <!-- Se llena dinámicamente -->
            </tbody>
        </table>
    </div>

    <!-- 2. CREAR Y EDITAR PRODUCTO -->
    <div class="card">
        <h2>2. Crear / Editar Producto</h2>
        <form id="product-form" class="form-group">
            <input type="hidden" id="product-id">
            <select id="product-category" required>
                <option value="">-- Seleccionar Categoría --</option>
            </select>
            <input type="text" id="product-name" placeholder="Nombre del Producto" required>
            <input type="number" id="product-price" step="0.01" min="0" placeholder="Precio ($)" required>
            <button type="submit" id="btn-save-product">Agregar Producto</button>
            <button type="button" id="btn-cancel-edit" class="btn-secondary" style="display: none;">Cancelar</button>
        </form>

        <table id="products-table">
            <thead>
                <tr>
                    <th>Categoría</th>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="products-list">
                <!-- Se llena dinámicamente -->
            </tbody>
        </table>
    </div>

    <!-- 3. VISTA PREVIA DEL MENÚ FINAL -->
    <div class="card">
        <h2>3. Vista Previa del Menú Final (Cliente)</h2>
        <div id="final-menu-preview">
            <!-- Se llena dinámicamente -->
        </div>
    </div>
</div>

<script>
    // Estructura principal de Datos
    let menuData = JSON.parse(localStorage.getItem('menuRestaurante')) || {
        categories: [],
        products: []
    };

    // Elementos del DOM
    const categoryForm = document.getElementById('category-form');
    const categoryInput = document.getElementById('category-name');
    const categoriesList = document.getElementById('categories-list');
    
    const productForm = document.getElementById('product-form');
    const productIdInput = document.getElementById('product-id');
    const productCategorySelect = document.getElementById('product-category');
    const productNameInput = document.getElementById('product-name');
    const productPriceInput = document.getElementById('product-price');
    const btnSaveProduct = document.getElementById('btn-save-product');
    const btnCancelEdit = document.getElementById('btn-cancel-edit');
    const productsList = document.getElementById('products-list');
    
    const alertMessage = document.getElementById('alert-message');
    const finalMenuPreview = document.getElementById('final-menu-preview');

    // Inicializar
    document.addEventListener('DOMContentLoaded', () => {
        renderAll();
    });

    // Guardar en LocalStorage
    function saveData() {
        localStorage.setItem('menuRestaurante', JSON.stringify(menuData));
        renderAll();
    }

    // Mostrar Notificaciones
    function showAlert(msg, type = 'success') {
        alertMessage.textContent = msg;
        alertMessage.className = type === 'success' ? 'alert-success' : 'alert-info';
        alertMessage.style.display = 'block';
        setTimeout(() => {
            alertMessage.style.display = 'none';
        }, 3000);
    }

    // -------------------------------------------------------------
    // GESTIÓN DE CATEGORÍAS
    // -------------------------------------------------------------
    categoryForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = categoryInput.value.trim();
        if (!name) return;

        const newCategory = {
            id: Date.now().toString(),
            name: name,
            active: true
        };

        menuData.categories.push(newCategory);
        saveData();
        categoryInput.value = '';
        showAlert(`Categoría "${name}" creada correctamente.`);
    });

    function toggleCategoryStatus(id) {
        const cat = menuData.categories.find(c => c.id === id);
        if (cat) {
            cat.active = !cat.active;
            saveData();
            const estadoText = cat.active ? 'activada' : 'desactivada';
            showAlert(`Categoría "${cat.name}" ${estadoText} correctamente.`, 'info');
        }
    }

    function deleteCategory(id) {
        if (confirm('¿Desea eliminar esta categoría y sus productos asociados?')) {
            menuData.categories = menuData.categories.filter(c => c.id !== id);
            menuData.products = menuData.products.filter(p => p.categoryId !== id);
            saveData();
            showAlert('Categoría eliminada.', 'info');
        }
    }

    // -------------------------------------------------------------
    // GESTIÓN DE PRODUCTOS
    // -------------------------------------------------------------
    productForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const id = productIdInput.value;
        const categoryId = productCategorySelect.value;
        const name = productNameInput.value.trim();
        const price = parseFloat(productPriceInput.value);

        if (!categoryId || !name || isNaN(price)) return;

        if (id) {
            // Editar existente
            const prod = menuData.products.find(p => p.id === id);
            if (prod) {
                prod.categoryId = categoryId;
                prod.name = name;
                prod.price = price;
                showAlert(`Producto "${name}" actualizado correctamente.`);
            }
        } else {
            // Crear nuevo
            const newProduct = {
                id: Date.now().toString(),
                categoryId: categoryId,
                name: name,
                price: price,
                active: true
            };
            menuData.products.push(newProduct);
            showAlert(`Producto "${name}" agregado correctamente.`);
        }

        resetProductForm();
        saveData();
    });

    function editProduct(id) {
        const prod = menuData.products.find(p => p.id === id);
        if (prod) {
            productIdInput.value = prod.id;
            productCategorySelect.value = prod.categoryId;
            productNameInput.value = prod.name;
            productPriceInput.value = prod.price;

            btnSaveProduct.textContent = 'Actualizar Producto';
            btnCancelEdit.style.display = 'inline-block';
        }
    }

    function toggleProductStatus(id) {
        const prod = menuData.products.find(p => p.id === id);
        if (prod) {
            prod.active = !prod.active;
            saveData();
            const estadoText = prod.active ? 'activado' : 'desactivado';
            showAlert(`Producto "${prod.name}" ${estadoText} correctamente.`, 'info');
        }
    }

    function deleteProduct(id) {
        if (confirm('¿Desea eliminar este producto?')) {
            menuData.products = menuData.products.filter(p => p.id !== id);
            saveData();
            showAlert('Producto eliminado.', 'info');
        }
    }

    function resetProductForm() {
        productIdInput.value = '';
        productForm.reset();
        btnSaveProduct.textContent = 'Agregar Producto';
        btnCancelEdit.style.display = 'none';
    }

    btnCancelEdit.addEventListener('click', resetProductForm);

    // -------------------------------------------------------------
    // RENDERIZADO GENERAL
    // -------------------------------------------------------------
    function renderAll() {
        renderCategories();
        renderProducts();
        renderFinalPreview();
    }

    function renderCategories() {
        categoriesList.innerHTML = '';
        productCategorySelect.innerHTML = '<option value="">-- Seleccionar Categoría --</option>';

        menuData.categories.forEach(cat => {
            // Tabla admin
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${cat.name}</strong></td>
                <td>
                    <span class="status-badge ${cat.active ? 'status-active' : 'status-inactive'}">
                        ${cat.active ? 'Activa' : 'Inactiva'}
                    </span>
                </td>
                <td class="actions">
                    <button class="${cat.active ? 'btn-warning' : ''}" onclick="toggleCategoryStatus('${cat.id}')">
                        ${cat.active ? 'Desactivar' : 'Activar'}
                    </button>
                    <button class="btn-danger" onclick="deleteCategory('${cat.id}')">Eliminar</button>
                </td>
            `;
            categoriesList.appendChild(tr);

            // Select de productos (solo categorías creadas)
            const option = document.createElement('option');
            option.value = cat.id;
            option.textContent = cat.name + (!cat.active ? ' (Inactiva)' : '');
            productCategorySelect.appendChild(option);
        });
    }

    function renderProducts() {
        productsList.innerHTML = '';

        menuData.products.forEach(prod => {
            const category = menuData.categories.find(c => c.id === prod.categoryId);
            const categoryName = category ? category.name : 'Sin Categoría';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${categoryName}</td>
                <td><strong>${prod.name}</strong></td>
                <td>$${prod.price.toFixed(2)}</td>
                <td>
                    <span class="status-badge ${prod.active ? 'status-active' : 'status-inactive'}">
                        ${prod.active ? 'Activo' : 'Inactivo'}
                    </span>
                </td>
                <td class="actions">
                    <button class="btn-secondary" onclick="editProduct('${prod.id}')">Editar</button>
                    <button class="${prod.active ? 'btn-warning' : ''}" onclick="toggleProductStatus('${prod.id}')">
                        ${prod.active ? 'Desactivar' : 'Activar'}
                    </button>
                    <button class="btn-danger" onclick="deleteProduct('${prod.id}')">Eliminar</button>
                </td>
            `;
            productsList.appendChild(tr);
        });
    }

    function renderFinalPreview() {
        finalMenuPreview.innerHTML = '';

        if (menuData.categories.length === 0) {
            finalMenuPreview.innerHTML = '<p>No hay categorías creadas aún.</p>';
            return;
        }

        menuData.categories.forEach(cat => {
            const catContainer = document.createElement('div');
            catContainer.className = 'preview-category';

            const catTitle = document.createElement('h3');
            catTitle.textContent = cat.name + (!cat.active ? ' (Categoría Inactiva - Oculta para cliente)' : '');
            if (!cat.active) catTitle.style.color = '#888';
            catContainer.appendChild(catTitle);

            const prods = menuData.products.filter(p => p.categoryId === cat.id);

            if (prods.length === 0) {
                const emptyMsg = document.createElement('p');
                emptyMsg.style.fontStyle = 'italic';
                emptyMsg.style.color = '#777';
                emptyMsg.textContent = 'Sin productos registrados en esta categoría.';
                catContainer.appendChild(emptyMsg);
            } else {
                prods.forEach(p => {
                    const prodRow = document.createElement('div');
                    prodRow.className = 'preview-product';
                    if (!p.active || !cat.active) prodRow.style.opacity = '0.5';

                    prodRow.innerHTML = `
                        <span>${p.name} ${!p.active ? '<em>(Inactivo)</em>' : ''}</span>
                        <strong>$${p.price.toFixed(2)}</strong>
                    `;
                    catContainer.appendChild(prodRow);
                });
            }

            finalMenuPreview.appendChild(catContainer);
        });
    }
</script>

</body>
</html>

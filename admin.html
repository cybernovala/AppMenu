<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Gestión de Menú</title>
  <style>
    :root {
      --bg-dark: #09090c;
      --card-bg: #121218;
      --neon-orange: #ff5500;
      --neon-yellow: #ffea00;
      --grad-neon: linear-gradient(135deg, #ff5500, #ffea00);
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
      --border-color: rgba(255, 85, 0, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 15px;
    }

    .container { max-width: 800px; margin: 0 auto; }

    /* HEADER */
    .header-bar {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .local-title {
      font-size: 22px;
      color: var(--neon-yellow);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    /* PESTAÑAS / TABS */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .tab-btn {
      background: #181822;
      border: 1px solid #333;
      color: var(--text-muted);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-btn:hover { background: #222230; color: #fff; }
    .tab-btn.active {
      background: var(--grad-neon);
      color: #000;
      border-color: transparent;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* BOTONES */
    .btn {
      background: var(--grad-neon);
      border: none;
      color: #000;
      padding: 10px 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: #222; color: #fff; border: 1px solid #444; }
    .btn-danger { background: #ff3344; color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    /* TARJETAS DE SECCIÓN */
    .section-card {
      background: var(--card-bg);
      border: 1px solid #222;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .section-card h3 {
      font-size: 15px;
      color: var(--neon-orange);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .form-inline { display: flex; gap: 10px; }

    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      background: #181822;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
    }

    /* TARJETAS DE CATEGORÍA */
    .category-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .category-header {
      background: rgba(255, 85, 0, 0.08);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 85, 0, 0.2);
    }

    .category-name {
      font-size: 18px;
      font-weight: bold;
      color: var(--neon-yellow);
    }

    .product-list { padding: 15px; }

    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #16161e;
      border: 1px solid #262630;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .product-info { display: flex; flex-direction: column; gap: 3px; }
    .product-title { font-weight: 600; font-size: 15px; color: #fff; }
    .product-price { font-size: 14px; color: var(--neon-yellow); font-weight: bold; }
    .product-actions { display: flex; gap: 8px; }

    /* FORMULARIO AGREGAR PRODUCTO */
    .add-product-box {
      background: #14141c;
      border-top: 1px dashed #333;
      padding: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .add-product-box input { min-width: 140px; }

    /* MODAL DE EDICIÓN */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #16161e;
      border: 1px solid var(--neon-orange);
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
    }

    .modal-content h3 { color: var(--neon-yellow); margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- HEADER -->
    <div class="header-bar">
      <div>
        <span style="font-size: 12px; color: var(--text-muted);">Administrando Cliente:</span>
        <div class="local-title" id="lbl-local-nombre">CARGANDO...</div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="cargarProductos()">🔄 Recargar Menú</button>
    </div>

    <!-- NAVEGACIÓN PESTAÑAS -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="cambiarPestana('tab-menu', this)">🍕 Gestión de Menú</button>
      <button class="tab-btn" onclick="cambiarPestana('tab-info', this)">⚙️ Datos del Local</button>
      <button class="tab-btn" onclick="cambiarPestana('tab-horarios', this)">🕒 Horarios</button>
      <button class="tab-btn" onclick="cambiarPestana('tab-seguridad', this)">🔑 Seguridad</button>
    </div>

    <!-- ================= PESTAÑA 1: GESTIÓN DE MENÚ ================= -->
    <div id="tab-menu" class="tab-content active">
      <!-- CREAR CATEGORÍA -->
      <div class="section-card">
        <h3>📁 Crear Nueva Categoría</h3>
        <div class="form-inline">
          <input type="text" id="nueva-categoria" placeholder="Ej: Entradas, Bebidas, Promociones">
          <button class="btn" onclick="crearCategoria()">+ Agregar Categoría</button>
        </div>
      </div>

      <!-- LISTADO DE CATEGORÍAS Y PRODUCTOS -->
      <div id="contenedor-categorias">
        <p style="color: var(--text-muted); text-align: center;">Cargando menú de MongoDB...</p>
      </div>
    </div>

    <!-- ================= PESTAÑA 2: DATOS DEL LOCAL ================= -->
    <div id="tab-info" class="tab-content">
      <div class="section-card">
        <h3>🏪 Información Comercial</h3>
        <div class="form-group">
          <label>Nombre Comercial del Local</label>
          <input type="text" id="info-nombre" placeholder="Ej: Sanguchería Central">
        </div>
        <div class="form-group">
          <label>Teléfono / WhatsApp de Pedidos</label>
          <input type="text" id="info-telefono" placeholder="+56 9 1234 5678">
        </div>
        <div class="form-group">
          <label>Dirección Física</label>
          <input type="text" id="info-direccion" placeholder="Av. Principal #123">
        </div>
        <div class="form-group">
          <label>Descripción Corta / Slogan</label>
          <textarea id="info-descripcion" rows="3" placeholder="Los mejores completos de la ciudad..."></textarea>
        </div>
        <button class="btn" onclick="guardarInfoLocal()">💾 Guardar Cambios</button>
      </div>
    </div>

    <!-- ================= PESTAÑA 3: HORARIOS ================= -->
    <div id="tab-horarios" class="tab-content">
      <div class="section-card">
        <h3>🕒 Horarios de Atención</h3>
        <div class="form-group">
          <label>Lunes a Viernes</label>
          <input type="text" id="horario-semana" placeholder="12:00 hrs - 23:00 hrs">
        </div>
        <div class="form-group">
          <label>Sábados y Domingos</label>
          <input type="text" id="horario-finde" placeholder="13:00 hrs - 01:00 hrs">
        </div>
        <div class="form-group">
          <label>Estado Actual</label>
          <select id="horario-estado">
            <option value="abierto">🟢 Abierto Recibiendo Pedidos</option>
            <option value="cerrado">🔴 Cerrado Temporalmente</option>
          </select>
        </div>
        <button class="btn" onclick="guardarHorarios()">💾 Actualizar Horarios</button>
      </div>
    </div>

    <!-- ================= PESTAÑA 4: SEGURIDAD ================= -->
    <div id="tab-seguridad" class="tab-content">
      <div class="section-card">
        <h3>🔑 Cambiar Contraseña</h3>
        <div class="form-group">
          <label>Nueva Contraseña de Acceso</label>
          <input type="password" id="pass-nueva" placeholder="Ingresa la nueva clave">
        </div>
        <div class="form-group">
          <label>Confirmar Nueva Contraseña</label>
          <input type="password" id="pass-confirmar" placeholder="Repite la nueva clave">
        </div>
        <button class="btn" onclick="cambiarPassword()">🔒 Actualizar Contraseña</button>
      </div>
    </div>

  </div>

  <!-- MODAL DE EDICIÓN -->
  <div class="modal" id="modal-editar">
    <div class="modal-content">
      <h3>✏️ Editar Producto</h3>
      <input type="hidden" id="edit-cat-orig">
      <input type="hidden" id="edit-index-orig">
      
      <div class="form-group">
        <label>Nombre del Producto</label>
        <input type="text" id="edit-nombre">
      </div>

      <div class="form-group">
        <label>Precio ($)</label>
        <input type="number" id="edit-precio">
      </div>

      <div class="form-group">
        <label>Categoría</label>
        <input type="text" id="edit-categoria">
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn" style="flex:1;" onclick="guardarEdicion()">Guardar Cambios</button>
        <button class="btn btn-secondary" style="flex:1;" onclick="cerrarModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://appmenu-tavr.onrender.com/api";
    
    // Obtener parámetro ?local= de la URL (ej: "mongo")
    const params = new URLSearchParams(window.location.search);
    const localId = params.get('local') || 'mongo';

    let productosPlanos = [];
    let categoriasSet = new Set();

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('lbl-local-nombre').innerText = localId.toUpperCase();
      cargarProductos();
    });

    // --- CAMBIO DE PESTAÑAS ---
    function cambiarPestana(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(tb => tb.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // --- 1. GESTIÓN DE PRODUCTOS Y CATEGORÍAS ---
    async function cargarProductos() {
      const contenedor = document.getElementById('contenedor-categorias');
      contenedor.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Consultando MongoDB...</p>';

      try {
        const respuesta = await fetch(`${API_URL}/menu?local=${localId}`);
        productosPlanos = await respuesta.json();

        categoriasSet.clear();
        productosPlanos.forEach(p => {
          if (p.categoria) categoriasSet.add(p.categoria);
        });

        if (categoriasSet.size === 0) {
          categoriasSet.add("General");
        }

        renderizarCategorias();
      } catch (err) {
        contenedor.innerHTML = '<p style="color: #ff3344; text-align: center;">Error al conectar con la API.</p>';
      }
    }

    function renderizarCategorias() {
      const contenedor = document.getElementById('contenedor-categorias');
      contenedor.innerHTML = '';

      categoriasSet.forEach(catNombre => {
        const productosCat = productosPlanos.filter(p => p.categoria === catNombre);

        const catCard = document.createElement('div');
        catCard.className = 'category-card';

        catCard.innerHTML = `
          <div class="category-header">
            <span class="category-name">📂 ${catNombre}</span>
            <span style="font-size: 12px; color: var(--text-muted);">${productosCat.length} producto(s)</span>
          </div>

          <div class="product-list">
            ${productosCat.length === 0 ? '<p style="color: var(--text-muted); font-size: 13px;">No hay productos en esta categoría.</p>' : ''}
            ${productosCat.map((prod, idx) => `
                <div class="product-item">
                  <div class="product-info">
                    <span class="product-title">${prod.nombre}</span>
                    <span class="product-price">$${(prod.precio || 0).toLocaleString('es-CL')}</span>
                  </div>
                  <div class="product-actions">
                    <button class="btn btn-secondary btn-sm" onclick="abrirModalEdicion('${catNombre}', ${idx}, '${prod.nombre.replace(/'/g, "\\'")}', ${prod.precio})">✏️ Editar</button>
                    <button class="btn btn-danger btn-sm" onclick="eliminarProducto('${catNombre}', ${idx})">🗑️ Eliminar</button>
                  </div>
                </div>
            `).join('')}
          </div>

          <div class="add-product-box">
            <input type="text" id="nuevo-nombre-${catNombre}" placeholder="Nombre del producto" style="flex:2;">
            <input type="number" id="nuevo-precio-${catNombre}" placeholder="Precio ($)" style="flex:1;">
            <button class="btn btn-sm" onclick="agregarProducto('${catNombre}')">+ Guardar Producto</button>
          </div>
        `;

        contenedor.appendChild(catCard);
      });
    }

    function crearCategoria() {
      const inputCat = document.getElementById('nueva-categoria');
      const nombreCat = inputCat.value.trim();

      if (!nombreCat) return alert("Ingresa un nombre para la categoría.");

      categoriasSet.add(nombreCat);
      inputCat.value = '';
      renderizarCategorias();
    }

    async function agregarProducto(categoria) {
      const inputNombre = document.getElementById(`nuevo-nombre-${categoria}`);
      const inputPrecio = document.getElementById(`nuevo-precio-${categoria}`);

      const nombre = inputNombre.value.trim();
      const precio = parseFloat(inputPrecio.value);

      if (!nombre || isNaN(precio)) return alert("Ingresa un nombre y un precio válido.");

      try {
        const res = await fetch(`${API_URL}/menu`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ local: localId, categoria, nombre, precio })
        });

        if (res.ok) {
          inputNombre.value = '';
          inputPrecio.value = '';
          cargarProductos();
        } else alert("Error al guardar en MongoDB.");
      } catch (err) { alert("Error de conexión."); }
    }

    async function eliminarProducto(categoria, index) {
      if (!confirm("¿Deseas eliminar este producto del menú?")) return;

      try {
        const res = await fetch(`${API_URL}/menu/del?local=${localId}&categoria=${encodeURIComponent(categoria)}&index=${index}`, {
          method: 'DELETE'
        });

        if (res.ok) cargarProductos();
        else alert("Error al eliminar el producto.");
      } catch (err) { alert("Error de conexión."); }
    }

    // --- MODAL EDICIÓN ---
    function abrirModalEdicion(catOrig, indexOrig, nombre, precio) {
      document.getElementById('edit-cat-orig').value = catOrig;
      document.getElementById('edit-index-orig').value = indexOrig;
      document.getElementById('edit-nombre').value = nombre;
      document.getElementById('edit-precio').value = precio;
      document.getElementById('edit-categoria').value = catOrig;
      document.getElementById('modal-editar').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('modal-editar').style.display = 'none';
    }

    async function guardarEdicion() {
      const catOrig = document.getElementById('edit-cat-orig').value;
      const indexOrig = document.getElementById('edit-index-orig').value;
      const nuevoNombre = document.getElementById('edit-nombre').value.trim();
      const nuevoPrecio = parseFloat(document.getElementById('edit-precio').value);
      const nuevaCategoria = document.getElementById('edit-categoria').value.trim();

      if (!nuevoNombre || isNaN(nuevoPrecio) || !nuevaCategoria) return alert("Completa todos los campos.");

      try {
        const res = await fetch(`${API_URL}/menu/edit`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            local: localId,
            categoriaOriginal: catOrig,
            indexOriginal: Number(indexOrig),
            nuevoNombre: nuevoNombre,
            nuevoPrecio: nuevoPrecio,
            nuevaCategoria: nuevaCategoria
          })
        });

        if (res.ok) {
          cerrarModal();
          cargarProductos();
        } else alert("Error al actualizar producto.");
      } catch (err) { alert("Error de conexión."); }
    }

    // --- ACCIONES SECUNDARIAS (PESTAÑAS EXTRA) ---
    function guardarInfoLocal() {
      alert("✅ Datos del local actualizados exitosamente.");
    }

    function guardarHorarios() {
      alert("✅ Horarios guardados con éxito.");
    }

    function cambiarPassword() {
      const p1 = document.getElementById('pass-nueva').value;
      const p2 = document.getElementById('pass-confirmar').value;

      if (!p1 || p1 !== p2) return alert("Las contraseñas no coinciden o están vacías.");
      
      alert("✅ Contraseña actualizada correctamente.");
      document.getElementById('pass-nueva').value = '';
      document.getElementById('pass-confirmar').value = '';
    }
  </script>

</body>
</html>

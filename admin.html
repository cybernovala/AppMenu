<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Panel de Control - Administración</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: rgba(18, 18, 22, 0.95);
      --neon-orange: #ff5500;
      --neon-yellow: #ffea00;
      --grad-neon: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    body, html {
      height: 100%;
      width: 100%;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
    }

    .admin-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    header {
      background: #000;
      border-bottom: 1px solid rgba(255, 85, 0, 0.3);
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: bold;
      background: var(--grad-neon);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .tabs-bar {
      display: flex;
      background: #101015;
      border-bottom: 1px solid #222;
      overflow-x: auto;
      flex-shrink: 0;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 1;
      min-width: 120px;
      padding: 12px 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--neon-yellow);
      border-bottom-color: var(--neon-orange);
      background: rgba(255, 85, 0, 0.05);
    }

    .content-area {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      position: absolute;
      top: 0;
      left: 0;
    }

    iframe.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="admin-layout">
    <header>
      <div class="brand-title" id="admin-local-name">PANEL DE CONTROL</div>
    </header>

    <nav class="tabs-bar">
      <button class="tab-btn active" onclick="cambiarPestana('productos', this)">📦 Productos</button>
      <button class="tab-btn" onclick="cambiarPestana('historial', this)">📜 Historial</button>
      <button class="tab-btn" onclick="cambiarPestana('cocina', this)">👨‍🍳 Cocina</button>
      <button class="tab-btn" onclick="cambiarPestana('garzon', this)">🍷 Garzón</button>
    </nav>

    <main class="content-area">
      <iframe id="frame-productos" class="active"></iframe>
      <iframe id="frame-historial"></iframe>
      <iframe id="frame-cocina"></iframe>
      <iframe id="frame-garzon"></iframe>
    </main>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const localActual = urlParams.get('local') || 'default';
    const BASE_URL = window.location.origin;

    document.getElementById('admin-local-name').innerText = `ADMINISTRACIÓN: ${localActual.replace('-', ' ').toUpperCase()}`;

    // Cargar las vistas en los iframes apuntando a superadmin.html para Productos e Historial
    document.getElementById('frame-productos').src = `${BASE_URL}/superadmin.html?local=${localActual}&view=productos`;
    document.getElementById('frame-historial').src = `${BASE_URL}/superadmin.html?local=${localActual}&view=historial`;
    document.getElementById('frame-cocina').src = `${BASE_URL}/cocina.html?local=${localActual}`;
    document.getElementById('frame-garzon').src = `${BASE_URL}/garzon.html?local=${localActual}`;

    function cambiarPestana(nombreFrame, btnElement) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));

      btnElement.classList.add('active');
      document.getElementById(`frame-${nombreFrame}`).classList.add('active');
    }
  </script>
</body>
</html>

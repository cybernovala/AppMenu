<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrador - Menú Digital</title>
  <style>
    :root {
      --bg-dark: #0f111a;
      --bg-card: #181b29;
      --neon-green: #00ff88;
      --neon-yellow: #ffb703;
      --neon-red: #ff3344;
      --text-main: #f0f3f8;
      --text-muted: #8c9ba5;
      --border-color: #2a2f45;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }

    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
    h1 { font-size: 24px; color: var(--neon-green); }

    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .tab-btn.active { background: var(--neon-green); color: #000; border-color: var(--neon-green); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Estilos para Gestión de Menú */
    .grid-categorias { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .category-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; }
    .category-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
    .category-name { font-size: 18px; font-weight: bold; color: var(--neon-green); }

    .product-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 6px; margin-bottom: 8px; }
    .add-product-box { display: flex; gap: 8px; margin-top: 15px; }
    
    input, select { background: #0c0e17; border: 1px solid var(--border-color); color: #fff; padding: 8px 12px; border-radius: 6px; outline: none; }
    input:focus { border-color: var(--neon-green); }

    .btn { background: var(--neon-green); border: none; color: #000; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-danger { background: var(--neon-red); color: #fff; }
    .btn-sm { padding: 4px 8px; font-size: 12px; }

    /* Estilos para Pantalla de Cocina */
    .grid-pedidos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .pedido-card { background: var(--bg-card); border: 2px solid var(--neon-yellow); border-radius: 12px; padding: 15px; }
    .pedido-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
    .pedido-items { list-style: none; margin-bottom: 15px; }
    .pedido-items li { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed rgba(255,255,255,0.1); }
  </style>
</head>
<body>

  <header>
    <h1>⚙️ Administración de Menú y Cocina</h1>
    <div>
      <label>Local ID: </label>
      <input type="text" id="input-local" value="mongo" style="width: 100px;">
      <button class="btn btn-sm" onclick="cambiarLocal()">Cargar</button>
    </div>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="mostrarPestana('pestana-menu')">📋 Gestión de Menú</button>
    <button class="tab-btn" onclick="mostrarPestana('pestana-cocina')">🍳 Pantalla de Cocina</button>
  </div>

  <!-- PESTAÑA 1: GESTIÓN DE MENÚ -->
  <div id="pestana-menu" class="tab-content active">
    <div style="margin-bottom: 15px; display: flex; gap: 10px;">
      <input type="text" id="nueva-categoria-nombre" placeholder="Nombre de nueva categoría">
      <button class="btn" onclick="crearCategoria()">+ Nueva Categoría</button>
    </div>

    <div id="contenedor-categorias" class="grid-categorias">
      <!-- Se carga dinámicamente -->
    </div>
  </div>

  <!-- PESTAÑA 2: PANTALLA DE COCINA -->
  <div id="pestana-cocina" class="tab-content">
    <div id="contenedor-pedidos" class="grid-pedidos">
      <!-- Se carga dinámicamente -->
    </div>
  </div>

  <script>
    // Configuración base de la API
    const API_URL = 'http://localhost:10000/api';
    let urlParams = new URLSearchParams(window.location.search);
    let localId = (urlParams.get('local') || 'mongo').toLowerCase().trim();

    document.getElementById('input-local').value = localId;

    let productosPlanos = [];
    let categoriasSet = new Set();

    function cambiarLocal() {
      const nuevoLocal = document.getElementById('input-local').value.trim().toLowerCase();
      if (nuevoLocal) {
        window.location.search = `?local=${encodeURIComponent(nuevoLocal)}`;
      }
    }

    function mostrarPestana(idPestana) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(idPestana).classList.add('active');
      event.target.classList.add('active');

      if (idPestana === 'pestana-menu') cargarProductos();
      if (idPestana === 'pestana-cocina') cargarPedidos();
    }

    // --- GESTIÓN DE MENÚ ---
    async function cargarProductos() {
      const contenedor = document.getElementById('contenedor-categorias');
      contenedor.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1;">Cargando datos desde MongoDB...</p>';

      try {
        const respuesta = await fetch(`${API_URL}/menu?local=${encodeURIComponent(localId)}`);
        productosPlanos = await respuesta.json();

        if (!Array.isArray(productosPlanos)) {
          productosPlanos = [];
        }

        categoriasSet.clear();
        productosPlanos.forEach(p => { 
          if (p.categoria) categoriasSet.add(p.categoria); 
        });

        if (categoriasSet.size === 0) {
          categoriasSet.add("General");
        }

        renderizarCategorias();
      } catch (err) {
        console.error("Error al cargar productos:", err);
        contenedor.innerHTML = '<p style="color: var(--neon-red); text-align: center; grid-column: 1/-1;">❌ Error al conectar con el servidor.</p>';
      }
    }

    function renderizarCategorias() {
      const contenedor = document.getElementById('contenedor-categorias');
      contenedor.innerHTML = '';

      categoriasSet.forEach(catNombre => {
        const productosCat = productosPlanos.filter(p => p.categoria === catNombre);
        const catCard = document.createElement('div');
        catCard.className = 'category-card';

        catCard.innerHTML = `
          <div class="category-header">
            <span class="category-name">📂 ${catNombre}</span>
            <span style="font-size: 12px; color: var(--text-muted);">${productosCat.length} prod.</span>
          </div>
          <div class="product-list">
            ${productosCat.length === 0 
              ? '<p style="font-size:12px; color:#666; padding:10px;">Sin productos registrados.</p>' 
              : productosCat.map(prod => `
                <div class="product-item">
                  <div>
                    <strong>${prod.nombre}</strong><br>
                    <span style="color:var(--neon-yellow);">$${Number(prod.precio || 0).toLocaleString('es-CL')}</span>
                  </div>
                  <button class="btn btn-danger btn-sm" onclick="eliminarProducto('${prod._id}')">🗑️</button>
                </div>
            `).join('')}
          </div>
          <div class="add-product-box">
            <input type="text" id="nuevo-nombre-${catNombre}" placeholder="Producto" style="flex:2;">
            <input type="number" id="nuevo-precio-${catNombre}" placeholder="Precio" style="flex:1;">
            <button class="btn btn-sm" onclick="agregarProducto('${catNombre}')">+</button>
          </div>
        `;
        contenedor.appendChild(catCard);
      });
    }

    function crearCategoria() {
      const inputCat = document.getElementById('nueva-categoria-nombre');
      const nombreCat = inputCat.value.trim();
      if (!nombreCat) return alert("Ingresa un nombre para la categoría");

      categoriasSet.add(nombreCat);
      inputCat.value = '';
      renderizarCategorias();
    }

    async function agregarProducto(categoria) {
      const inputNombre = document.getElementById(`nuevo-nombre-${categoria}`);
      const inputPrecio = document.getElementById(`nuevo-precio-${categoria}`);

      const nombre = inputNombre.value.trim();
      const precio = parseFloat(inputPrecio.value);

      if (!nombre || isNaN(precio)) {
        return alert("Por favor ingresa un nombre y precio válidos.");
      }

      try {
        const res = await fetch(`${API_URL}/menu`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ local: localId, categoria, nombre, precio })
        });

        if (res.ok) {
          cargarProductos();
        } else {
          alert("Error al guardar en el servidor.");
        }
      } catch (e) {
        alert("Error de red al guardar producto.");
      }
    }

    async function eliminarProducto(idMongo) {
      if (!idMongo) return;
      if (!confirm("¿Seguro que deseas eliminar este producto?")) return;

      try {
        await fetch(`${API_URL}/menu/${idMongo}`, { method: 'DELETE' });
        cargarProductos();
      } catch (e) {
        alert("Error al eliminar producto.");
      }
    }

    // --- COCINA ---
    async function cargarPedidos() {
      const contenedor = document.getElementById('contenedor-pedidos');

      try {
        const res = await fetch(`${API_URL}/pedidos?local=${encodeURIComponent(localId)}`);
        const pedidos = await res.json();

        if (!Array.isArray(pedidos) || pedidos.length === 0) {
          contenedor.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1;">Sin pedidos pendientes.</p>';
          return;
        }

        contenedor.innerHTML = pedidos.map(p => `
          <div class="pedido-card">
            <div class="pedido-header">
              <span>Mesa #${p.mesa}</span>
              <span style="color: var(--neon-yellow);">${p.hora}</span>
            </div>
            <ul class="pedido-items">
              ${p.items.map(i => `
                <li>
                  <span>${i.cant}x ${i.nombre}</span>
                  <span>$${(i.precio * i.cant).toLocaleString('es-CL')}</span>
                </li>
              `).join('')}
            </ul>
            <div style="display:flex; justify-between; align-items:center; margin-bottom:10px;">
              <strong>Total:</strong>
              <strong style="color: var(--neon-green); font-size: 18px;">$${Number(p.total).toLocaleString('es-CL')}</strong>
            </div>
            <button class="btn btn-danger" style="width:100%;" onclick="despacharPedido('${p._id}')">✔ Marcar Completado</button>
          </div>
        `).join('');

      } catch (e) {
        contenedor.innerHTML = '<p style="color: var(--neon-red); grid-column: 1/-1;">Error al consultar pedidos.</p>';
      }
    }

    async function despacharPedido(id) {
      try {
        await fetch(`${API_URL}/pedidos/${id}`, { method: 'DELETE' });
        cargarPedidos();
      } catch (e) {
        alert("Error al despachar el pedido.");
      }
    }

    // Inicialización
    cargarProductos();
    setInterval(() => {
      // Recarga la cocina automáticamente si la pestaña activa es la de cocina
      if (document.getElementById('pestana-cocina').classList.contains('active')) {
        cargarPedidos();
      }
    }, 5000);
  </script>
</body>
</html>

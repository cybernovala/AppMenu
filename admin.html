<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Administración del Menú</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; padding: 20px; max-width: 800px; margin: 0 auto; }
    h1, h2 { color: #ffe600; }
    .card { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    input, select { padding: 8px; margin: 5px 0; border-radius: 4px; border: none; width: 95%; }
    button { background: #ffe600; color: #000; border: none; padding: 10px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 5px; }
    .btn-danger { background: #f44336; color: white; }
    .item-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding: 8px 0; }
  </style>
</head>
<body>

  <h1>Panel Administrador del Menú</h1>

  <div class="card">
    <h3>Seguridad</h3>
    <input type="password" id="password" placeholder="Ingresa la contraseña de administrador (Ej: admin123)">
  </div>

  <div class="card">
    <h3>Agregar Producto Nuevo</h3>
    <input type="text" id="cat-nueva" placeholder="Categoría (Ej: Bebidas, Churrascos)">
    <input type="text" id="prod-nombre" placeholder="Nombre del producto">
    <input type="number" id="prod-precio" placeholder="Precio ($)">
    <button onclick="agregarProducto()">Añadir al Menú</button>
  </div>

  <h2>Menú Actual</h2>
  <div id="lista-menu">Cargando productos...</div>

  <button onclick="guardarEnServidor()" style="font-size: 18px; width: 100%; padding: 15px; background: #4CAF50; color: white;">💾 Guardar Todos los Cambios</button>

  <script>
    const API_URL = "https://appmenu-tavr.onrender.com/api";
    let menuData = [];

    async function cargarMenu() {
      const res = await fetch(`${API_URL}/menu`);
      menuData = await res.json();
      renderAdmin();
    }

    function renderAdmin() {
      const container = document.getElementById('lista-menu');
      container.innerHTML = '';

      menuData.forEach((cat, cIndex) => {
        let itemsHtml = '';
        cat.productos.forEach((p, pIndex) => {
          itemsHtml += `
            <div class="item-row">
              <div>
                <strong>${p.nombre}</strong> - $${p.precio}
              </div>
              <button class="btn-danger" onclick="eliminarProducto(${cIndex}, ${pIndex})">Eliminar</button>
            </div>
          `;
        });

        container.innerHTML += `
          <div class="card">
            <h2>${cat.categoria}</h2>
            ${itemsHtml}
          </div>
        `;
      });
    }

    function agregarProducto() {
      const catNombre = document.getElementById('cat-nueva').value.trim();
      const prodNombre = document.getElementById('prod-nombre').value.trim();
      const prodPrecio = document.getElementById('prod-precio').value;

      if (!catNombre || !prodNombre || !prodPrecio) {
        return alert("Completa todos los campos");
      }

      let categoria = menuData.find(c => c.categoria.toLowerCase() === catNombre.toLowerCase());

      if (!categoria) {
        categoria = { categoria: catNombre, productos: [] };
        menuData.push(categoria);
      }

      categoria.productos.push({
        id: Date.now().toString(),
        nombre: prodNombre,
        precio: Number(prodPrecio)
      });

      document.getElementById('prod-nombre').value = '';
      document.getElementById('prod-precio').value = '';

      renderAdmin();
    }

    function eliminarProducto(cIndex, pIndex) {
      menuData[cIndex].productos.splice(pIndex, 1);
      if (menuData[cIndex].productos.length === 0) {
        menuData.splice(cIndex, 1);
      }
      renderAdmin();
    }

    async function guardarEnServidor() {
      const password = document.getElementById('password').value;
      if (!password) return alert("Ingresa la contraseña para guardar.");

      const res = await fetch(`${API_URL}/menu`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, menu: menuData })
      });

      const data = await res.json();
      if (res.ok) {
        alert("¡Menú guardado y actualizado para todos los clientes!");
      } else {
        alert("Error: " + data.error);
      }
    }

    cargarMenu();
  </script>
</body>
</html>

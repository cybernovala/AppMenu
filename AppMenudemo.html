<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alta Demo - Registro de Local</title>
  <style>
    :root {
      --bg-dark: #08070d;
      --card-bg: rgba(18, 16, 28, 0.95);
      --neon-orange: #ff5500;
      --neon-pink: #ff007f;
      --neon-yellow: #ffee00;
      --neon-green: #00ff66;
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--neon-orange);
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 0 20px rgba(255, 85, 0, 0.2);
    }
    h2 { color: var(--neon-yellow); margin-bottom: 20px; text-align: center; font-size: 20px; }
    label { display: block; font-size: 13px; color: var(--text-muted); margin-top: 12px; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 12px;
      background: #181822;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-pink));
      border: none;
      color: #fff;
      padding: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
      font-size: 15px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 15px; text-align: center; font-size: 14px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>🚀 Alta de Local Demo</h2>
    <form id="form-alta" onsubmit="registrarLocal(event)">
      <label>Nombre del Local</label>
      <input type="text" id="nombre" required placeholder="Ej: Restaurant El Sol">

      <label>RUT</label>
      <input type="text" id="rut" required placeholder="Ej: 76.123.456-7">

      <label>Correo para recuperar contraseña</label>
      <input type="email" id="correo" required placeholder="correo@ejemplo.com">

      <label>Contraseña para Menú / Historial</label>
      <input type="password" id="password" required placeholder="••••••••">

      <button type="submit" class="btn" id="btn-submit"> Registrar Local Demo</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    const BACKEND_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://appmenu-tavr.onrender.com';

    async function registrarLocal(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const msg = document.getElementById('msg');
      
      const nombre = document.getElementById('nombre').value.trim();
      const rut = document.getElementById('rut').value.trim();
      const correo = document.getElementById('correo').value.trim();
      const password = document.getElementById('password').value.trim();

      btn.disabled = true;
      btn.innerText = "Registrando y enviando contraseña...";
      msg.innerHTML = '';

      try {
        const res = await fetch(`${BACKEND_URL}/api/alta-demo`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, rut, correo, password })
        });

        const data = await res.json();

        if (res.ok) {
          msg.style.color = '#00ff66';
          msg.innerHTML = `✅ ¡Local creado con éxito!<br>ID asignado: <b>${data.id}</b><br>Redirigiendo...`;
          setTimeout(() => {
            window.location.href = `https://cybernovala.github.io/AppMenu/admin.html?local=${data.local}`;
          }, 2500);
        } else {
          msg.style.color = '#ff3344';
          msg.innerHTML = `⚠️ ${data.error || 'Error al registrar local'}`;
          btn.disabled = false;
          btn.innerText = "Registrar Local Demo";
        }
      } catch (err) {
        msg.style.color = '#ff3344';
        msg.innerHTML = "⚠️ Error de conexión con el servidor.";
        btn.disabled = false;
        btn.innerText = "Registrar Local Demo";
      }
    }
  </script>
</body>
</html>

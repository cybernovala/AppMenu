<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Menú Digital</title>
  <style>
    :root {
      --bg-dark: #08070d;
      --neon-orange: #ff5500;
      --neon-pink: #ff007f;
      --neon-yellow: #ffee00;
      --card-bg: rgba(18, 16, 28, 0.85);
      --border-neon: rgba(255, 0, 127, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }

    /* FONDO DE PLANO CARTESIANO EN PERSPECTIVA NEON */
    body {
      background-color: var(--bg-dark);
      color: #fff;
      min-height: 100vh;
      padding-bottom: 90px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: -50%; width: 200%; height: 200%;
      background-image: 
        linear-gradient(rgba(255, 85, 0, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 0, 127, 0.15) 1px, transparent 1px);
      background-size: 40px 40px;
      transform: perspective(500px) rotateX(60deg) translateY(-100px);
      z-index: -1;
      pointer-events: none;
    }

    /* ENCABEZADO */
    .header {
      background: rgba(8, 7, 13, 0.95);
      border-bottom: 2px solid var(--neon-pink);
      padding: 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .mesa-badge {
      display: inline-block;
      margin-top: 5px;
      background: var(--neon-pink);
      color: #fff;
      font-size: 12px;
      padding: 3px 12px;
      border-radius: 12px;
      font-weight: bold;
    }

    /* BARRA DE CATEGORÍAS */
    .categories-bar {
      display: flex;
      gap: 10px;
      padding: 12px 15px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar { display: none; }

    .cat-chip {
      background: var(--card-bg);
      border: 1px solid var(--border-neon);
      color: #ccc;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .cat-chip.active {
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-pink));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 0 10px rgba(255, 85, 0, 0.5);
    }

    /* TARJETAS DE PRODUCTOS */
    .container { padding: 15px; }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-neon);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .product-name { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 4px; }
    .product-price { font-size: 15px; color: var(--neon-yellow); font-weight: 800; }

    .btn-add {
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-pink));
      border: none;
      color: #fff;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    /* BARRA FLOTANTE DEL CARRITO */
    .cart-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(12, 10, 20, 0.95);
      border-top: 2px solid var(--neon-orange);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      z-index: 200;
    }

    .cart-btn {
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-pink));
      border: none;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    /* MODAL DE ORDEN */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 300;
      justify-content: center;
      align-items: flex-end;
    }

    .modal-content {
      background: #12101c;
      border-top: 2px solid var(--neon-pink);
      border-radius: 20px 20px 0 0;
      padding: 20px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #222;
    }

    .qty-controls { display: flex; gap: 10px; align-items: center; }
    .btn-qty { background: #222; border: 1px solid #444; color: #fff; width: 28px; height: 28px; border-radius: 50%; }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <div class="header">
    <div class="brand-title" id="txt-local">MENÚ DIGITAL</div>
    <div class="mesa-badge" id="txt-mesa">Mesa N° --</div>
  </div>

  <!-- NAVEGACIÓN CATEGORÍAS -->
  <div class="categories-bar" id="barra-categorias"></div>

  <!-- LISTA DE PRODUCTOS -->
  <div class="container" id="lista-productos">
    <p style="text-align: center; color: #888;">Cargando carta...</p>
  </div>

  <!-- BARRA CARRITO FLOTANTE -->
  <div class="cart-bar" id="cart-bar">
    <div>
      <span style="font-size: 12px; color: #aaa;">Total Pedido:</span><br>
      <span style="font-size: 18px; font-weight: bold; color: var(--neon-yellow);" id="txt-total-bar">$0</span>
    </div>
    <button class="cart-btn" onclick="abrirModalCarrito()">🛒 Ver Pedido (<span id="txt-count-bar">0</span>)</button>
  </div>

  <!-- MODAL DE CONFIRMACIÓN -->
  <div class="modal" id="modal-cart">
    <div class="modal-content">
      <h3 style="color: var(--neon-pink); margin-bottom: 15px;">📋 Revisa tu Orden</h3>
      <div id="items-carrito"></div>

      <div style="margin-top: 20px; text-align: right; font-size: 18px; font-weight: bold; color: var(--neon-yellow);" id="txt-modal-total">
        Total: $0
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="cart-btn" style="flex:1;" onclick="enviarPedidoCocina()">🚀 Enviar a Cocina</button>
        <button class="cart-btn" style="background:#222; color:#fff; flex:1;" onclick="cerrarModalCarrito()">Añadir Más</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://appmenu-tavr.onrender.com/api";
    const params = new URLSearchParams(window.location.search);
    const localId = params.get('local') || 'mongo';
    const numeroMesa = params.get('mesa') || '1';

    let productosRaw = [];
    let carrito = [];
    let catSeleccionada = 'TODOS';

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('txt-local').innerText = localId.toUpperCase();
      document.getElementById('txt-mesa').innerText = `MESA N° ${numeroMesa}`;
      cargarMenu();
    });

    async function cargarMenu() {
      try {
        const res = await fetch(`${API_URL}/menu?local=${localId}`);
        productosRaw = await res.json();
        renderCategorias();
        renderProductos();
      } catch (e) {
        document.getElementById('lista-productos').innerHTML = '<p style="text-align:center;">Error al cargar el menú.</p>';
      }
    }

    function renderCategorias() {
      const bar = document.getElementById('barra-categorias');
      const cats = ['TODOS', ...new Set(productosRaw.map(p => p.categoria))];

      bar.innerHTML = cats.map(c => `
        <div class="cat-chip ${c === catSeleccionada ? 'active' : ''}" onclick="filtrarCat('${c}')">${c}</div>
      `).join('');
    }

    function filtrarCat(cat) {
      catSeleccionada = cat;
      renderCategorias();
      renderProductos();
    }

    function renderProductos() {
      const cont = document.getElementById('lista-productos');
      const filtrados = catSeleccionada === 'TODOS' ? productosRaw : productosRaw.filter(p => p.categoria === catSeleccionada);

      cont.innerHTML = filtrados.map(p => `
        <div class="product-card">
          <div>
            <div class="product-name">${p.nombre}</div>
            <div class="product-price">$${(p.precio || 0).toLocaleString('es-CL')}</div>
          </div>
          <button class="btn-add" onclick="agregarAlCarrito('${p.nombre}', ${p.precio})">+ Agregar</button>
        </div>
      `).join('');
    }

    function agregarAlCarrito(nombre, precio) {
      const idx = carrito.findIndex(i => i.nombre === nombre);
      if (idx > -1) {
        carrito[idx].cantidad++;
      } else {
        carrito.push({ nombre, precio, cantidad: 1 });
      }
      actualizarBarraCarrito();
    }

    function cambiarCantidad(nombre, cambio) {
      const idx = carrito.findIndex(i => i.nombre === nombre);
      if (idx > -1) {
        carrito[idx].cantidad += cambio;
        if (carrito[idx].cantidad <= 0) carrito.splice(idx, 1);
      }
      actualizarBarraCarrito();
      renderModalCarrito();
    }

    function actualizarBarraCarrito() {
      const total = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
      const count = carrito.reduce((sum, item) => sum + item.cantidad, 0);

      document.getElementById('txt-total-bar').innerText = `$${total.toLocaleString('es-CL')}`;
      document.getElementById('txt-count-bar').innerText = count;
    }

    function abrirModalCarrito() {
      if (carrito.length === 0) return alert("El carrito está vacío.");
      renderModalCarrito();
      document.getElementById('modal-cart').style.display = 'flex';
    }

    function cerrarModalCarrito() {
      document.getElementById('modal-cart').style.display = 'none';
    }

    function renderModalCarrito() {
      const cont = document.getElementById('items-carrito');
      const total = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

      cont.innerHTML = carrito.map(i => `
        <div class="cart-item">
          <div>
            <b>${i.nombre}</b><br>
            <span style="color:var(--neon-yellow); font-size:13px;">$${(i.precio * i.cantidad).toLocaleString('es-CL')}</span>
          </div>
          <div class="qty-controls">
            <button class="btn-qty" onclick="cambiarCantidad('${i.nombre}', -1)">-</button>
            <span>${i.cantidad}</span>
            <button class="btn-qty" onclick="cambiarCantidad('${i.nombre}', 1)">+</button>
          </div>
        </div>
      `).join('');

      document.getElementById('txt-modal-total').innerText = `Total: $${total.toLocaleString('es-CL')}`;
    }

    async function enviarPedidoCocina() {
      if (carrito.length === 0) return;

      const total = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

      try {
        await fetch(`${API_URL}/pedidos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            local: localId,
            mesa: numeroMesa,
            items: carrito,
            total: total
          })
        });

        alert("✅ ¡Tu pedido ha sido enviado a la cocina!");
        carrito = [];
        actualizarBarraCarrito();
        cerrarModalCarrito();
      } catch (e) {
        alert("Error al enviar pedido.");
      }
    }
  </script>
</body>
</html>

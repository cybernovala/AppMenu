<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lanzador AppMenu Demo - 30 Días de Licencia</title>
  <style>
    body {
      background-color: #08070d;
      color: #ffffff;
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(18, 16, 28, 0.95);
      border: 2px solid #ff5500;
      border-radius: 16px;
      padding: 30px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 85, 0, 0.3);
    }
    h1 {
      color: #ffee00;
      font-size: 22px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    p {
      color: #a0a0b0;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    input {
      width: 100%;
      padding: 14px;
      background: #181822;
      border: 1px solid #333;
      color: #fff;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #ff5500, #ff007f);
      color: #fff;
      border: none;
      padding: 14px;
      font-weight: bold;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .contacto-box {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px dashed rgba(255, 255, 255, 0.2);
      font-size: 13px;
      color: #00ff66;
      text-align: left;
    }
    .contacto-box b { color: #ffee00; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 AppMenu Demo (30 Días)</h1>
    <p>Ingresa el nombre de tu local o restaurante para ingresar o generar tu acceso permanente durante los 30 días de demo o pago de licencia mensual.</p>
    
    <input type="text" id="nombreLocal" placeholder="Ej: Mi Restaurante Demo">
    <button class="btn" onclick="iniciarOAbrirLocal()">⚡ Acceder / Abrir Mi Local</button>
    <button class="btn" style="background: #00d2ff; color:#000;" onclick="descargarAccesoDirectoLocal()">📥 Descargar Lanzador Exclusivo de Mi Local (.html)</button>

    <div class="contacto-box">
      <p style="margin-bottom: 5px;">📲 <b>Soporte & Licencias Mensuales:</b></p>
      <p style="margin-bottom: 3px;">💬 WhatsApp: <b>+56966648585</b></p>
      <p style="margin-bottom: 0;">✉️ Correo: <b>appmenunova@gmail.com</b></p>
    </div>
  </div>

  <script>
    const SERVER_URL = "https://appmenu-tavr.onrender.com";

    function obtenerSlug(nombre) {
      return nombre.toLowerCase().trim().replace(/[^a-z0-9]/g, '_').replace(/_+/g, '_');
    }

    function iniciarOAbrirLocal() {
      const nombre = document.getElementById('nombreLocal').value.trim();
      if (!nombre) return alert("Por favor ingresa el nombre de tu local.");
      const slug = obtenerSlug(nombre);
      window.location.href = `${SERVER_URL}/admin.html?local=${encodeURIComponent(slug)}`;
    }

    function descargarAccesoDirectoLocal() {
      const nombre = document.getElementById('nombreLocal').value.trim();
      if (!nombre) return alert("Por favor ingresa el nombre de tu local para generar la descarga.");
      const slug = obtenerSlug(nombre);

      const htmlAccesoLocal = `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acceso Directo - ${nombre}</title>
  <script>
    window.location.href = "${SERVER_URL}/admin.html?local=${encodeURIComponent(slug)}";
  <\/script>
</head>
<body style="background:#08070d; color:#fff; font-family:sans-serif; text-align:center; padding-top:50px;">
  <h2>Cargando ${nombre}...</h2>
  <p>Si no te redirige automáticamente, <a href="${SERVER_URL}/admin.html?local=${encodeURIComponent(slug)}" style="color:#00ff66;">haz clic aquí</a>.</p>
</body>
</html>`;

      const blob = new Blob([htmlAccesoLocal], { type: 'text/html' });
      const a = document.createElement('a');
      a.download = `Acceso_${slug}.html`;
      a.href = URL.createObjectURL(blob);
      a.click();
    }
  <\/script>
</body>
</html>

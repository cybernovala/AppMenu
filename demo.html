<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador Demo 30 Días - AppMenu</title>
  <style>
    :root {
      --bg-dark: #08070d;
      --card-bg: rgba(18, 16, 28, 0.85);
      --neon-orange: #ff5500;
      --neon-pink: #ff007f;
      --neon-yellow: #ffee00;
      --neon-green: #00ff66;
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .demo-card {
      background: var(--card-bg);
      border: 1px solid var(--neon-pink);
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.2);
    }

    h2 {
      color: var(--neon-yellow);
      text-transform: uppercase;
      font-size: 20px;
      margin-bottom: 10px;
      text-align: center;
    }

    p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; text-align: center; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }

    input {
      width: 100%;
      padding: 12px;
      background: #181822;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-pink));
      border: none;
      color: #fff;
      padding: 12px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
    }

    .btn-toggle {
      background: linear-gradient(135deg, #ff0033, #990000);
      margin-top: 10px;
    }

    .btn-toggle.activo {
      background: linear-gradient(135deg, var(--neon-green), #009933);
      color: #000;
    }

    .resultado-box {
      margin-top: 20px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px dashed var(--neon-orange);
      padding: 15px;
      border-radius: 8px;
      display: none;
    }

    .resultado-link {
      color: var(--neon-yellow);
      word-break: break-all;
      font-size: 13px;
      margin-bottom: 10px;
      display: block;
    }

    .contacto-info {
      margin-top: 20px;
      font-size: 12px;
      text-align: center;
      border-top: 1px solid #222;
      padding-top: 15px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="demo-card">
    <h2>🚀 Generador Demo 30 Días</h2>
    <p>Crea un enlace interactivo directo con 30 días de prueba gratuita.</p>

    <div class="form-group">
      <label>Nombre del Local / Comercio</label>
      <input type="text" id="demo-nombre" placeholder="Ej: Restaurant Central">
    </div>

    <button class="btn" onclick="generarEnlaceDemo()">✨ Generar Acceso Demo</button>

    <div class="resultado-box" id="resultado-box">
      <span style="font-size: 12px; color: var(--text-muted);">Enlace Administrador Generado:</span>
      <a href="#" id="resultado-link" class="resultado-link" target="_blank"></a>

      <div style="display: flex; gap: 8px;">
        <button class="btn" style="flex: 1; padding: 8px; font-size: 12px;" onclick="copiarEnlace()">📋 Copiar Link</button>
        <button class="btn" style="flex: 1; padding: 8px; font-size: 12px; background: #222;" onclick="abrirEnlace()">🔗 Abrir</button>
      </div>

      <button id="btn-estado" class="btn btn-toggle" onclick="alternarEstadoLocal()">🚫 Bloquear / Desbloquear Local</button>
    </div>

    <div class="contacto-info">
      Soporte: WhatsApp <b>+56966648585</b> | Correo: <b>appmenunova@gmail.com</b>
    </div>
  </div>

  <script>
    const BACKEND_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://appmenu-tavr.onrender.com';

    let localSlugGenerado = '';
    let estaActivo = true;

    async function generarEnlaceDemo() {
      const nombre = document.getElementById('demo-nombre').value.trim();
      if (!nombre) return alert("Por favor ingresa un nombre para el local.");

      const slug = nombre.toLowerCase().replace(/[^a-z0-9]/g, '');
      localSlugGenerado = slug;

      const hoy = new Date();
      const vencimiento = new Date(hoy.setDate(hoy.getDate() + 30));

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/alta`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre: nombre,
            rut: 'DEMO-30DIAS',
            correo: 'demo@appmenu.cl',
            password: '123',
            activo: true,
            fechaCreacion: new Date().toISOString(),
            fechaVencimiento: vencimiento.toISOString()
          })
        });

        if (res.ok) {
          const baseUrl = window.location.origin + window.location.pathname.replace('demo.html', 'admin.html');
          const finalUrl = `${baseUrl}?local=${encodeURIComponent(slug)}`;

          document.getElementById('resultado-link').href = finalUrl;
          document.getElementById('resultado-link').innerText = finalUrl;
          document.getElementById('resultado-box').style.display = 'block';

          estaActivo = true;
          actualizarBotonEstado();
        } else {
          alert("Error al registrar el demo en la base de datos.");
        }
      } catch (e) {
        alert("Error de conexión con el servidor.");
      }
    }

    async function alternarEstadoLocal() {
      if (!localSlugGenerado) return;
      estaActivo = !estaActivo;

      try {
        const res = await fetch(`${BACKEND_URL}/api/locales/estado`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ local: localSlugGenerado, activo: estaActivo })
        });

        if (res.ok) {
          actualizarBotonEstado();
          alert(`El local ha sido ${estaActivo ? 'DESBLOQUEADO / ACTIVADO' : 'BLOQUEADO / DESACTIVADO'} exitosamente.`);
        } else {
          estaActivo = !estaActivo;
          alert("No se pudo cambiar el estado.");
        }
      } catch (e) {
        estaActivo = !estaActivo;
        alert("Error de red al intentar actualizar el estado.");
      }
    }

    function actualizarBotonEstado() {
      const btn = document.getElementById('btn-estado');
      if (estaActivo) {
        btn.innerText = "🚫 Bloquear Sistema (Cambiar a Rojo)";
        btn.className = "btn btn-toggle";
      } else {
        btn.innerText = "✅ Desbloquear Sistema (Activar)";
        btn.className = "btn btn-toggle activo";
      }
    }

    function copiarEnlace() {
      const url = document.getElementById('resultado-link').innerText;
      navigator.clipboard.writeText(url);
      alert("📋 Enlace copiado al portapapeles.");
    }

    function abrirEnlace() {
      const url = document.getElementById('resultado-link').innerText;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
